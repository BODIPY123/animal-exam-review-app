<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>江苏省实验动物从业人员上岗考试｜动物实验类复习助手</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#697386;--line:#e5e9f2;--primary:#315efb;--primary2:#2449d8;--ok:#1f9d63;--bad:#d9485f;--warn:#d08b14;--shadow:0 10px 30px rgba(24,33,47,.07);--radius:16px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:1180px;margin:0 auto;padding:20px}.header{display:flex;gap:16px;align-items:center;justify-content:space-between;margin-bottom:16px}.title h1{font-size:22px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 13px;color:var(--text)}.btn:hover{border-color:#b9c3d6}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}.btn.danger{color:var(--bad)}.btn.small{padding:6px 9px;font-size:13px}
.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.sidebar{padding:16px;position:sticky;top:16px;height:fit-content}
.section-title{font-size:13px;color:var(--muted);margin:14px 0 8px;font-weight:700}.section-title:first-child{margin-top:0}.mode-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{padding:9px 7px;border:1px solid var(--line);background:#fff;border-radius:10px}.mode.active{border-color:var(--primary);background:#eef2ff;color:var(--primary);font-weight:700}
.filters{display:grid;gap:9px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}select,input[type="number"],input[type="search"],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px;background:#fff;color:var(--text)}
.checks{display:flex;gap:7px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:6px 9px;font-size:13px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--muted)}
.progress{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin-top:8px}.bar{height:100%;background:var(--primary);width:0}.main{display:grid;gap:12px}.toolbar{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.breadcrumb{font-size:13px;color:var(--muted)}
.qcard{padding:22px}.qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.badge{display:inline-flex;gap:6px;align-items:center;border-radius:999px;background:#eef2ff;color:var(--primary);padding:5px 9px;font-size:12px;font-weight:700}.qactions{display:flex;gap:7px}.star.on{color:#d88d00;border-color:#e8c777;background:#fff8e6}
.stem{font-size:20px;line-height:1.65;font-weight:650;white-space:pre-wrap;margin:8px 0 18px}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:13px 14px;border-radius:12px;transition:.15s}.option:hover{border-color:#a8b5cb}.option.selected{border-color:var(--primary);background:#f1f4ff}.option.correct{border-color:var(--ok);background:#eefaf4}.option.wrong{border-color:var(--bad);background:#fff1f3}
.letter{flex:0 0 28px;height:28px;border-radius:8px;background:#eef1f6;display:grid;place-items:center;font-weight:800}.option.selected .letter{background:var(--primary);color:#fff}.opttext{line-height:1.55;white-space:pre-wrap}.submit-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.feedback{margin-top:16px;border-radius:12px;padding:13px 14px;display:none;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#edf9f3;color:#166a45}.feedback.bad{background:#fff0f2;color:#a62d42}.feedback.info{background:#f5f7fb;color:#445066}
.note-wrap{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}.note-wrap summary{cursor:pointer;color:var(--muted)}.note-wrap textarea{min-height:80px;margin-top:9px;resize:vertical}.raw{margin-top:12px;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafbfe;white-space:pre-wrap;font-size:13px;line-height:1.6;color:#4f5b6e;display:none}.raw.show{display:block}
.navbar{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.navmid{font-size:13px;color:var(--muted)}.empty{padding:56px 24px;text-align:center;color:var(--muted)}
dialog{border:0;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 28px);box-shadow:0 30px 80px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(15,23,42,.38)}.modal{padding:20px}.modal h3{margin:0 0 12px}.modal .form{display:grid;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.audit{font-size:13px;line-height:1.7}.audit .pass{color:var(--ok);font-weight:700}.audit .warn{color:var(--warn);font-weight:700}
.exam-banner{display:none;padding:10px 14px;background:#fff8e6;border:1px solid #f1d28a;border-radius:12px;color:#7a5600}.exam-banner.show{display:block}.footer-note{font-size:12px;color:var(--muted);text-align:center;padding:5px 0 18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}.sidebar{position:static}.header{align-items:flex-start;flex-direction:column}.qcard{padding:16px}.stem{font-size:18px}.toolbar{align-items:flex-start;flex-direction:column}.mode-list{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.app{padding:10px}.mode-list{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.qactions{flex-wrap:wrap}.option{padding:12px 10px}}

.explain-box{margin-top:12px;border:1px solid #d9e2ff;background:#f6f8ff;border-radius:12px;padding:13px 14px;line-height:1.75}
.explain-title{font-weight:800;color:#2848b8;margin-bottom:5px}
.explain-tag{display:inline-block;font-size:11px;font-weight:700;color:#6b4b00;background:#fff5d8;border:1px solid #efd18a;border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.explain-text{color:#334155;white-space:pre-wrap}

</style>
</head>
<body>
<div class="app">
<header class="header"><div class="title"><h1>实验动物上岗考试 · 动物实验类复习助手</h1><p>离线单文件｜题库原文内置｜进度自动保存在本机浏览器</p></div><div class="top-actions"><button class="btn" id="auditBtn">完整性自检</button><button class="btn" id="exportBtn">导出进度</button><button class="btn" id="importBtn">导入进度</button><input type="file" id="importFile" accept=".json" hidden></div></header>
<div class="grid">
<aside class="panel sidebar">
<div class="section-title">复习模式</div><div class="mode-list"><button class="mode active" data-mode="sequence">顺序复习</button><button class="mode" data-mode="random">随机练习</button><button class="mode" data-mode="wrong">错题本</button><button class="mode" data-mode="favorite">收藏题</button><button class="mode" data-mode="unanswered">未答题</button><button class="mode" data-mode="exam">模拟考试</button></div>
<div class="section-title">筛选</div><div class="filters"><div class="checks"><label class="chip"><input type="checkbox" class="typeFilter" value="judgment" checked>判断</label><label class="chip"><input type="checkbox" class="typeFilter" value="single" checked>单选</label><label class="chip"><input type="checkbox" class="typeFilter" value="multiple" checked>多选</label></div><input type="search" id="searchInput" placeholder="搜索题干、选项或原文"><div class="row"><input type="number" id="fromNo" min="1" placeholder="起始题号"><span>—</span><input type="number" id="toNo" min="1" placeholder="结束题号"></div><button class="btn" id="applyFilter">应用筛选</button></div>
<div class="section-title">学习统计</div><div class="stats"><div class="stat"><b id="answeredStat">0</b><span>已作答</span></div><div class="stat"><b id="accuracyStat">—</b><span>正确率</span></div><div class="stat"><b id="wrongStat">0</b><span>当前错题</span></div><div class="stat"><b id="favStat">0</b><span>收藏</span></div></div><div class="progress"><div class="bar" id="progressBar"></div></div><div id="progressText" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
<div class="section-title">数据操作</div><div class="row"><button class="btn small" id="clearCurrentBtn">清除本题记录</button><button class="btn small danger" id="resetBtn">重置全部</button></div>
</aside>
<main class="main"><div class="exam-banner" id="examBanner"></div><div class="panel toolbar"><div class="breadcrumb" id="listInfo">载入中…</div><div class="row"><button class="btn small" id="shuffleBtn">打乱当前列表</button><button class="btn small" id="jumpBtn">跳到题号</button></div></div><section class="card qcard" id="qCard"></section><div class="panel navbar"><button class="btn" id="prevBtn">← 上一题</button><div class="navmid" id="positionInfo">0 / 0</div><button class="btn primary" id="nextBtn">下一题 →</button></div><div class="footer-note">题目与答案以你上传的题库为依据；程序不使用网络，也不擅自修改原题答案。</div></main>
</div></div>

<dialog id="auditDialog"><div class="modal"><h3>题库完整性自检</h3><div class="audit" id="auditContent"></div><div class="modal-actions"><button class="btn primary" onclick="auditDialog.close()">关闭</button></div></div></dialog>
<dialog id="examDialog"><div class="modal"><h3>模拟考试设置</h3><div class="form"><label>题量 <select id="examCount"><option>20</option><option>50</option><option selected>100</option><option>200</option></select></label><label>题型 <select id="examType"><option value="all">混合</option><option value="judgment">仅判断题</option><option value="single">仅单选题</option><option value="multiple">仅多选题</option></select></label><label><input type="checkbox" id="examWrongFirst"> 优先从错题中抽取</label></div><div class="modal-actions"><button class="btn" onclick="examDialog.close()">取消</button><button class="btn primary" id="startExamBtn">开始考试</button></div></div></dialog>

<script>
const QUESTIONS=[{"id":"J001","type":"judgment","number":1,"stem":"病毒是自然界已知的最小的微生物，不会危害实验动物的健康和干扰动物实验的结果","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"病毒是自然界已知的最小的微生物，不会危害实验动物的健康和干扰动物实验的结果   （×）","explanation":"错误点在“不会危害和干扰”。病毒可感染实验动物，既能影响动物健康，也可能改变生理、免疫等指标，从而干扰实验结果。"},{"id":"J002","type":"judgment","number":2,"stem":"实验动物科学是研究实验动物的一门新兴学科。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物科学是研究实验动物的一门新兴学科。   （×）","explanation":"实验动物科学不只是“研究实验动物”本身，而是围绕实验动物标准化、动物实验规范化及相关基础与应用问题形成的综合性学科。"},{"id":"J003","type":"judgment","number":3,"stem":"实验动物学是动物学的一门分支学科。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物学是动物学的一门分支学科。   （×）","explanation":"实验动物科学不是动物学的简单分支，而是一门融合遗传、微生物、营养、环境、医学和实验技术等内容的独立综合性学科。"},{"id":"J004","type":"judgment","number":4,"stem":"实验动物科学研究实验动物最终目的是实现实验动物标准化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物科学研究实验动物最终目的是实现实验动物标准化。   （√）"},{"id":"J005","type":"judgment","number":5,"stem":"实验动物科学就是研究关于实验动物标准化和动物实验规范化的科学。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物科学就是研究关于实验动物标准化和动物实验规范化的科学。   （√）"},{"id":"J006","type":"judgment","number":6,"stem":"实验动物科学是生命科学的重要组成部分，是生命科学的基础和条件，因此它是附属于生命科学的一门非独立学科。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物科学是生命科学的重要组成部分，是生命科学的基础和条件，因此它是附属于生命科学的一门非独立学科。   （×）","explanation":"实验动物科学虽然是生命科学的重要基础和条件，但已经形成独立的综合性学科体系，不能称为“非独立学科”。"},{"id":"J007","type":"judgment","number":7,"stem":"实验动物科学是衡量一个国家或一个科研单位科学研究水平的重要标志。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物科学是衡量一个国家或一个科研单位科学研究水平的重要标志。   （√）"},{"id":"J008","type":"judgment","number":8,"stem":"实验动物科学已形成了一门独立的综合性基础科学门类，成为生命科学的重要前沿学科。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物科学已形成了一门独立的综合性基础科学门类，成为生命科学的重要前沿学科。   （√）"},{"id":"J009","type":"judgment","number":9,"stem":"实验动物科学是多个相关学科相互融合、相互渗透的中心。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物科学是多个相关学科相互融合、相互渗透的中心。   （√）"},{"id":"J010","type":"judgment","number":10,"stem":"实验动物医学就是研究实验动物的各种疾病包括传染性疾病、营养代谢性疾病、遗传性疾病以及恶劣环境所致疾病的科学。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物医学就是研究实验动物的各种疾病包括传染性疾病、营养代谢性疾病、遗传性疾病以及恶劣环境所致疾病的科学。   （×）","explanation":"实验动物医学的内容不只限于各种疾病，还包括实验动物微生物质量控制、疾病对实验的干扰以及人畜共患病防控等内容。"},{"id":"J011","type":"judgment","number":11,"stem":"凡用于科学实验的动物就称为实验动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"凡用于科学实验的动物就称为实验动物。   （×）","explanation":"“实验动物”是经人工培育、遗传和微生物等质量受到控制、用于科研教学等目的的动物；凡用于实验的动物统称“实验用动物”，两者不能混同。"},{"id":"J012","type":"judgment","number":12,"stem":"实验动物都是哺乳动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物都是哺乳动物。   （×）","explanation":"实验动物并不都是哺乳动物，还可包括鸟类、鱼类、两栖类等多种动物。"},{"id":"J013","type":"judgment","number":13,"stem":"比较医学是对动物的健康和疾病状态进行类比研究的科学。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"比较医学是对动物的健康和疾病状态进行类比研究的科学。   （×）","explanation":"比较医学强调把人和动物的疾病、生命现象及其发生发展规律进行比较研究，而不是只比较动物之间的健康和疾病状态。"},{"id":"J014","type":"judgment","number":14,"stem":"近交系动物、免疫缺陷动物和悉生动物等新的实验动物品种或新的模型动物的培育成功为实验动物科学独立于其他学科奠定了基础。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系动物、免疫缺陷动物和悉生动物等新的实验动物品种或新的模型动物的培育成功为实验动物科学独立于其他学科奠定了基础。   （√）"},{"id":"J015","type":"judgment","number":15,"stem":"每一个新的实验动物种系或新的模型动物的出现都给生命科学带来了革命性的变化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"每一个新的实验动物种系或新的模型动物的出现都给生命科学带来了革命性的变化。   （√）"},{"id":"J016","type":"judgment","number":16,"stem":"实验动物标准化和动物实验规范化是国际实验动物科学发展的潮流，势在必行。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物标准化和动物实验规范化是国际实验动物科学发展的潮流，势在必行。   （√）"},{"id":"J017","type":"judgment","number":17,"stem":"实验动物标准化和法制化管理，使21世纪世界各国实验动物发展的总趋势。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物标准化和法制化管理，使21世纪世界各国实验动物发展的总趋势。   （√）"},{"id":"J018","type":"judgment","number":18,"stem":"转基因动物模型因为投入成本大、技术要求高、实用性不强，导致各国的生产企业在转基因动物模型的开发和生产上踯躅不前。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"转基因动物模型因为投入成本大、技术要求高、实用性不强，导致各国的生产企业在转基因动物模型的开发和生产上踯躅不前。   （×）","explanation":"转基因动物模型具有重要科研和应用价值，各国一直在积极开发和利用，不能概括为“实用性不强、踯躅不前”。"},{"id":"J019","type":"judgment","number":19,"stem":"21世纪实验者将可在网络上查找、购买自己所需的实验动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"21世纪实验者将可在网络上查找、购买自己所需的实验动物。   （√）"},{"id":"J020","type":"judgment","number":20,"stem":"动物保护与动物福利将成为市场准入的重要条件。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物保护与动物福利将成为市场准入的重要条件。   （√）"},{"id":"J021","type":"judgment","number":21,"stem":"测定人体30亿个核苷酸序列是生命科学研究的一个新的开端，结构基因组学将成为21世纪生物学的核心。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"测定人体30亿个核苷酸序列是生命科学研究的一个新的开端，结构基因组学将成为21世纪生物学的核心。   （×）","explanation":"人类基因组序列测定完成后，研究重点逐步由结构基因组转向功能基因组；题干把“功能基因组学”误写成了“结构基因组学”。"},{"id":"J022","type":"judgment","number":22,"stem":"人类第一个基因组草图的完成，标志着生命科学将进入结构基因组研究的时代。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"人类第一个基因组草图的完成，标志着生命科学将进入结构基因组研究的时代。   （×）","explanation":"基因组草图完成标志着研究进入后基因组时代，重点转向基因功能及相互作用研究，而不是继续停留在结构基因组阶段。"},{"id":"J023","type":"judgment","number":23,"stem":"目前人们对确定的3万多个人类基因的功能仍不清楚，因此生命科学随着进入到一个新的纪元——后基因组时代，即结构基因组的研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"目前人们对确定的3万多个人类基因的功能仍不清楚，因此生命科学随着进入到一个新的纪元——后基因组时代，即结构基因组的研究。   （×）","explanation":"后基因组时代的重点是功能基因组研究，即阐明基因功能、调控和相互作用，不是结构基因组研究。"},{"id":"J024","type":"judgment","number":24,"stem":"“3R”运动的最终目的是终止动物实验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"“3R”运动的最终目的是终止动物实验。   （×）","explanation":"3R原则的目的不是终止所有动物实验，而是在科学可行的前提下实行替代、减少和优化，降低动物使用数量和痛苦。"},{"id":"J025","type":"judgment","number":25,"stem":"动物实验的减少原则就是在任何情况下都要绝对减少动物实验的数量。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物实验的减少原则就是在任何情况下都要绝对减少动物实验的数量。   （×）","explanation":"“减少”不是在任何情况下机械地少用动物，而是在保证实验设计科学性和结果可靠性的前提下使用达到目的所需的最少数量。"},{"id":"J026","type":"judgment","number":26,"stem":"动物实验的替代原则就是力求以动物实验替代临床试验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物实验的替代原则就是力求以动物实验替代临床试验。   （×）","explanation":"“替代”是尽可能用低等生物、细胞、组织、器官、计算机模拟等方法替代动物实验，而不是用动物实验去替代临床试验。"},{"id":"J027","type":"judgment","number":27,"stem":"动物实验的替代原则就是以低等生物、微生物或细胞、组织、器官甚至电子计算机模拟、替代或动物实验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物实验的替代原则就是以低等生物、微生物或细胞、组织、器官甚至电子计算机模拟、替代或动物实验。   （√）"},{"id":"J028","type":"judgment","number":28,"stem":"动物实验的优化原则就是选用高质量的实验动物进行动物实验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物实验的优化原则就是选用高质量的实验动物进行动物实验。   （×）","explanation":"“优化/精细化”不仅是选高质量动物，更重要的是优化实验技术路线、操作和护理，减少动物紧张、痛苦和不适并提高结果质量。"},{"id":"J029","type":"judgment","number":29,"stem":"动物实验的优化原则主要指实验技术路线和手段的精细设计和选择，减少实验动物的紧张与不适，减少动物的痛苦，从而使动物实验有更准确的结果。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物实验的优化原则主要指实验技术路线和手段的精细设计和选择，减少实验动物的紧张与不适，减少动物的痛苦，从而使动物实验有更准确的结果。   （√）"},{"id":"J030","type":"judgment","number":30,"stem":"“3R”运动反映了实验动物科学由技术上严格要求转向人道主义的管理，提倡实验动物福利与动物保护的国际总趋势。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"“3R”运动反映了实验动物科学由技术上严格要求转向人道主义的管理，提倡实验动物福利与动物保护的国际总趋势。   （√）"},{"id":"J031","type":"judgment","number":31,"stem":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使动物浪费严重。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使动物浪费严重。   （√）"},{"id":"J032","type":"judgment","number":32,"stem":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使科研论文的科学性及可行性降低，在国际学术界得不到公认。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使科研论文的科学性及可行性降低，在国际学术界得不到公认。   （√）"},{"id":"J033","type":"judgment","number":33,"stem":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使生物制剂、药品的安全性、有效性评价试验得不到承认，影响出口。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物质量的不标准，会导致动物实验的敏感性、重复性差，致使生物制剂、药品的安全性、有效性评价试验得不到承认，影响出口。   （√）"},{"id":"J034","type":"judgment","number":34,"stem":"若一个科研课题的经费为5万元，动物耗费5千元，占整个课题经费1/10，但1/10的经费可影响5万元经费的成败。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"若一个科研课题的经费为5万元，动物耗费5千元，占整个课题经费1/10，但1/10的经费可影响5万元经费的成败。   （√）"},{"id":"J035","type":"judgment","number":35,"stem":"动物实验可用计算机模拟、细胞培养等体外方法替代，因此实验动物在医学生物学研究中的应用是可以替代的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物实验可用计算机模拟、细胞培养等体外方法替代，因此实验动物在医学生物学研究中的应用是可以替代的。   （×）","explanation":"体外培养和计算机模拟可替代一部分动物实验，但不能完全替代整体动物在复杂生理、病理和药效安全性研究中的作用。"},{"id":"J036","type":"judgment","number":36,"stem":"所谓动物福利，就是让动物在康乐的状态下生存。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"所谓动物福利，就是让动物在康乐的状态下生存。   （√）"},{"id":"J037","type":"judgment","number":37,"stem":"不同的病毒对自然宿主、人和其他动物的致病性是不一样的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"不同的病毒对自然宿主、人和其他动物的致病性是不一样的。   （√）"},{"id":"J038","type":"judgment","number":38,"stem":"病毒mRNA在转录时，必须利用宿主细胞的酶及其他物质。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"病毒mRNA在转录时，必须利用宿主细胞的酶及其他物质。   （√）"},{"id":"J039","type":"judgment","number":39,"stem":"实验动物病毒根据病毒对自然宿主、人和其他动物的致病性，以及干扰生物医学研究、污染生物制剂和肿瘤移植物的程度分类。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物病毒根据病毒对自然宿主、人和其他动物的致病性，以及干扰生物医学研究、污染生物制剂和肿瘤移植物的程度分类。   （√）"},{"id":"J040","type":"judgment","number":40,"stem":"人畜共患病原体对自然宿主、人和其他动物均有较强的致病性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"人畜共患病原体对自然宿主、人和其他动物均有较强的致病性。   （√）"},{"id":"J041","type":"judgment","number":41,"stem":"烈性传染病病原体对自然宿主致病性很强，常引起爆发流行，甚至毁灭整个种群。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"烈性传染病病原体对自然宿主致病性很强，常引起爆发流行，甚至毁灭整个种群。   （√）"},{"id":"J042","type":"judgment","number":42,"stem":"病毒对干燥的抵抗力与病毒的种类有关。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"病毒对干燥的抵抗力与病毒的种类有关。   （√）"},{"id":"J043","type":"judgment","number":43,"stem":"病毒不耐热，大多数病毒在55℃经30分钟即被灭活。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"病毒不耐热，大多数病毒在55℃经30分钟即被灭活。   （√）"},{"id":"J044","type":"judgment","number":44,"stem":"病毒对低温的抵抗力强，通常温度越低，病毒存活的时间越长。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"病毒对低温的抵抗力强，通常温度越低，病毒存活的时间越长。   （√）"},{"id":"J045","type":"judgment","number":45,"stem":"强酸和强碱均能杀灭病毒，强酸作用更大。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"强酸和强碱均能杀灭病毒，强酸作用更大。   （×）","explanation":"强酸、强碱均可影响或灭活病毒，但不能笼统认为“强酸作用更大”；不同病毒对酸碱的耐受性不同。"},{"id":"J046","type":"judgment","number":46,"stem":"所有病毒对电磁辐射都敏感，特别是X射线、γ射线和紫外线。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"所有病毒对电磁辐射都敏感，特别是X射线、γ射线和紫外线。   （√）"},{"id":"J047","type":"judgment","number":47,"stem":"病毒对一般的抗菌物质如青霉素、链霉素对病毒敏感。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"病毒对一般的抗菌物质如青霉素、链霉素对病毒敏感。   （×）","explanation":"青霉素、链霉素等抗菌药主要作用于细菌，对病毒一般无效，不能说病毒对这些抗菌药敏感。"},{"id":"J048","type":"judgment","number":48,"stem":"细菌有细胞壁、细胞膜、细胞浆、及细胞核等基本构造。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"细菌有细胞壁、细胞膜、细胞浆、及细胞核等基本构造。   （√）"},{"id":"J049","type":"judgment","number":49,"stem":"水是组成细菌的最基本的成分，约占菌体总重量的75－80%。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"水是组成细菌的最基本的成分，约占菌体总重量的75－80%。   （√）"},{"id":"J050","type":"judgment","number":50,"stem":"任何细菌生长繁殖均需要合适的营养条件、适宜的环境温度和pH值以及渗透 xt":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"宿主是指为寄生虫提供生活居住的场所和提供营养的生物体。   （√）"},{"id":"J322","type":"judgment","number":322,"stem":"带虫动物往往被认为是健康的动物，所以它的存在对实验动物的危害并不是很大。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"带虫动物往往被认为是健康的动物，所以它的存在对实验动物的危害并不是很大。   （×）","explanation":"带虫动物即使外观健康，也可作为传染源，并会改变宿主的生理、免疫等状态，对实验动物群危害不能忽视。"},{"id":"J323","type":"judgment","number":323,"stem":"实验动物感染寄生虫后，通常会吸收宿主的营养，从而影响宿主的生长发育，但是不会对动物实验结果造成影响。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物感染寄生虫后，通常会吸收宿主的营养，从而影响宿主的生长发育，但是不会对动物实验结果造成影响。   （×）","explanation":"寄生虫感染不仅影响生长发育，还会改变生理、生化和免疫指标，因此可明显干扰动物实验结果。"},{"id":"J324","type":"judgment","number":324,"stem":"同其他许多传染病一样，病原真菌也大部分为人畜共患病原，但比其他类型微生物感染性低，一般皆为慢性过程，多呈散发性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"同其他许多传染病一样，病原真菌也大部分为人畜共患病原，但比其他类型微生物感染性低，一般皆为慢性过程，多呈散发性。   （√）"},{"id":"J325","type":"judgment","number":325,"stem":"皮肤真菌感染实验动物后很难根除，常常需全群淘汰，对所有的用具和房间进行彻底的熏蒸消毒，也可以对动物进行药浴。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"皮肤真菌感染实验动物后很难根除，常常需全群淘汰，对所有的用具和房间进行彻底的熏蒸消毒，也可以对动物进行药浴。   （√）"},{"id":"J326","type":"judgment","number":326,"stem":"须发癣是人畜共患病原，所以要注意公共卫生，防止人和动物间的相互感染。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"须发癣是人畜共患病原，所以要注意公共卫生，防止人和动物间的相互感染。   （√）"},{"id":"J327","type":"judgment","number":327,"stem":"实验动物组织胞浆菌感染临床上慢性型呈流感状，体温升高，烦躁不安。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物组织胞浆菌感染临床上慢性型呈流感状，体温升高，烦躁不安。   （×）","explanation":"组织胞浆菌感染出现流感样、发热等表现不能简单归为“慢性型”的典型表现；急、慢性过程的临床特点不同。"},{"id":"J328","type":"judgment","number":328,"stem":"实验动物组织胞浆菌的控制重在预防，对饲养的实验动物要加强卫生管理，对饲养室周围的环境和土壤进行化学消毒亦是有效的预防办法。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物组织胞浆菌的控制重在预防，对饲养的实验动物要加强卫生管理，对饲养室周围的环境和土壤进行化学消毒亦是有效的预防办法。   （√）"},{"id":"J329","type":"judgment","number":3 "},{"label":"×","text":"错误"}],"answer":"×","raw":"螨类只寄生于实验动物的体表，因此在诊断时刮去患部的皮屑，经处理后在显微镜下检查有无虫体和虫卵，即可做出确切的诊断。   （×）","explanation":"不同螨类可寄生于皮肤表面、毛囊、皮内或外耳道等部位，不能说螨只寄生体表；诊断应按寄生部位取材镜检。"},{"id":"J337","type":"judgment","number":337,"stem":"粪便内的原虫的病原学检查，主要是对球虫卵囊和结肠小袋虫的检查。可以采用蠕虫学粪便检查方法中的直接涂片法和饱和食盐水检查法来检查。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"粪便内的原虫的病原学检查，主要是对球虫卵囊和结肠小袋虫的检查。可以采用蠕虫学粪便检查方法中的直接涂片法和饱和食盐水检查法来检查。   （√）"},{"id":"J338","type":"judgment","number":338,"stem":"弓形虫病主要是由刚第弓形虫引起的一种世界范围内分布的人畜共患原虫病。其主要特征是引起流产、死胎和胎儿畸形。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"弓形虫病主要是由刚第弓形虫引起的一种世界范围内分布的人畜共患原虫病。其主要特征是引起流产、死胎和胎儿畸形。   （√）"},{"id":"J339","type":"judgment","number":339,"stem":"弓形虫在中间宿主体内进行有性繁殖，即增生和形成包囊的阶段。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"弓形虫在中间宿主体内进行有性繁殖，即增生和形成包囊的阶段。   （×）","explanation":"弓形虫的有性繁殖发生在终末宿主猫科动物体内；在中间宿主体内主要进行无性增殖并形成组织包囊。"},{"id":"J340","type":"judgment","number":340,"stem":"猫因吃进感染弓形虫的中间宿主组织或食入孢子化卵囊而被感染。食入缓殖子后，潜伏期为10到12天。食入速殖子，则为5到10天。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"猫因吃进感染弓形虫的中间宿主组织或食入孢子化卵囊而被感染。食入缓殖子后，潜伏期为10到12天。食入速殖子，则为5到10天。   （×）","explanation":"猫摄入含缓殖子的组织后通常较快进入排卵囊阶段，摄入速殖子或卵囊后的潜伏过程不同；题干所列两类阶段及具体天数关系不正确。"},{"id":"J341","type":"judgment","number":341,"stem":"弓形虫病预防主要是着眼于防止实验动物的饲料、饮水被猫粪便污染，消灭野鼠。为避免人体感染，接触实验动物后要清洗消毒，儿童不要与猫狗玩耍，孕妇更不要与猫接触。治疗可用磺胺类药物和抗菌增效剂合用，效果较好。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"弓形虫病预防主要是着眼于防止实验动物的饲料、饮水被猫粪便污染，消灭野鼠。为避免人体感染，接触实验动物后要清洗消毒，儿童不要与猫狗玩耍，孕妇更不要与猫接触。治疗可用磺胺类药物和抗菌增效剂合用，效果较好。   （√）"},{"id":"J342","type":"judgment","number":342,"stem":"兔球虫病是家兔的一种重要的寄生虫病，死亡率极高。主要以接触传播的方式来传播病原，动物食入被虫卵污染的饲料而感染。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"兔球虫病是家兔的一种重要的寄生虫病，死亡率极高。主要以接触传播的方式来传播病原，动物食入被虫卵污染的饲料而感染。   （×）","explanation":"兔球虫病主要经消化道传播，动物摄入成熟卵囊而感染，不能把主要传播方式概括为接触传播。"},{"id":"J343","type":"judgment","number":343,"stem":"3月龄家兔最易感球虫，且死亡率极高。感染途径多是通过饲料和饮水以及仔兔在哺乳时 吃到乳房上沾污的球虫卵囊而感染。此外，饲养员、工具、野鼠、苍蝇也可机械的搬运球虫卵囊而传播球虫病。一般在干燥季节流行。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"3月龄家兔最易感球虫，且死亡率极高。感染途径多是通过饲料和饮水以及仔兔在哺乳时 吃到乳房上沾污的球虫卵囊而感染。此外，饲养员、工具、野鼠、苍蝇也可机械的搬运球虫卵囊而传播球虫病。一般在干燥季节流行。   （×）","explanation":"幼兔特别是断奶前后较易感，潮湿、污染环境有利于球虫卵囊发育和传播；不能说该病一般在干燥季节流行。"},{"id":"J344","type":"judgment","number":344,"stem":"实验动物球虫病可根据流行病学资料、临床症状及病理解剖结果可初步诊断。用饱和盐水漂浮法检查粪便中的卵囊，可以确诊。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物球虫病可根据流行病学资料、临床症状及病理解剖结果可初步诊断。用饱和盐水漂浮法检查粪便中的卵囊，可以确诊。   （√）"},{"id":"J345","type":"judgment","number":345,"stem":"实验动物感染球虫病后，不仅会造成动物健康水平的下降，而且会对动物的各项肝功能指标造成影响，从而使得实验结果产生波动，甚至会对动物实验结果得出错误的结论。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物感染球虫病后，不仅会造成动物健康水平的下降，而且会对动物的各项肝功能指标造成影响，从而使得实验结果产生波动，甚至会对动物实验结果得出错误的结论。   （√）"},{"id":"J346","type":"judgment","number":346,"stem":"螨病的主要临床症状主要是嘴、鼻周围及脚爪发炎，动物表现不安、剧痒，会用脚搔嘴、鼻，患部结痂、变硬，病变部位出现皮屑和血痂，患部脱毛，皮肤增厚失去弹性，形成皱褶。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"螨病的主要临床症状主要是嘴、鼻周围及脚爪发炎，动物表现不安、剧痒，会用脚搔嘴、鼻，患部结痂、变硬，病变部位出现皮屑和血痂，患部脱毛，皮肤增厚失去弹性，形成皱褶。   （√）"},{"id":"J347","type":"judgment","number":347,"stem":"发现实验动物感染螨虫后，患病动物不需要隔离、淘汰，但要对笼器具及周围环境彻底消毒，保持房舍干燥通风。加强动物饲养管理和卫生防疫，加强检疫，增强动物的抗病力。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"发现实验动物感染螨虫后，患病动物不需要隔离、淘汰，但要对笼器具及周围环境彻底消毒，保持房舍干燥通风。加强动物饲养管理和卫生防疫，加强检疫，增强动物的抗病力。   （×）","explanation":"发现螨虫感染后，应隔离并按动物等级和群体状况采取治疗或淘汰，同时彻底清洁消毒，不能让患病动物继续与健康群混养。"},{"id":"J348","type":"judgment","number":348,"stem":"螨虫感染实验动物后会不断的掠夺宿主的营养，不断地从宿主皮下组织中吸血，造成动物慢性贫血。螨、虱等在吸血时，能分泌有毒性的唾液，刺激宿主的神经末梢，产生痒感，使动物骚动不安，影响采食和休息，最终动物消瘦，发育不良，降低对其他疾病的抵抗力。另外感染螨病后也会影响实验动动物物正常生理生化指标，从而干扰动物实验的结果。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"螨虫感染实验动物后会不断的掠夺宿主的营养，不断地从宿主皮下组织中吸血，造成动物慢性贫血。螨、虱等在吸血时，能分泌有毒性的唾液，刺激宿主的神经末梢，产生痒感，使动物骚动不安，影响采食和休息，最终动物消瘦，发育不良，降低对其他疾病的抵抗力。另外感染螨病后也会影响实验动动物物正常生理生化指标，从而干扰动物实验的结果。   （√）"},{"id":"J349","type":"judgment","number":349,"stem":"实验动物感染血液寄生虫后，不断地掠夺动物的营养（主要是吸血），久而久之造成动物贫血。血液寄生虫还会因不断地在动物脏器中穿行而对动物机体产生机械性损伤，但是对宿主的生理、生化和免疫系统一般不会造成影响。所以说，实验动物感染血液寄生虫后对实验研究的干扰不必引起重视。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物感染血液寄生虫后，不断地掠夺动物的营养（主要是吸血），久而久之造成动物贫血。血液寄生虫还会因不断地在动物脏器中穿行而对动物机体产生机械性损伤，但是对宿主的生理、生化和免疫系统一般不会造成影响。所以说，实验动物感染血液寄生虫后对实验研究的干扰不必引起重视。   （×）","explanation":"血液寄生虫会造成贫血和组织损伤，还可改变宿主生理、生化和免疫指标，因而会严重干扰实验研究。"},{"id":"J350","type":"judgment","number":350,"stem":"血液寄生虫的传播与野鼠密切相关，因此要加强卫生防疫管理，切断传播途径，对患病动物进行隔离治疗。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"血液寄生虫的传播与野鼠密切相关，因此要加强卫生防疫管理，切断传播途径，对患病动物进行隔离治疗。   （×）","explanation":"实验动物寄生虫控制以预防、切断传播途径和消除传染源为主；对感染动物是否治疗要结合实验目的和质量等级，不能简单把“隔离治疗”作为统一原则。"},{"id":"J351","type":"judgment","number":351,"stem":"实验动物感染寄生虫后，不仅虫体对动物机体造成一定的损害，而且动物机体也对虫体产生相应的反应，使得动物机体的生理、生化以及免疫学指标发生改变，进而影响到实验结果。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物感染寄生虫后，不仅虫体对动物机体造成一定的损害，而且动物机体也对虫体产生相应的反应，使得动物机体的生理、生化以及免疫学指标发生改变，进而影响到实验结果。   （√）"},{"id":"J352","type":"judgment","number":352,"stem":"实验动物感染寄生虫后对动物群体影响没有病毒性疾病以及细菌性疾病危害大，所以对实验动物寄生虫病的控制不值得引起高度重视。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物感染寄生虫后对动物群体影响没有病毒性疾病以及细菌性疾病危害大，所以对实验动物寄生虫病的控制不值得引起高度重视。   （×）","explanation":"寄生虫病同样能够影响动物健康和实验结果，因此实验动物寄生虫质量控制必须受到高度重视。"},{"id":"J353","type":"judgment","number":353,"stem":"ICLAS是一个以促进实验动物质量、健康和应用达到高标准的官方组织。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"ICLAS是一个以促进实验动物质量、健康和应用达到高标准的官方组织。   （×）","explanation":"ICLAS是国际实验动物科学领域的国际性组织，不应表述成某一政府的“官方组织”。"},{"id":"J354","type":"judgment","number":354,"stem":"我国《实验动物管理条例》是1988年经国务院批准，由国家科技部颁布的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"我国《实验动物管理条例》是1988年经国务院批准，由国家科技部颁布的。   （√）"},{"id":"J355","type":"judgment","number":355,"stem":"1988年颁布的《实验动物管理条例》共分为五个章节。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"1988年颁布的《实验动物管理条例》共分为五个章节。   （×）","explanation":"按本题库所依据的《实验动物管理条例》结构，其章节数不是5章，不能按“五个章节”记忆。"},{"id":"J356","type":"judgment","number":356,"stem":"国家实验动物质量检测中心（微生物、遗传）挂靠在中国医学科学院实验动物研究所。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"国家实验动物质量检测中心（微生物、遗传）挂靠在中国医学科学院实验动物研究所。   （×）","explanation":"题干把国家实验动物质量检测中心的专业分工与挂靠单位对应错了；中国医学科学院实验动物研究所对应的是环境、病理检测中心。"},{"id":"J357","type":"judgment","number":357,"stem":"各省、自治区、直辖市实验动物管理委员会下设办公室，具体负责本地区实验动物的日常管理工作，简称动管办。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"各省、自治区、直辖市实验动物管理委员会下设办公室，具体负责本地区实验动物的日常管理工作，简称动管办。   （√）"},{"id":"J358","type":"judgment","number":358,"stem":"美国的《动物福利法》是一部专门规范实验动物管理的法规。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"美国的《动物福利法》是一部专门规范实验动物管理的法规。   （×）","explanation":"美国《动物福利法》适用范围不限于实验动物管理，还涉及受法规保护动物的运输、销售、展示和照护等，因此不是一部只为实验动物管理制定的专门法规。"},{"id":"J359","type":"judgment","number":359,"stem":"在美国，实验动物使用单位必须要到动植物卫生检疫局（APHIS）登记，订立遵守有关法规的保证书。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"在美国，实验动物使用单位必须要到动植物卫生检疫局（APHIS）登记，订立遵守有关法规的保证书。   （√）"},{"id":"J360","type":"judgment","number":360,"stem":"我国《实验动物质量管理办法》规定，各省、直辖市、自治区实行独立的实验动物质量监督管理制度。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"我国《实验动物质量管理办法》规定，各省、直辖市、自治区实行独立的实验动物质量监督管理制度。   （×）","explanation":"实验动物质量管理执行国家统一的标准和监督管理框架，各省区市负责本地区实施，不能理解为彼此完全独立的质量监督制度。"},{"id":"J361","type":"judgment","number":361,"stem":"未取得实验动物生产许可证的单位，可饲养、繁育实验动物供本单位使用，如教学用，但不得经营实验动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"未取得实验动物生产许可证的单位，可饲养、繁育实验动物供本单位使用，如教学用，但不得经营实验动物。   （×）","explanation":"从事实验动物繁育、生产活动应取得相应生产许可证，不能以“仅供本单位教学使用”为由免除许可要求。"},{"id":"J362","type":"judgment","number":362,"stem":"国家实验动物质量检测中心负责微生物、遗传、环境病理、营养和寄生虫六个专业领域检测技术的标准化、规范化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"国家实验动物质量检测中心负责微生物、遗传、环境病理、营养和寄生虫六个专业领域检测技术的标准化、规范化。   （√）"},{"id":"J363","type":"judgment","number":363,"stem":"大小鼠的抓取固定很方便，可以提起鼠尾，置于清洁光滑的桌面上，即可抓起作灌胃等操作。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"大小鼠的抓取固定很方便，可以提起鼠尾，置于清洁光滑的桌面上，即可抓起作灌胃等操作。   （×）","explanation":"提鼠尾只能作为短暂转移或辅助操作，灌胃等操作还必须正确固定动物，不能仅提尾放在桌面上就直接操作。"},{"id":"J364","type":"judgment","number":364,"stem":"不可用袭击方法抓取大鼠，否则易被咬伤。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"不可用袭击方法抓取大鼠，否则易被咬伤。   （√）"},{"id":"J365","type":"judgment","number":365,"stem":"豚鼠胆小，易受惊，所以抓取时必须稳、准、迅速。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"豚鼠胆小，易受惊，所以抓取时必须稳、准、迅速。   （√）"},{"id":"J366","type":"judgment","number":366,"stem":"耳缘剪孔法是在耳边缘剪出不同的缺口或打出小孔进行编号的方法。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"耳缘剪孔法是在耳边缘剪出不同的缺口或打出小孔进行编号的方法。   （√）"},{"id":"J367","type":"judgment","number":367,"stem":"挂牌标记法，适用于大鼠、小鼠、豚鼠等动物的编号。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"挂牌标记法，适用于大鼠、小鼠、豚鼠等动物的编号。   （×）","explanation":"挂牌标记更适用于较大动物，通常不作为大鼠、小鼠、豚鼠等小型动物的常规编号方法。"},{"id":"J368","type":"judgment","number":368,"stem":"耳缘剪孔法在剪缘或打孔后，需用酒精消毒局部。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"耳缘剪孔法在剪缘或打孔后，需用酒精消毒局部。   （×）","explanation":"耳缘剪孔后应按无菌/消毒和止血要求处理，但具体消毒方式不能机械规定为“必须用酒精局部消毒”。"},{"id":"J369","type":"judgment","number":369,"stem":"挂牌标记法，可使动物感到不适，使其搔抓号牌，使挂牌部位损伤。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"挂牌标记法，可使动物感到不适，使其搔抓号牌，使挂牌部位损伤。   （√）"},{"id":"J370","type":"judgment","number":370,"stem":"剪毛时，剪刀紧贴皮肤，必要时用手提起被毛，以免剪破皮肤。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"剪毛时，剪刀紧贴皮肤，必要时用手提起被毛，以免剪破皮肤。   （×）","explanation":"剪毛时剪刀不应紧贴皮肤，应使刀刃与皮肤保持安全距离，必要时提起被毛，避免剪伤皮肤。"},{"id":"J371","type":"judgment","number":371,"stem":"拔毛法适用于家免耳缘静脉注射或采血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"拔毛法适用于家免耳缘静脉注射或采血。   （√）"},{"id":"J372","type":"judgment","number":372,"stem":"麻醉的目的是消除实验动物在实验过程中的疼痛和不适感，以利实验者操作，确保动物 实验顺利进行。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"麻醉的目的是消除实验动物在实验过程中的疼痛和不适感，以利实验者操作，确保动物 实验顺利进行。   （√）"},{"id":"J373","type":"judgment","number":373,"stem":"给犬动物麻醉时，发现动物的角膜反射消失，瞳孔突然放大，表明无继续试验的价值，应弃用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"给犬动物麻醉时，发现动物的角膜反射消失，瞳孔突然放大，表明无继续试验的价值，应弃用。   （×）","explanation":"角膜反射消失、瞳孔突然放大提示麻醉过深，应立即停止麻醉并采取抢救措施，不等于动物“无继续试验价值而直接弃用”。"},{"id":"J374","type":"judgment","number":374,"stem":"常用的浸润麻醉药是1%硫喷妥钠。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"常用的浸润麻醉药是1%硫喷妥钠。   （×）","explanation":"硫喷妥钠属于全身麻醉药，不是常用浸润麻醉药；浸润麻醉常用局部麻醉药如普鲁卡因或利多卡因。"},{"id":"J375","type":"judgment","number":375,"stem":"浸润麻醉时，每次注药前，应回抽，以防药液误注于血管内。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"浸润麻醉时，每次注药前，应回抽，以防药液误注于血管内。   （√）"},{"id":"J376","type":"judgment","number":376,"stem":"灌胃时，将灌胃针从鼠的右口角插入口中，沿咽前壁慢慢插入食道，使其前端达到膈肌位置。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"灌胃时，将灌胃针从鼠的右口角插入口中，沿咽前壁慢慢插入食道，使其前端达到膈肌位置。   （×）","explanation":"啮齿动物灌胃应沿口腔、咽后壁顺势进入食管和胃，避免沿咽前壁强行插入，以防进入气管或造成损伤。"},{"id":"J377","type":"judgment","number":377,"stem":"口服给药法简单方便，剂量准确。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"口服给药法简单方便，剂量准确。   （×）","explanation":"把药物混入饲料或饮水的口服法虽然方便，但实际摄入量受采食、饮水影响，剂量通常不够准确。"},{"id":"J378","type":"judgment","number":378,"stem":"使鼠尾静脉扩张的方法有局部用45~50℃的温水浸润几分钟或用75%酒精棉反复擦拭。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"使鼠尾静脉扩张的方法有局部用45~50℃的温水浸润几分钟或用75%酒精棉反复擦拭。   （√）"},{"id":"J379","type":"judgment","number":379,"stem":"耳缘静脉注射时，应尽量选粗的静脉处进针。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"耳缘静脉注射时，应尽量选粗的静脉处进针。   （×）","explanation":"兔耳缘静脉注射通常从耳尖端较细、较直且清晰的静脉开始进针，再逐渐向近端使用，不是优先选最粗处。"},{"id":"J380","type":"judgment","number":380,"stem":"鸡常采用翼下静脉注射。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"鸡常采用翼下静脉注射。   （√）"},{"id":"J381","type":"judgment","number":381,"stem":"皮下注射针头垂直刺入皮下，拔针时手指捏住针刺部位，防止药液外漏。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"皮下注射针头垂直刺入皮下，拔针时手指捏住针刺部位，防止药液外漏。   （×）","explanation":"皮下注射针头应以较小角度斜向刺入皮下，不能垂直刺入，以免误入肌肉或深部组织。"},{"id":"J382","type":"judgment","number":382,"stem":"肌肉注射一般选肌肉发达，无大血管通过的部位。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"肌肉注射一般选肌肉发达，无大血管通过的部位。   （√）"},{"id":"J383","type":"judgment","number":383,"stem":"肌肉注射时针头宜垂直迅速刺入肌肉，回抽无回血，即可注射。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"肌肉注射时针头宜垂直迅速刺入肌肉，回抽无回血，即可注射。   （√）"},{"id":"J384","type":"judgment","number":384,"stem":"大鼠、小鼠腹腔注射时，应使动物头处于高位。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"大鼠、小鼠腹腔注射时，应使动物头处于高位。   （×）","explanation":"大、小鼠腹腔注射时常使动物腹部朝上并使头部相对低位，使腹腔脏器向头侧移动，降低损伤风险。"},{"id":"J385","type":"judgment","number":385,"stem":"兔腹腔注射部位下腹部近腹白线左右两侧1cm处。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"兔腹腔注射部位下腹部近腹白线左右两侧1cm处。   （√）"},{"id":"J386","type":"judgment","number":386,"stem":"犬腹腔注射部位脐前腹白线两侧边1~2cm处。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"犬腹腔注射部位脐前腹白线两侧边1~2cm处。   （×）","explanation":"犬腹腔注射一般选择脐后下腹部腹白线旁区域，不能在脐前按题干位置进针。"},{"id":"J387","type":"judgment","number":387,"stem":"兔、犬等灌胃一般可直接将胃管插入口中。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"兔、犬等灌胃一般可直接将胃管插入口中。   （×）","explanation":"兔、犬灌胃需根据动物正确固定，并使用合适的开口器、导管/胃管按解剖方向插入，不能直接盲插胃管。"},{"id":"J388","type":"judgment","number":388,"stem":"大鼠、小鼠剪尾采血，每只鼠只能采一次。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"大鼠、小鼠剪尾采血，每只鼠只能采一次。   （×）","explanation":"大、小鼠剪尾采血在合理止血和间隔条件下可重复多次，并非每只只能采一次。"},{"id":"J389","type":"judgment","number":389,"stem":"小鼠剪尾采血，须剪去尾尖1~2mm，一次采血0.1ml左右。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"小鼠剪尾采血，须剪去尾尖1~2mm，一次采血0.1ml左右。   （√）"},{"id":"J390","type":"judgment","number":390,"stem":"大鼠剪尾采血，须剪去尾尖3~5mm，一次采血0.3~0.5ml左右。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"大鼠剪尾采血，须剪去尾尖3~5mm，一次采血0.3~0.5ml左右。   （√）"},{"id":"J391","type":"judgment","number":391,"stem":"大鼠、小鼠剪尾采血，每只可采血10次以上。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"大鼠、小鼠剪尾采血，每只可采血10次以上。   （√）"},{"id":"J392","type":"judgment","number":392,"stem":"眼眶后静脉丛采血，以45度从外眼角刺入。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"眼眶后静脉丛采血，以45度从外眼角刺入。   （×）","explanation":"眼眶后静脉丛采血的进针点和方向不是从外眼角简单以45°刺入，应按眶后静脉丛解剖位置规范操作。"},{"id":"J393","type":"judgment","number":393,"stem":"小鼠、大鼠如进行一次取血，可采用摘眼球法。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"小鼠、大鼠如进行一次取血，可采用摘眼球法。   （√）"},{"id":"J394","type":"judgment","number":394,"stem":"小鼠、大鼠股动脉一次采血量小鼠达0.5ml，大鼠达2.0ml。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"小鼠、大鼠股动脉一次采血量小鼠达0.5ml，大鼠达2.0ml。   （√）"},{"id":"J395","type":"judgment","number":395,"stem":"小鼠、大鼠大量取血时常用股动脉采血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"小鼠、大鼠大量取血时常用股动脉采血。   （√）"},{"id":"J396","type":"judgment","number":396,"stem":"家兔心脏采血法，心脏穿刺部位在第3肋骨间，胸骨左缘8cm处。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"家兔心脏采血法，心脏穿刺部位在第3肋骨间，胸骨左缘8cm处。   （×）","explanation":"家兔心脏穿刺点应位于胸骨左缘附近合适肋间，距离胸骨仅为毫米量级；“胸骨左缘8cm”明显错误。"},{"id":"J397","type":"judgment","number":397,"stem":"家兔耳缘静脉采血，常用于采血量多时。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"家兔耳缘静脉采血，常用于采血量多时。   （×）","explanation":"家兔耳缘静脉采血适合少量或中等量采血；大量采血通常需选择心脏或较大血管等方法。"},{"id":"J398","type":"judgment","number":398,"stem":"犬最常用的采血法是皮下头静脉和小隐静脉处采血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"犬最常用的采血法是皮下头静脉和小隐静脉处采血。   （√）"},{"id":"J399","type":"judgment","number":399,"stem":"犬大量或连续采血时，可采用颈静脉采血法。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"犬大量或连续采血时，可采用颈静脉采血法。   （√）"},{"id":"J400","type":"judgment","number":400,"stem":"猴采血需血量少时，可经毛细血管采血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"猴采血需血量少时，可经毛细血管采血。   （√）"},{"id":"J401","type":"judgment","number":401,"stem":"猴采血需血量大时，可采用静脉采血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"猴采血需血量大时，可采用静脉采血。   （√）"},{"id":"J402","type":"judgment","number":402,"stem":"大小鼠代谢笼法集尿费时费事，并需专用笼具，一般不使用该法。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"大小鼠代谢笼法集尿费时费事，并需专用笼具，一般不使用该法。   （×）","explanation":"代谢笼虽需专用设备，但能分离并定量收集尿液，是大小鼠代谢、排泄和利尿研究常用方法。"},{"id":"J403","type":"judgment","number":403,"stem":"对实验动物采取安乐死，主要是为了减轻动物的痛苦，对实验结果并无影响。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"对实验动物采取安乐死，主要是为了减轻动物的痛苦，对实验结果并无影响。   （×）","explanation":"安乐死除减少动物痛苦外，处死方法和时间还可能影响血液、组织和生化指标，因此也关系到实验结果。"},{"id":"J404","type":"judgment","number":404,"stem":"家兔处死常用空气栓塞法，但从动物保护的角度出发，不提倡使用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"家兔处死常用空气栓塞法，但从动物保护的角度出发，不提倡使用。   （√）"},{"id":"J405","type":"judgment","number":405,"stem":"用犬做实验经过一年观察期和用大鼠做实验经过相同观察期，其生物学意义基本相同。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"用犬做实验经过一年观察期和用大鼠做实验经过相同观察期，其生物学意义基本相同。   （×）","explanation":"不同动物寿命和生理节律差异很大，犬和大鼠观察一年所代表的生物学年龄和长期效应意义并不相同。"},{"id":"J406","type":"judgment","number":406,"stem":"研究发现，毒物对不同性别大小鼠的毒性有差异，一般雌性的敏感性稍小于雄性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"研究发现，毒物对不同性别大小鼠的毒性有差异，一般雌性的敏感性稍小于雄性。   （×）","explanation":"不同性别对毒物敏感性可有差异，不能笼统说雌性一定比雄性敏感性小；题库口径通常强调雌性往往更敏感或应分别评价。"},{"id":"J407","type":"judgment","number":407,"stem":"医学研究中，动物模型和动物实验结果要外推到人。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"医学研究中，动物模型和动物实验结果要外推到人。   （√）"},{"id":"J408","type":"judgment","number":408,"stem":"动物实验选用的动物类别或等级要与实验条件、实验技术、方法及试剂相匹配。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物实验选用的动物类别或等级要与实验条件、实验技术、方法及试剂相匹配。   （√）"},{"id":"J409","type":"judgment","number":409,"stem":"动物实验中不可以使用怀孕、哺乳、患病、瘦弱及营养不良的实验动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物实验中不可以使用怀孕、哺乳、患病、瘦弱及营养不良的实验动物。   （×）","explanation":"一般实验应使用健康、状态合适的动物；但若研究妊娠、哺乳、疾病或营养状态本身，就可以有目的地选择相应动物，不能绝对禁止。"},{"id":"J410","type":"judgment","number":410,"stem":"对动物无效的药物临床也无效，反之亦成立。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"对动物无效的药物临床也无效，反之亦成立。   （×）","explanation":"动物和人存在种属差异，动物无效不能直接推出临床无效，动物有效也不能保证临床一定有效。"},{"id":"J411","type":"judgment","number":411,"stem":"海水中生活的动物尿液是高渗的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"海水中生活的动物尿液是高渗的。   （×）","explanation":"水生动物的渗透调节因淡水鱼、海水鱼及种类而异，不能简单概括为“海水动物尿液都是高渗”。"},{"id":"J412","type":"judgment","number":412,"stem":"草食类动物尿液显酸性，粘度高，而肉食类动物尿液显碱性，且有特殊的气味。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"草食类动物尿液显酸性，粘度高，而肉食类动物尿液显碱性，且有特殊的气味。   （×）","explanation":"一般草食动物尿液多偏碱性，而肉食动物尿液多偏酸性；题干把酸碱性说反了。"},{"id":"J413","type":"judgment","number":413,"stem":"蛙和蟾蜍，适合做简单的反射弧实验，其结构简单明了，易于分析。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"蛙和蟾蜍，适合做简单的反射弧实验，其结构简单明了，易于分析。   （√）"},{"id":"J414","type":"judgment","number":414,"stem":"在生理、病理生理实验研究中，犬的神经系统和血液循环系统发达，适合进行此方面的研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"在生理、病理生理实验研究中，犬的神经系统和血液循环系统发达，适合进行此方面的研究。   （√）"},{"id":"J415","type":"judgment","number":415,"stem":"犬的消化系统不发达，不适合进行消化系统的慢性实验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"犬的消化系统不发达，不适合进行消化系统的慢性实验。   （×）","explanation":"犬消化系统较发达且易训练，适合进行多种消化系统慢性实验。"},{"id":"J416","type":"judgment","number":416,"stem":"犬不适合用于微循环的实验研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"犬不适合用于微循环的实验研究。   （×）","explanation":"犬循环系统发达，可用于血流动力学和微循环等研究，并非“不适合微循环研究”。"},{"id":"J417","type":"judgment","number":417,"stem":"齿式与动物的食性有密切关系，草食类与肉食类差异最为显著。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"齿式与动物的食性有密切关系，草食类与肉食类差异最为显著。   （√）"},{"id":"J418","type":"judgment","number":418,"stem":"猪是研究动脉粥样硬化最好的动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"猪是研究动脉粥样硬化最好的动物模型。   （√）"},{"id":"J419","type":"judgment","number":419,"stem":"肉食类动物的盲肠比草食类动物的长。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"肉食类动物的盲肠比草食类动物的长。   （×）","explanation":"草食动物为了发酵植物纤维，盲肠通常更发达、更长；肉食动物盲肠相对短小。"},{"id":"J420","type":"judgment","number":420,"stem":"小鼠耳廓做微循环试验，可以避免手术，简化观察程序，很适宜外周微循环慢性实验观察。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"小鼠耳廓做微循环试验，可以避免手术，简化观察程序，很适宜外周微循环慢性实验观察。   （√）"},{"id":"J421","type":"judgment","number":421,"stem":"灰兔眼部适宜做微循环实验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"灰兔眼部适宜做微循环实验。   （×）","explanation":"有色/灰兔眼部色素等会影响某些微循环观察，不能笼统认为灰兔眼部最适宜；实验中常选择更便于观察的部位和动物。"},{"id":"J422","type":"judgment","number":422,"stem":"青蛙肠系膜不适宜做微循环观察。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"青蛙肠系膜不适宜做微循环观察。   （×）","explanation":"青蛙肠系膜薄而透明、血管清楚，是经典的微循环观察材料之一。"},{"id":"J423","type":"judgment","number":423,"stem":"犬的血液循环系统不发达，不适合用于微循环的实验 "number":459,"stem":"用兔制备的血清制品效价高、特异性强，经常用于制备免疫血清。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"用兔制备的血清制品效价高、特异性强，经常用于制备免疫血清。   （√）"},{"id":"J460","type":"judgment","number":460,"stem":"猪的皮肤结构与人相差大，一般不用于人烧伤后的敷盖物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"猪的皮肤结构与人相差大，一般不用于人烧伤后的敷盖物。   （×）","explanation":"猪皮肤在厚度、结构和生理上与人较相似，因此常用于烧伤和皮肤研究，也可作为创面覆盖材料。"},{"id":"J461","type":"judgment","number":461,"stem":"猫与人类的循环系统相似，血压稳定，适合用于药物对循环系统作用机制的分析，而猴 则不适用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"猫与人类的循环系统相似，血压稳定，适合用于药物对循环系统作用机制的分析，而猴 则不适用。   （×）","explanation":"猫因血压稳定和循环系统特点适用于循环药理研究；灵长类在某些循环研究中同样可以使用，不能绝对说猴“不适用”。"},{"id":"J462","type":"judgment","number":462,"stem":"树鼩不麻醉就能承受手术切割皮肤、肌肉等引起的疼痛。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"树鼩不麻醉就能承受手术切割皮肤、肌肉等引起的疼痛。   （√）"},{"id":"J463","type":"judgment","number":463,"stem":"人类腭裂与兔腭裂在形态发生和病理形成方面有相似性，因此兔适于各类唇裂，腭裂的 实验研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"人类腭裂与兔腭裂在形态发生和病理形成方面有相似性，因此兔适于各类唇裂，腭裂的 实验研究。   （×）","explanation":"按本题库相关单选题口径，各类唇裂、腭裂研究常选小鼠；不能因某些形态相似就概括为兔适于“各类”唇腭裂研究。"},{"id":"J464","type":"judgment","number":464,"stem":"无菌动物是主要用来研究胃肠道微生物在营养代谢中的作用的动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"无菌动物是主要用来研究胃肠道微生物在营养代谢中的作用的动物。   （√）"},{"id":"J465","type":"judgment","number":465,"stem":"一般生殖毒性试验的目的是判断雄性、雌性动物连续用药后，一般生殖行为和生育能力 的变化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"一般生殖毒性试验的目的是判断雄性、雌性动物连续用药后，一般生殖行为和生育能力 的变化。   （√）"},{"id":"J466","type":"judgment","number":466,"stem":"致畸敏感期毒性试验的目的是判断雌性动物在胚胎器官形成前、后所给的药物对胚胎的 毒性和致畸性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"致畸敏感期毒性试验的目的是判断雌性动物在胚胎器官形成前、后所给的药物对胚胎的 毒性和致畸性。   （√）"},{"id":"J467","type":"judgment","number":467,"stem":"围产期毒性试验的目的是判断雌性动物在妊娠后期给药对子代的影响。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"围产期毒性试验的目的是判断雌性动物在妊娠后期给药对子代的影响。   （×）","explanation":"围产期毒性试验关注妊娠后期、分娩及哺乳期给药对母体和子代生长发育等影响，不只是“妊娠后期对子代”的单一影响。"},{"id":"J468","type":"judgment","number":468,"stem":"急性毒性试验是简单的试验，对实验动物质量没有严格要求，这符合经济节约的原则。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"急性毒性试验是简单的试验，对实验动物质量没有严格要求，这符合经济节约的原则。    （×）","explanation":"急性毒性试验同样要求实验动物来源、遗传背景、微生物质量和健康状态符合标准，不能因试验简单而降低质量要求。"},{"id":"J469","type":"judgment","number":469,"stem":"长期毒性试验持续时间长，而且实验动物的高中剂量组是给予中毒剂量的药物。因此必 须保证实验动物的质量和适宜的环境。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"长期毒性试验持续时间长，而且实验动物的高中剂量组是给予中毒剂量的药物。因此必 须保证实验动物的质量和适宜的环境。   （√）"},{"id":"J470","type":"judgment","number":470,"stem":"长期毒性试验常用SD大鼠，不能用Wistar大鼠。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"长期毒性试验常用SD大鼠，不能用Wistar大鼠。   （×）","explanation":"长期毒性试验可使用SD或Wistar等常用大鼠品系，并非“只能用SD、不能用Wistar”。"},{"id":"J471","type":"judgment","number":471,"stem":"大鼠的致癌试验需2~3年，通常意味着是终生试验。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"大鼠的致癌试验需2~3年，通常意味着是终生试验。   （√）"},{"id":"J472","type":"judgment","number":472,"stem":"兔对放射线十分敏感，因此常选用兔进行放射医学研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"兔对放射线十分敏感，因此常选用兔进行放射医学研究。   （×）","explanation":"不同动物对辐射敏感性不同，兔不是放射医学研究中因“十分敏感”而必然首选的动物，需按研究目的选模型。"},{"id":"J473","type":"judgment","number":473,"stem":"裸鼠不适合皮肤病学研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"裸鼠不适合皮肤病学研究。   （×）","explanation":"裸鼠因无毛、免疫缺陷等特点可用于皮肤、移植和肿瘤等研究，不能笼统说“不适合皮肤病学研究”。"},{"id":"J474","type":"judgment","number":474,"stem":"人类疾病动物模型是指医学研究中建立的具有人类疾病表现的动物实验对象和相关材 料。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"人类疾病动物模型是指医学研究中建立的具有人类疾病表现的动物实验对象和相关材 料。   （√）"},{"id":"J475","type":"judgment","number":475,"stem":"易自发地出现某些相应病变的动物，适宜作为复制该病变的动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"易自发地出现某些相应病变的动物，适宜作为复制该病变的动物模型。   （×）","explanation":"动物若容易自发出现与拟复制疾病相似的病变，可能混淆实验诱发病变和自然病变，一般反而不宜选作该疾病模型。"},{"id":"J476","type":"judgment","number":476,"stem":"易产生与复制疾病相混淆的疾病或临床症状的动物，不宜选用复制该疾病模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"易产生与复制疾病相混淆的疾病或临床症状的动物，不宜选用复制该疾病模型。   （√）"},{"id":"J477","type":"judgment","number":477,"stem":"诱发性动物模型又称之为实验性动物模型，即为人工诱发出特定的疾病动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"诱发性动物模型又称之为实验性动物模型，即为人工诱发出特定的疾病动物模型。   （√）"},{"id":"J478","type":"judgment","number":478,"stem":"由于基因突变的异常表现通过遗传育种手段保留下来的动物模型属于诱发性动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"由于基因突变的异常表现通过遗传育种手段保留下来的动物模型属于诱发性动物模型。    （×）","explanation":"由自然或遗传突变并经育种固定下来的模型属于自发性/遗传性动物模型，不属于人为诱发性模型。"},{"id":"J479","type":"judgment","number":479,"stem":"实验动物未经任何人工处置，在自然条件下自发产生的动物模型属于自发性实验动物模 型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物未经任何人工处置，在自然条件下自发产生的动物模型属于自发性实验动物模 型。   （√）"},{"id":"J480","type":"judgment","number":480,"stem":"自发性动物模型中，疾病的发生、发展与人类相应的疾病很相似，其应用价值很高。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"自发性动物模型中，疾病的发生、发展与人类相应的疾病很相似，其应用价值很高。   （√）"},{"id":"J481","type":"judgment","number":481,"stem":"抗疾病实验动物模型是指特定的疾病容易在某种动物身上发生，从而可以用来探讨这种动物对该疾病的抵抗力。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"抗疾病实验动物模型是指特定的疾病容易在某种动物身上发生，从而可以用来探讨这种动物对该疾病的抵抗力。   （×）","explanation":"抗疾病动物模型是某种动物对特定疾病具有较强抵抗力，用来研究抗病机制；题干描述的是“容易发生疾病”，方向正好相反。"},{"id":"J482","type":"judgment","number":482,"stem":"生物医学模型是指利用健康动物生物学特征来提供人类疾病相似表现的疾病模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"生物医学模型是指利用健康动物生物学特征来提供人类疾病相似表现的疾病模型。   （√）"},{"id":"J483","type":"judgment","number":483,"stem":"阴虚动物模型、阳虚动物模型、气虚动物模型、血虚动物模型等属于中医证候分类动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"阴虚动物模型、阳虚动物模型、气虚动物模型、血虚动物模型等属于中医证候分类动物模型。   （√）"},{"id":"J484","type":"judgment","number":484,"stem":"利水渗湿药动物模型不属于中药理论分类的动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"利水渗湿药动物模型不属于中药理论分类的动物模型。   （×）","explanation":"按中药理论可建立利水渗湿等证候或治法相关动物模型，因此不能说其不属于中医药理论分类模型。"},{"id":"J485","type":"judgment","number":485,"stem":"免疫缺陷动物仅是指用人工方法造成动物一种或多种免疫系统组成成分缺陷的动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"免疫缺陷动物仅是指用人工方法造成动物一种或多种免疫系统组成成分缺陷的动物。    （×）","explanation":"免疫缺陷动物既可由遗传突变自然形成，也可通过手术、药物、照射等人工方法获得，不仅限于人工造成。"},{"id":"J486","type":"judgment","number":486,"stem":"AIDS动物模型属于获得性免疫缺陷动物模型。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"AIDS动物模型属于获得性免疫缺陷动物模型。   （√）"},{"id":"J487","type":"judgment","number":487,"stem":"裸小鼠、裸大鼠不属于T淋巴细胞功能缺陷动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"裸小鼠、裸大鼠不属于T淋巴细胞功能缺陷动物。   （×）","explanation":"裸小鼠和裸大鼠先天胸腺发育异常，属于典型T淋巴细胞功能缺陷动物。"},{"id":"J488","type":"judgment","number":488,"stem":"Beige小鼠属于B淋巴细胞功能缺陷动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"Beige小鼠属于B淋巴细胞功能缺陷动物。   （×）","explanation":"Beige小鼠主要存在NK细胞等功能缺陷，不是典型B淋巴细胞功能缺陷动物；CBA/N小鼠才是题库列举的B细胞功能缺陷模型。"},{"id":"J489","type":"judgment","number":489,"stem":"CBA/N小鼠属于B淋巴细胞功能缺陷动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"CBA/N小鼠属于B淋巴细胞功能缺陷动物。   （√）"},{"id":"J490","type":"judgment","number":490,"stem":"裸小鼠一般不用于肿瘤学的研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"裸小鼠一般不用于肿瘤学的研究。   （×）","explanation":"裸小鼠免疫排斥弱，广泛用于人肿瘤异种移植和肿瘤学研究。"},{"id":"J491","type":"judgment","number":491,"stem":"裸大鼠主要用于人体肿瘤的移植的研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"裸大鼠主要用于人体肿瘤的移植的研究。   （√）"},{"id":"J492","type":"judg s":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"ENU致突变技术是高通量大规模筛选新基因及发育突变技术的化学方法。   （√）"},{"id":"J501","type":"judgment","number":501,"stem":"ENU诱发是近年来被公认的最有潜力的能够快速产生、大规模筛选并建立突变型动物的有效手段。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"ENU诱发是近年来被公认的最有潜力的能够快速产生、大规模筛选并建立突变型动物的有效手段。   （√）"},{"id":"J502","type":"judgment","number":502,"stem":"为了不浪费动物，多领取的动物可以返回饲养室。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"为了不浪费动物，多领取的动物可以返回饲养室。   （×）","explanation":"多领取或已经进入实验区的动物不能随意返回原饲养群，以免把污染物或病原带回并破坏屏障管理。"},{"id":"J503","type":"judgment","number":503,"stem":"遗传监测就是通过基因、饲养环境和饲料营养检验等方法来测定实验动物品系的遗传组成是否发生变化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"遗传监测就是通过基因、饲养环境和饲料营养检验等方法来测定实验动物品系的遗传组成是否发生变化。   （×）","explanation":"遗传监测主要检测品系的遗传组成和遗传纯度是否变化；环境和饲料营养属于环境、营养质量控制，不属于遗传监测本身。"},{"id":"J504","type":"judgment","number":504,"stem":"尽管在实验动物的培育、维持和生产过程中采取了许多严格的控制手段，但还是存在许多导致动物发生遗传变异的因素。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"尽管在实验动物的培育、维持和生产过程中采取了许多严格的控制手段，但还是存在许多导致动物发生遗传变异的因素。   （√）"},{"id":"J505","type":"judgment","number":505,"stem":"遗传上的变化导致实验动物某些原有特性的改变，影响实验研究结果，所以进行实验动物质量的遗传监测就显得尤为重要。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"遗传上的变化导致实验动物某些原有特性的改变，影响实验研究结果，所以进行实验动物质量的遗传监测就显得尤为重要。   （√）"},{"id":"J506","type":"judgment","number":506,"stem":"遗传污染是最常见的实验动物管理事故，通常是由于其他品系动物与本品系动物发生交配所致。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"遗传污染是最常见的实验动物管理事故，通常是由于其他品系动物与本品系动物发生交配所致。   （√）"},{"id":"J507","type":"judgment","number":507,"stem":"遗传漂变是指一个品系动物基因型在饲养过程中可能发生的随机改变，这种改变多由于近交系动物残留杂合基因分离，造成了亚系的形成。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"遗传漂变是指一个品系动物基因型在饲养过程中可能发生的随机改变，这种改变多由于近交系动物残留杂合基因分离，造成了亚系的形成。   （√）"},{"id":"J508","type":"judgment","number":508,"stem":"遗传漂变是最常见的实验动物管理事故，通常是指由于其他品系动物与本品系动物发生交配所致。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"遗传漂变是最常见的实验动物管理事故，通常是指由于其他品系动物与本品系动物发生交配所致。   （×）","explanation":"其他品系与本品系误交配造成的是遗传污染；遗传漂变是群体中基因频率随繁殖世代发生随机改变。"},{"id":"J509","type":"judgment","number":509,"stem":"突变是由于动物基因组中某个核苷酸残基的置换、缺失或插入，引起一个等位基因的改变。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"突变是由于动物基因组中某个核苷酸残基的置换、缺失或插入，引起一个等位基因的改变。   （√）"},{"id":"J510","type":"judgment","number":510,"stem":"动物只有性细胞发生突变才能传给后代，而体细胞发生突变一般不影响个体的整体或性细胞，因此不会传给后代。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物只有性细胞发生突变才能传给后代，而体细胞发生突变一般不影响个体的整体或性细胞，因此不会传给后代。   （√）"},{"id":"J511","type":"judgment","number":511,"stem":"动物性细胞发生突变能传给后代，体细胞发生突变也会影响个体的整体或性细胞，因此也会传给后代。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物性细胞发生突变能传给后代，体细胞发生突变也会影响个体的整体或性细胞，因此也会传给后代。   （×）","explanation":"只有发生于生殖细胞并进入受精过程的突变才能遗传给后代；体细胞突变一般不会传给后代。"},{"id":"J512","type":"judgment","number":512,"stem":"实验动物遗传物质发生可遗传的改变就是突变，根据发生突变的原因又分为自然突变和人工诱变两类。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物遗传物质发生可遗传的改变就是突变，根据发生突变的原因又分为自然突变和人工诱变两类。   （√）"},{"id":"J513","type":"judgment","number":513,"stem":"近交系数是表示实验动物近交程度的一个指数，对于群体，我们假定一个大群体实行随机交配，则某一后代在亲代中随机取得一对同源等位基因的概率就是这一个体的近交系数。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系数是表示实验动物近交程度的一个指数，对于群体，我们假定一个大群体实行随机交配，则某一后代在亲代中随机取得一对同源等位基因的概率就是这一个体的近交系数。   （√）"},{"id":"J514","type":"judgment","number":514,"stem":"近交系是指至少连续20代的同胞兄妹交配培育而成，品系内所有个体都可追溯到起源于第20代或后代数的一对共同祖先。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系是指至少连续20代的同胞兄妹交配培育而成，品系内所有个体都可追溯到起源于第20代或后代数的一对共同祖先。   （√）"},{"id":"J515","type":"judgment","number":515,"stem":"近交系一般以大写英文字母命名，亦可以用大写英文字母加阿拉伯数字命名，符号应尽量简短。如A系、TA1系等。近交系的近交代数用大写英文字母F表示。例如当一个近交系的近交代数为87代时，写成（F87）。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系一般以大写英文字母命名，亦可以用大写英文字母加阿拉伯数字命名，符号应尽量简短。如A系、TA1系等。近交系的近交代数用大写英文字母F表示。例如当一个近交系的近交代数为87代时，写成（F87）。   （√）"},{"id":"J516","type":"judgment","number":516,"stem":"亚系是指一个近交系内的各个分支的动物之间，已经存在或十分可能存在遗传差异。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"亚系是指一个近交系内的各个分支的动物之间，已经存在或十分可能存在遗传差异。   （√）"},{"id":"J517","type":"judgment","number":517,"stem":"近交系亚系的命名方法是在原品系的名称后加一道斜线，斜线后标明亚系的符号。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系亚系的命名方法是在原品系的名称后加一道斜线，斜线后标明亚系的符号。   （√）"},{"id":"J518","type":"judgment","number":518,"stem":"重组近交系的命名由两个亲代近交系的缩写名称中间加大写英文字母X命名。由相同双亲交配育成的一组近交系用阿拉拍数字予以区分。例如：由BALB/c与C57BL两个近交系杂交育成的一组重组近交系，分别命名为CXB1、CXB2、……。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"重组近交系的命名由两个亲代近交系的缩写名称中间加大写英文字母X命名。由相同双亲交配育成的一组近交系用阿拉拍数字予以区分。例如：由BALB/c与C57BL两个近交系杂交育成的一组重组近交系，分别命名为CXB1、CXB2、……。   （√）"},{"id":"J519","type":"judgment","number":519,"stem":"在两个近交系杂交生育杂种一代后，杂种一代互交生育杂种二代，从杂种二代中随机选择个体配对，连续进行20代以上的兄妹交配，可培育出重组近交系动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"在两个近交系杂交生育杂种一代后，杂种一代互交生育杂种二代，从杂种二代中随机选择个体配对，连续进行20代以上的兄妹交配，可培育出重组近交系动物。   （√）"},{"id":"J520","type":"judgment","number":520,"stem":"同源突变系的命名由发生突变的近交系名称后加突变基因符号（用英文斜体印刷体）组成，二者之间以连接号分开。当突变基因必须以杂合子形式保持时，用“+”号代表野生型基因，如：A/Fa- +/c。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"同源突变系的命名由发生突变的近交系名称后加突变基因符号（用英文斜体印刷体）组成，二者之间以连接号分开。当突变基因必须以杂合子形式保持时，用“+”号代表野生型基因，如：A/Fa- +/c。   （√）"},{"id":"J521","type":"judgment","number":521,"stem":"同源导入系名称一般由三部分组成：接受导入基因的近交系名称；提供导入基因的近交系的缩写名称，并与a项之间用英文句号分开；导入基因的符号（用英文斜体），与b项之间以连字符分开。例如：B10.129-H-12b，表示该同源导入近交系的遗传背景为C57BL/10sn(=B10)，导入B10的基因为H-12b，基因提供者为129/J近交系。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"同源导入系名称一般由三部分组成：接受导入基因的近交系名称；提供导入基因的近交系的缩写名称，并与a项之间用英文句号分开；导入基因的符号（用英文斜体），与b项之间以连字符分开。例如：B10.129-H-12b，表示该同源导入近交系的遗传背景为C57BL/10sn(=B10)，导入B10的基因为H-12b，基因提供者为129/J近交系。   （√）"},{"id":"J522","type":"judgment","number":522,"stem":"转基因的命名遵循这样的原则：一个转基因符号由以下三部分组成，均以罗马字体表示：TgX(YYYYYY) ＃＃＃＃＃ Zzz。其中各部分符号表示含意为：TgX=方式；(YYYYYY)=插入片段标示；＃＃＃＃＃=实验室指定序号；Zzz = 实验室注册代号。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"转基因的命名遵循这样的原则：一个转基因符号由以下三部分组成，均以罗马字体表示：TgX(YYYYYY) ＃＃＃＃＃ Zzz。其中各部分符号表示含意为：TgX=方式；(YYYYYY)=插入片段标示；＃＃＃＃＃=实验室指定序号；Zzz = 实验室注册代号。   （√）"},{"id":"J523","type":"judgment","number":523,"stem":"C57BL/6J-TgN(CD8Ge)23Jwg，表示来源于美国杰克逊研究所（J）的C57BL/6品系小鼠被转入了的CD8基因组（Ge）；转基因工作在Jon W.Gordon(Jwg)实验室完成,这个小鼠是该实验室通过于一系列显微注射后得到的序号为23的小鼠。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"C57BL/6J-TgN(CD8Ge)23Jwg，表示来源于美国杰克逊研究所（J）的C57BL/6品系小鼠被转入了的CD8基因组（Ge）；转基因工作在Jon W.Gordon(Jwg)实验室完成,这个小鼠是该实验室通过于一系列显微注射后得到的序号为23的小鼠。   （√）"},{"id":"J524","type":"judgment","number":524,"stem":"如果转基因动物的遗传背景是由不同的近交系或远交群之间混合而成时，则该转基因符号应不使用动物品系或种群的名称。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"如果转基因动物的遗传背景是由不同的近交系或远交群之间混合而成时，则该转基因符号应不使用动物品系或种群的名称。   （√）"},{"id":"J525","type":"judgment","number":525,"stem":"近交品系动物中任何一个基因位点上纯合子的概率高达99%，因而能繁殖出完全一致的纯合子，品系内个体相互交配不会出现形状分离。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交品系动物中任何一个基因位点上纯合子的概率高达99%，因而能繁殖出完全一致的纯合子，品系内个体相互交配不会出现形状分离。   （√）"},{"id":"J526","type":"judgment","number":526,"stem":"近交品系动物中虽然任何一个基因位点上纯合子的概率高达99%，也可能繁殖出不完全一致的杂合子，品系内个体相互交配也会出现形状分离。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"近交品系动物中虽然任何一个基因位点上纯合子的概率高达99%，也可能繁殖出不完全一致的杂合子，品系内个体相互交配也会出现形状分离。   （×）","explanation":"近交系高度纯合，品系内个体遗传上高度一致，正常情况下同品系交配不会出现因杂合导致的明显性状分离。"},{"id":"J527","type":"judgment","number":527,"stem":"近交品系内所有动物个体都可追溯到一对共同祖先，也就是说同一个品系内每只动物的个体在遗传上都是同源的，基因型完全一致。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交品系内所有动物个体都可追溯到一对共同祖先，也就是说同一个品系内每只动物的个体在遗传上都是同源的，基因型完全一致。   （√）"},{"id":"J528","type":"judgment","number":528,"stem":"由于基因型一致，近交系内个体的表型也是相同的，特别是那些可遗传的生物学特征。如毛色、蛋白质、生化同工酶以及行态学特征等。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"由于基因型一致，近交系内个体的表型也是相同的，特别是那些可遗传的生物学特征。如毛色、蛋白质、生化同工酶以及行态学特征等。   （√）"},{"id":"J529","type":"judgment","number":529,"stem":"近交系动物在遗传上具有高度稳定性，虽然残留杂合会导致个体遗传变异，但这种概率非常小。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系动物在遗传上具有高度稳定性，虽然残留杂合会导致个体遗传变异，但这种概率非常小。   （√）"},{"id":"J530","type":"judgment","number":530,"stem":"每个近交系都有各自的遗传概貌（包括毛色基因、生化基因等）,选用适当的遗传监测方法，即可分辨各个近交系。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"每个近交系都有各自的遗传概貌（包括毛色基因、生化基因等）,选用适当的遗传监测方法，即可分辨各个近交系。   （√）"},{"id":"J531","type":"judgment","number":531,"stem":"每个近交系都有自己的遗传组成和独自的生物学特性，经过近交培育之后，每个品系从物种的整个基因库中只能获取极少部分的基因，这部分基因构成了品系的遗传组成，因此，每个品系在遗传组成上是独一无二的，具有独特的表型特征。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"每个近交系都有自己的遗传组成和独自的生物学特性，经过近交培育之后，每个品系从物种的整个基因库中只能获取极少部分的基因，这部分基因构成了品系的遗传组成，因此，每个品系在遗传组成上是独一无二的，具有独特的表型特征。   （√）"},{"id":"J532","type":"judgment","number":532,"stem":"近交系动物任何一个个体均携带该品系全部基因库，引种非常方便，便于在不同国家、地区建立几乎完全相同的标准近交系，使各国研究结果具有可比性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系动物任何一个个体均携带该品系全部基因库，引种非常方便，便于在不同国家、地区建立几乎完全相同的标准近交系，使各国研究结果具有可比性。   （√）"},{"id":"J533","type":"judgment","number":533,"stem":"近交系动物在培育和保种的过程中都有详细记录，加之这些动物分布广泛，经常使用，已有相当数量的文献记载着各个品系的生物学特征，这些基本数据对于设计新的实验和解释实验结果提供了便利条件。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"近交系动物在培育和保种的过程中都有详细记录，加之这些动物分布广泛，经常使用，已有相当数量的文献记载着各个品系的生物学特征，这些基本数据对于设计新的实验和解释实验结果提供了便利条件。   （√）"},{"id":"J534","type":"judgment","number":534,"stem":"封闭群由2～4个大写英文字母命名，种群名称前标明保持者的英文缩写名称，第一个字母须大写，后面的字母小写，一般不超过4个字母。保持者与种群名称之间用冒号分开。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"封闭群由2～4个大写英文字母命名，种群名称前标明保持者的英文缩写名称，第一个字母须大写，后面的字母小写，一般不超过4个字母。保持者与种群名称之间用冒号分开。   （√）"},{"id":"J535",
