大鼠、犬、猴\nB.小鼠、大鼠、犬、小型猪\nC.小鼠、大鼠、猴、小型猪\nD.大鼠、小鼠、猴、小型猪"},{"id":"M345","type":"multiple","number":345,"stem":"动物对实验处理的反应可以用以下公式表示：R=(A+B+C)*D+E,对此公式的意义的解释正确的是_。","options":[{"label":"A","text":"A表示品种品系特有的反应"},{"label":"B","text":"B表示动物种的共同反应"},{"label":"C","text":"(A+B+C)可总括为动物的遗传因素"},{"label":"D","text":"D表示环境因素"}],"answer":"CD","raw":"345.动物对实验处理的反应可以用以下公式表示：R=(A+B+C)*D+E,对此公式的意义的解释正确的是_。 （CD)\nA. A表示品种品系特有的反应    B. B表示动物种的共同反应\nC. (A+B+C)可总括为动物的遗传因素 D. D表示环境因素"},{"id":"M346","type":"multiple","number":346,"stem":"影响实验动物的环境因素有多种，其中属于生物因素的是 _。","options":[{"label":"A","text":"温度"},{"label":"B","text":"饲养密度"},{"label":"C","text":"社会地位"},{"label":"D","text":"微生物"}],"answer":"BCD","raw":"346.影响实验动物的环境因素有多种，其中属于生物因素的是 _。 （BCD)\nA.温度 B.饲养密度 C.社会地位    D.微生物"},{"id":"M347","type":"multiple","number":347,"stem":"感染性动物实验设施管理的SOP主要有 _。","options":[{"label":"A","text":"—般管理SOP"},{"label":"B","text":"特殊管理SOP"},{"label":"C","text":"安全设备SOP"},{"label":"D","text":"动物实验SOP"}],"answer":"ABCD","raw":"347.感染性动物实验设施管理的SOP主要有 _。 （ABCD)\nA.—般管理SOP B.特殊管理SOP C.安全设备SOP D.动物实验SOP"},{"id":"M348","type":"multiple","number":348,"stem":"解决动物保护与利用动物的矛盾的叙述正确的是 _。","options":[{"label":"A","text":"不再允许使用实验动物进行科学实验"},{"label":"B","text":"寻求动物的替代物或替代方法（技术）"},{"label":"C","text":"科学、合理地使用动物，包括合理开发动物资源和善待动物"},{"label":"D","text":"把动物保护和动物利用人为地对立起来，对动物保护不予理睬"}],"answer":"BC","raw":"348.解决动物保护与利用动物的矛盾的叙述正确的是 _。（BC)\nA.不再允许使用实验动物进行科学实验\nB.寻求动物的替代物或替代方法（技术）\nC.科学、合理地使用动物，包括合理开发动物资源和善待动物\nD.把动物保护和动物利用人为地对立起来，对动物保护不予理睬"},{"id":"M349","type":"multiple","number":349,"stem":"关于动物实验的说法正确的 有_。","options":[{"label":"A","text":"动物实验是人类有目的地探索未知世界的一种行为"},{"label":"B","text":"动物实验是探索生命奥秘的必经之路"},{"label":"C","text":"动物实验应该严格设计各项条件"},{"label":"D","text":"在动物实验中应选用高级别的并符合国家标准的实验动物"}],"answer":"ABC","raw":"349.关于动物实验的说法正确的 有_。（ABC)\nA.动物实验是人类有目的地探索未知世界的一种行为\nB.动物实验是探索生命奥秘的必经之路\nC.动物实验应该严格设计各项条件\nD.在动物实验中应选用高级别的并符合国家标准的实验动物"},{"id":"M350","type":"multiple","number":350,"stem":"常见的麻醉剂_有_。","options":[{"label":"A","text":"戊四氮"},{"label":"B","text":"美解眠"},{"label":"C","text":"的卡因"},{"label":"D","text":"氯胺酮"}],"answer":"CD","raw":"350.常见的麻醉剂_有_。（CD)\nA.戊四氮 B.美解眠    C.的卡因    D.氯胺酮"},{"id":"M351","type":"multiple","number":351,"stem":"树駒在生物医学研究中的应用，下列说法正确的 有_。","options":[{"label":"A","text":"甲型肝炎病毒（HAV)可在树駒体内，感染后7-13d就开始从粪便中排毒，但由于很多个\n体感染后仅见血清转氨酶升高，检测不到HAV抗体或者抗体滴度很低，故而树駒很少用\n于制作研究人类甲型肝炎病毒的动物模型"},{"label":"B","text":"树齣是研究人类乙型肝炎病毒（HBV)良好的动物模型"},{"label":"C","text":"树齣对黄曲霉素具有天然的抵抗力，故而不能用黄曲霉素诱发产生肿瘤模型"},{"label":"D","text":"树駒是研究人类胆石症的良好动物模型"}],"answer":"BD","raw":"351.树駒在生物医学研究中的应用，下列说法正确的 有_。（BD)\nA.甲型肝炎病毒（HAV)可在树駒体内，感染后7-13d就开始从粪便中排毒，但由于很多个\n体感染后仅见血清转氨酶升高，检测不到HAV抗体或者抗体滴度很低，故而树駒很少用\n于制作研究人类甲型肝炎病毒的动物模型\nB.树齣是研究人类乙型肝炎病毒（HBV)良好的动物模型\nC.树齣对黄曲霉素具有天然的抵抗力，故而不能用黄曲霉素诱发产生肿瘤模型\nD.树駒是研究人类胆石症的良好动物模型"},{"id":"M352","type":"multiple","number":352,"stem":"树駒在生物医学研究中的应用，下列说法正确的 有_。","options":[{"label":"A","text":"树駒对疱疹病毒敏感"},{"label":"B","text":"幼年树駒对轮状病毒十分敏感，因此常用于人类轮状病毒感染的致病机理、免疫调控、\n疫苗制备及检定等方面的研究"},{"label":"C","text":"树駒的胆汁组成与人类相似，因此是很好的人类胆石症研究模型"},{"label":"D","text":"树晌在自然条件下能产生自发性乳腺癌、淋巴肉瘤、表皮肝细胞癌等"}],"answer":"ACD","raw":"352.树駒在生物医学研究中的应用，下列说法正确的 有_。（ACD)\nA.树駒对疱疹病毒敏感\nB.幼年树駒对轮状病毒十分敏感，因此常用于人类轮状病毒感染的致病机理、免疫调控、\n疫苗制备及检定等方面的研究\nC.树駒的胆汁组成与人类相似，因此是很好的人类胆石症研究模型\nD.树晌在自然条件下能产生自发性乳腺癌、淋巴肉瘤、表皮肝细胞癌等"},{"id":"M353","type":"multiple","number":353,"stem":"下列动物中可以用作人类脱发研究的动物有_。","options":[{"label":"A","text":"树駒"},{"label":"B","text":"长毛兔"},{"label":"C","text":"比格犬"},{"label":"D","text":"稀毛小鼠"},{"label":"E","text":"裸鼠"}],"answer":"ADE","raw":"353.下列动物中可以用作人类脱发研究的动物有_。 （ADE)\nA.树駒B.长毛兔C.比格犬D.稀毛小鼠E.裸鼠"},{"id":"M354","type":"multiple","number":354,"stem":"常见的复苏与抢救用药有_","options":[{"label":"A","text":"碳酸氢钠"},{"label":"B","text":"肾上腺素"},{"label":"C","text":"的卡因"},{"label":"D","text":"利多卡因"}],"answer":"AB","raw":"354.常见的复苏与抢救用药有_(AB)\nA.碳酸氢钠B.肾上腺素C.的卡因D.利多卡因"},{"id":"M355","type":"multiple","number":355,"stem":"关于是实验动物鸡，下列说法正确的 有_。","options":[{"label":"A","text":"鸡的凝血机制很好，红细胞呈椭圆形，具有细胞核，所以从其全血中提取DNA比较难"},{"label":"B","text":"现代家鸡是由原鸡长期驯化而来的，仍然保留了鸟类的某些特征，具有一定的飞翔能力，\n习惯四处觅食，不停地活动"},{"label":"C","text":"鸡视力敏锐，听力灵敏，具有神经质的特点，极易惊恐。巨大的声响和阴影会使其受惊，互相挤压"},{"label":"D","text":"气压的改变也会引发鸡歇斯底里，因此，SPF鸡及无菌鸡在屏障系统中饲养时或在隔离器中饲养时，应引起足够的重视"}],"answer":"BD","raw":"355.关于是实验动物鸡，下列说法正确的 有_。 （BD)\nA.鸡的凝血机制很好，红细胞呈椭圆形，具有细胞核，所以从其全血中提取DNA比较难\nB.现代家鸡是由原鸡长期驯化而来的，仍然保留了鸟类的某些特征，具有一定的飞翔能力，\n习惯四处觅食，不停地活动\nC.鸡视力敏锐，听力灵敏，具有神经质的特点，极易惊恐。巨大的声响和阴影会使其受惊，互相挤压\nD.气压的改变也会引发鸡歇斯底里，因此，SPF鸡及无菌鸡在屏障系统中饲养时或在隔离器中饲养时，应引起足够的重视"},{"id":"M356","type":"multiple","number":356,"stem":"关于实验动物鸡，下列说法正确的有_。","options":[{"label":"A","text":"鸡的正常体温是41.5‘C"},{"label":"B","text":"鸡耐寒怕热，没有汗腺"},{"label":"C","text":"鸡没有膀胱"},{"label":"D","text":"鸡散热主要靠伸展双翅，流涎"}],"answer":"ABC","raw":"356.关于实验动物鸡，下列说法正确的有_。（ABC)\nA.鸡的正常体温是41.5‘C    B.鸡耐寒怕热，没有汗腺\nC.鸡没有膀胱  D.鸡散热主要靠伸展双翅，流涎"},{"id":"M357","type":"multiple","number":357,"stem":"对于从事实验动物人员的要求有_。","options":[{"label":"A","text":"拥有科技主管部门颁发的上岗资格证书和卫生部门颁发的健康证书"},{"label":"B","text":"了解国家、省、市及所在单位实验动物机构有关实验动物和动物实验的管理法规和制度，\n并能够切实遵照执行"},{"label":"C","text":"掌握实验动物科学的基本知识，熟悉各种实验动物的生物学特性和解剖生理特点"},{"label":"D","text":"熟练掌握动物实验基本操作技能"}],"answer":"ABCD","raw":"357.对于从事实验动物人员的要求有_。（ABCD)\nA.拥有科技主管部门颁发的上岗资格证书和卫生部门颁发的健康证书\nB.    了解国家、省、市及所在单位实验动物机构有关实验动物和动物实验的管理法规和制度，\n并能够切实遵照执行\nC.掌握实验动物科学的基本知识，熟悉各种实验动物的生物学特性和解剖生理特点\nD.熟练掌握动物实验基本操作技能"},{"id":"M358","type":"multiple","number":358,"stem":"常见的复苏与抢救用药有_","options":[{"label":"A","text":"普鲁卡因"},{"label":"B","text":"的卡因"},{"label":"C","text":"美解眠"},{"label":"D","text":"戊四氮"}],"answer":"CD","raw":"358.常见的复苏与抢救用药有_ (CD)\nA.普鲁卡因B.的卡因 C.美解眠D.戊四氮"},{"id":"M359","type":"multiple","number":359,"stem":"鸡胚能生产的生物疫苗有_。","options":[{"label":"A","text":"小儿麻疹疫苗"},{"label":"B","text":"黄热病疫苗"},{"label":"C","text":"狂犬病疫苗"},{"label":"D","text":"猪瘟疫苗"}],"answer":"ABC","raw":"359.鸡胚能生产的生物疫苗有_。(ABC)\nA.小儿麻疹疫苗 B.黄热病疫苗 C.狂犬病疫苗 D.猪瘟疫苗"},{"id":"M360","type":"multiple","number":360,"stem":"鸡胚能生产的疫苗有_。","options":[{"label":"A","text":"狂犬病疫苗"},{"label":"B","text":"鸡新城疫I系苗"},{"label":"C","text":"马立克氏疫苗"},{"lab 确的 有_。","options":[{"label":"A","text":"小鼠灌胃给药量应该不超过0.8ml"},{"label":"B","text":"大鼠灌胃给药量应该不超过5.0ml"},{"label":"C","text":"兔子灌胃给药量应该不超过250ml"},{"label":"D","text":"犬灌胃给药量应该不超过600ml"}],"answer":"AB","raw":"365.标准体重的实验动物给药量，下列说法正确的 有_。（AB)\nA.小鼠灌胃给药量应该不超过0.8ml    B.大鼠灌胃给药量应该不超过5.0ml\nC.兔子灌胃给药量应该不超过250ml    D.犬灌胃给药量应该不超过600ml"},{"id":"M366","type":"multiple","number":366,"stem":"鸡可用于感染性疫病的研究，如支原体感染引起 的_。","options":[{"label":"A","text":"肺炎"},{"label":"B","text":"关节炎"},{"label":"C","text":"慢性呼吸道疾病"},{"label":"D","text":"卵巢炎"}],"answer":"ABCD","raw":"366.鸡可用于感染性疫病的研究，如支原体感染引起 的_。（ABCD)\nA.肺炎    B.关节炎    C.慢性呼吸道疾病    D.卵巢炎"},{"id":"M367","type":"multiple","number":367,"stem":"在营养学研究中，鸡可以用 于_的研究。","options":[{"label":"A","text":"B族维生素缺乏症"},{"label":"B","text":"碘缺乏症"},{"label":"C","text":"维生素D缺乏症"},{"label":"D","text":"钙磷代谢的调节"}],"answer":"ABCD","raw":"367.在营养学研究中，鸡可以用 于_的研究。（ABCD)\nA. B族维生素缺乏症 B.碘缺乏症 C.维生素D缺乏症 D.钙磷代谢的调节"},{"id":"M368","type":"multiple","number":368,"stem":"标准体重的实验动物给药量，下列说法正确的 有_。","options":[{"label":"A","text":"小鼠静脉注射给药量应该不超过1.0ml"},{"label":"B","text":"大鼠静脉注射给药量应该不超过4.0ml"},{"label":"C","text":"犬静脉注射给药量应该不超过120ml"},{"label":"D","text":"兔子静脉注射给药量应该不超过10ml"}],"answer":"BD","raw":"368.标准体重的实验动物给药量，下列说法正确的 有_。（BD)\nA.小鼠静脉注射给药量应该不超过1.0ml\nB.大鼠静脉注射给药量应该不超过4.0ml\nC.犬静脉注射给药量应该不超过120ml\nD.兔子静脉注射给药量应该不超过10ml"},{"id":"M369","type":"multiple","number":369,"stem":"关于鸽在生物医学研究中应用，下列说法正确的 有_。","options":[{"label":"A","text":"鸽的听觉和视觉非常发达，对于姿势的平衡反应也很敏锐。故在生理学实验中常用鸦观\n察迷路与姿势的关系"},{"label":"B","text":"当破坏鸽子一侧半规管后，其肌紧张协调发生障碍，运动时会失去正常的姿势，但静止\n时不会"},{"label":"C","text":"可用切除鸽大脑半球的方法来观察其大脑半球的一般功能"},{"label":"D","text":"单纯切除鸽大脑皮层对其正常生活影响不大"}],"answer":"ACD","raw":"369.关于鸽在生物医学研究中应用，下列说法正确的 有_。（ACD)\nA.鸽的听觉和视觉非常发达，对于姿势的平衡反应也很敏锐。故在生理学实验中常用鸦观\n察迷路与姿势的关系\nB.当破坏鸽子一侧半规管后，其肌紧张协调发生障碍，运动时会失去正常的姿势，但静止\n时不会\nC.可用切除鸽大脑半球的方法来观察其大脑半球的一般功能\nD.单纯切除鸽大脑皮层对其正常生活影响不大"},{"id":"M370","type":"multiple","number":370,"stem":"关于负的生物学特性，下列说法正确的有_。","options":[{"label":"A","text":"鱼类属于变温动物"},{"label":"B","text":"现已被开发利用做动物实验的鱼类达100种，极少数(如黄鱼等)己能在实验条件下人工饲养繁菹，但多数实验用鱼，均为从市场上购买或直接从水中捕捞"},{"label":"C","text":"金的皮肤具有很强的气体交换功能"},{"label":"D","text":"鱼真皮内含有色素细胞，因而鱼的皮肤具有各种颜色"}],"answer":"ABD","raw":"370.关于负的生物学特性，下列说法正确的有_。（ABD)\nA.鱼类属于变温动物\nB.现已被开发利用做动物实验的鱼类达100种，极少数(如黄鱼等)己能在实验条件下人工饲养繁菹，但多数实验用鱼，均为从市场上购买或直接从水中捕捞\nC.金的皮肤具有很强的气体交换功能\nD.鱼真皮内含有色素细胞，因而鱼的皮肤具有各种颜色"},{"id":"M371","type":"multiple","number":371,"stem":"动物实验需要做好的准备工作有_。","options":[{"label":"A","text":"实验场所"},{"label":"B","text":"仪器、药品、试剂"},{"label":"C","text":"实验动物"},{"label":"D","text":"动物饲养笼器具及饲料饮水等"}],"answer":"ABC","raw":"371.动物实验需要做好的准备工作有_。（ABC)\nA.实验场所    B.仪器、药品、试剂\nC.实验动物    D.动物饲养笼器具及饲料饮水等"},{"id":"M372","type":"multiple","number":372,"stem":"关于鱼的生物学特性下列说法正确的有_。","options":[{"label":"A","text":"消化系统比哺乳类简单得多，具有哺乳类大多数内分泌腺及特定的内分泌组织，有脑垂体、松果体、肾上腺等"},{"label":"B","text":"鱼泌尿系统比较完善，终端为尿生殖孔，且其繁殖行为多样，有卵生的，也有胎生的"},{"label":"C","text":"鱼的肾脏不仅有排泄功能.还是一个重要的造血器官"},{"label":"D","text":"鱼的心脏为两腔，心房心室各一个"}],"answer":"ABCD","raw":"372.关于鱼的生物学特性下列说法正确的有_。（ABCD)\nA.消化系统比哺乳类简单得多，具有哺乳类大多数内分泌腺及特定的内分泌组织，有脑垂体、松果体、肾上腺等\nB.鱼泌尿系统比较完善，终端为尿生殖孔，且其繁殖行为多样，有卵生的，也有胎生的\nC.鱼的肾脏不仅有排泄功能.还是一个重要的造血器官\nD.鱼的心脏为两腔，心房心室各一个"},{"id":"M373","type":"multiple","number":373,"stem":"下列说法正确的有_。","options":[{"label":"A","text":"鱼泌尿系统比较完善，终端为尿生殖孔，且其繁殖行为多样，有卵生的，也有胎生的"},{"label":"B","text":"鱼类饲料中的蛋白质的含量应在40%以上"},{"label":"C","text":"脂肪是鱼类最为重要的能量来源，它所产生的能量是蛋白质和糖类的2.5倍，又是脂溶性维生素的溶剂，也是细胞的组成成分，虽然鱼体能合成必需脂肪酸，但是量很少，需要经常补饲鱼体必需脂肪酸"},{"label":"D","text":"糖类是鱼类生长所必需的一类营养物质，摄入量不足，鱼代谢紊乱，鱼体减瘦。摄入量过多，超过鱼对糖的利用能力限度，多余部分则合成脂肪，长期摄入过多的糖，会导致脂肪肝，使肝功能减弱，解毒力下降，鱼体呈肥胖型"}],"answer":"ABD","raw":"373.下列说法正确的有_。（ABD)\nA.鱼泌尿系统比较完善，终端为尿生殖孔，且其繁殖行为多样，有卵生的，也有胎生的\nB.鱼类饲料中的蛋白质的含量应在40%以上\nC.脂肪是鱼类最为重要的能量来源，它所产生的能量是蛋白质和糖类的2.5倍，又是脂溶性维生素的溶剂，也是细胞的组成成分，虽然鱼体能合成必需脂肪酸，但是量很少，需要经常补饲鱼体必需脂肪酸\nD.糖类是鱼类生长所必需的一类营养物质，摄入量不足，鱼代谢紊乱，鱼体减瘦。摄入量过多，超过鱼对糖的利用能力限度，多余部分则合成脂肪，长期摄入过多的糖，会导致脂肪肝，使肝功能减弱，解毒力下降，鱼体呈肥胖型"},{"id":"M374","type":"multiple","number":374,"stem":"维生素分为脂溶性维生素和水溶性维生素两大类，下列属于脂溶性维生素的有。","options":[{"label":"A","text":"维生素A"},{"label":"B","text":"维生素D"},{"label":"C","text":"维生素E"},{"label":"D","text":"维生素K"},{"label":"E","text":"维生素B6"}],"answer":"ABCD","raw":"374.维生素分为脂溶性维生素和水溶性维生素两大类，下列属于脂溶性维生素的有。(ABCD)\nA.维生素A    B.维生素D    C.维生素E\nD.维生素K    E.维生素B6"},{"id":"M375","type":"multiple","number":375,"stem":"下列属于水溶性维生素的有_。","options":[{"label":"A","text":"泛酸"},{"label":"B","text":"胆碱"},{"label":"C","text":"肌醇"},{"label":"D","text":"维生素K"}],"answer":"ABC","raw":"375.下列属于水溶性维生素的有_。（ABC)\nA.泛酸  B.胆碱  C_肌醇  D.维生素K"},{"id":"M376","type":"multiple","number":376,"stem":"常见的麻醉剂 有_。","options":[{"label":"A","text":"水合氣醛"},{"label":"B","text":"1%盐酸普鲁卡因"},{"label":"C","text":"可拉明"},{"label":"D","text":"尼可刹米"}],"answer":"AB","raw":"376.常见的麻醉剂 有_。（AB)\nA.水合氣醛  B. 1%盐酸普鲁卡因 C.可拉明  D.尼可刹米"},{"id":"M377","type":"multiple","number":377,"stem":"魚在肿瘤学方面的研究，说法正确的有_。","options":[{"label":"A","text":"fe体很多组织都可发生肿瘤病变，无论自发性或诱发性肿瘤都较多，是理想的肿瘤研究\n的动物模型"},{"label":"B","text":"罗非鱼的肝脏、腮、眼、肾等组织器官易发生肿瘤"},{"label":"C","text":"二乙基亚硝胺易致金鱼肝癌"},{"label":"D","text":"鱼类是肿瘤研究的新资源，而且肿瘤有生物学特性与人类肿瘤相似"}],"answer":"ABCD","raw":"377.魚在肿瘤学方面的研究，说法正确的有_。（ABCD)\nA. fe体很多组织都可发生肿瘤病变，无论自发性或诱发性肿瘤都较多，是理想的肿瘤研究\n的动物模型\nB.罗非鱼的肝脏、腮、眼、肾等组织器官易发生肿瘤\nC.    二乙基亚硝胺易致金鱼肝癌\nD.鱼类是肿瘤研究的新资源，而且肿瘤有生物学特性与人类肿瘤相似"},{"id":"M378","type":"multiple","number":378,"stem":"影响动物实验结果的动物因素 有_。","options":[{"label":"A","text":"动物的种属"},{"label":"B","text":"动物的品种和品系"},{"label":"C","text":"动物的年龄"},{"label":"D","text":"动物的生理状态"}],"answer":"ABCD","raw":"378.影响动物实验结果的动物因素 有_。（ABCD)\nA.动物的种属    B.动物的品种和品系 C.动物的年龄 D.动物的生理状态"},{"id":"M379","type":"multiple","number":379,"stem":"蛙在生物医学研究中的应用_有_。","options":[{"label":"A","text":"离体蛙心能维持收缩相当长的时间，利用这一特点，可以研究心脏的生理功能和药物对\n心脏的作用"},{"label":"B","text":"蛙类的腓肠肌和坐骨神经是研究外周神经功能和药物对周围神经、神经终板作用理想材料"},{"label":"C","text":"用青蛙的腹直肌，可以鉴定胆碱能药物，蛙类后肢血管清晰明显，用灌注法可以观察肾\n上腺素药和乙酰胆碱对血管的作用"},{"label":"D","text":"用于脊髓休克、脊髄反射和观察反射弧分布的实验研究，还可用于比较发育学、移植免\n疫学、肢体再生、致畸药物筛选、激素测定及肿瘤学方面的研究"}],"answer":"ABCD","raw":"379.蛙在生物医学研究中的应用_有_。（ABCD)\nA.离体蛙心能维持收缩相当长的时间，利用这一特点，可以研究心脏的生理功能和药物对\n心脏的作用\nB.蛙类的腓肠肌和坐骨神经是研究外周神经功能和药物对周围神经、神经终板作用理想材料\nC.用青蛙的腹直肌，可以鉴定胆碱能药物，蛙类后肢血管清晰明显，用灌注法可以观察肾\n上腺素药和乙酰胆碱对血管的作用\nD.用于脊髓休克、脊髄反射和观察反射弧分布的实验研究，还可用于比较发育学、移植免\n疫学、肢体再生、致畸药物筛选、激素测定及肿瘤学方面的研究"},{"id":"M380","type":"multiple","number":380,"stem":"马可以用 于_等方面的研究。","options":[{"label":"A","text":"抗银环蛇毒马血清"},{"label":"B","text":"胎儿甲种球蛋白血清"},{"label":"C","text":"抗白喉血清"},{"label":"D","text":"抗破伤风抗血清"}],"answer":"ABCD","raw":"380.马可以用 于_等方面的研究。 （ABCD)\nA.抗银环蛇毒马血清    B.胎儿甲种球蛋白血清\nC.抗白喉血清    D.抗破伤风抗血清"},{"id":"M381","type":"multiple","number":381,"stem":"马能用 于_等遗传疾病方面的研究。","options":[{"label":"A","text":"无虹膜症"},{"label":"B","text":"小脑退化症"},{"label":"C","text":"白斑病"},{"label":"D","text":"先天愚型"}],"answer":"ABC","raw":"381.马能用 于_等遗传疾病方面的研究。 （ABC)\nA.无虹膜症 B.小脑退化症 C.白斑病 D.先天愚型"},{"id":"M382","type":"multiple","number":382,"stem":"有哪些实验环境方面的因素会影响动物实验的结 果_。","options":[{"label":"A","text":"温度和湿度"},{"label":"B","text":"光照"},{"label":"C","text":"麻醉深度"},{"label":"D","text":"动物饲养密度"}],"answer":"ABCD","raw":"382.有哪些实验环境方面的因素会影响动物实验的结 果_。（ABCD)\nA.温度和湿度 B.光照 C.麻醉深度 D.动物饲养密度"},{"id":"M383","type":"multiple","number":383,"stem":"染色法编号常用染液 有_。","options":[{"label":"A","text":"3%~5%苦味酸溶液"},{"label":"B","text":"0.5%的中性品红溶液"},{"label":"C","text":"2%的硝酸银溶液"},{"label":"D","text":"10%的氨基黑溶液"}],"answer":"ABC","raw":"383.染色法编号常用染液 有_。（ABC)\nA. 3%~5%苦味酸溶液    B. 0.5%的中性品红溶液\nC. 2%的硝酸银溶液    D. 10%的氨基黑溶液"}];

const TYPE_NAME={judgment:"判断题",single:"单项选择题",multiple:"多项选择题"};
const defaultState=()=>({answers:{},favorites:{},notes:{},mode:"sequence"});
let state;try{state=Object.assign(defaultState(),JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}"))}catch(e){state=defaultState()}state.answers||={};state.favorites||={};state.notes||={};
let currentList=[],currentIndex=0,selected=new Set(),revealed=false,exam=null;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const save=()=>localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const currentQ=()=>currentList[currentIndex];

function baseFiltered(){const types=new Set($$(".typeFilter:checked").map(x=>x.value)),key=$("#searchInput").value.trim().toLowerCase(),from=Number($("#fromNo").value)||0,to=Number($("#toNo").value)||Infinity;return QUESTIONS.filter(q=>{if(!types.has(q.type)||q.number<from||q.number>to)return false;if(key){const hay=(q.stem+"\n"+q.raw+"\n"+q.options.map(o=>o.text).join("\n")).toLowerCase();if(!hay.includes(key))return false}return true})}
function answerIsCorrect(q,a){if(!a)return false;return String(a).split("").sort().join("")===q.answer.split("").sort().join("")}
function setModeUI(){$$(".mode").forEach(b=>b.classList.toggle("active",b.dataset.mode===state.mode))}
function buildList(reset=true){if(exam)return;let list=baseFiltered(),m=state.mode||"sequence";if(m==="wrong")list=list.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct);if(m==="favorite")list=list.filter(q=>state.favorites[q.id]);if(m==="unanswered")list=list.filter(q=>!state.answers[q.id]);if(m==="random")list=shuffle([...list]);currentList=list;if(reset)currentIndex=0;if(currentIndex>=currentList.length)currentIndex=Math.max(0,currentList.length-1);render()}
function explanationHtml(q){if(!(q.type==="judgment"&&q.answer==="×"&&q.explanation))return "";return `<div class="explain-box"><div class="explain-title">纠错解析 <span class="explain-tag">按原题库答案口径</span></div><div class="explain-text">${esc(q.explanation)}</div></div>`}
function feedbackHtml(q,u,c){const hasExp=q.type==="judgment"&&q.answer==="×"&&q.explanation;return `<div class="feedback show ${c?"ok":"bad"}"><b>${c?"✓ 回答正确":"✗ 回答错误"}</b><br>你的答案：${esc(u||"未作答")}　正确答案：<b>${esc(q.answer)}</b>${hasExp?"":"<br><span style=\"font-size:13px\">本题库未提供标准解析，程序只展示原题所给答案。</span>"}</div>${explanationHtml(q)}`}
function render(){setModeUI();updateStats();$("#listInfo").textContent=`当前列表 ${currentList.length} 题 · 总题库 ${QUESTIONS.length} 题`;$("#positionInfo").textContent=currentList.length?`${currentIndex+1} / ${currentList.length}`:"0 / 0";$("#prevBtn").disabled=!currentList.length||currentIndex===0;$("#nextBtn").disabled=!currentList.length||currentIndex===currentList.length-1&&!exam;const box=$("#qCard");if(!currentList.length){box.innerHTML='<div class="empty">没有符合当前条件的题目。可以调整题型、题号范围或搜索条件。</div>';return}
const q=currentQ(),rec=state.answers[q.id];selected=new Set(rec?String(rec.answer).split(""):[]);revealed=!!rec;
const oh=q.options.map(o=>{let c="option";if(selected.has(o.label))c+=" selected";if(revealed){if(q.answer.includes(o.label))c+=" correct";else if(selected.has(o.label))c+=" wrong"}return `<button class="${c}" data-label="${esc(o.label)}"><span class="letter">${esc(o.label)}</span><span class="opttext">${esc(o.text)}</span></button>`}).join("");
box.innerHTML=`<div class="qmeta"><div class="badge">${TYPE_NAME[q.type]} · 第 ${q.number} 题 · ${q.id}</div><div class="qactions"><button class="btn small star ${state.favorites[q.id]?"on":""}" id="favBtn">${state.favorites[q.id]?"★ 已收藏":"☆ 收藏"}</button><button class="btn small" id="rawBtn">原题原文</button></div></div><div class="stem">${esc(q.stem)}</div><div class="options">${oh}</div><div class="submit-row"><button class="btn primary" id="submitBtn">${revealed?"重新提交":"提交答案"}</button><button class="btn" id="showAnswerBtn">直接看答案</button></div><div id="feedback">${rec?feedbackHtml(q,rec.answer,rec.correct):""}</div><div class="raw" id="rawText">${esc(q.raw)}</div><details class="note-wrap"><summary>我的笔记</summary><textarea id="noteInput" placeholder="写下易错点、记忆口诀或复习备注…">${esc(state.notes[q.id]||"")}</textarea></details>`;
bindQuestionEvents()}
function bindQuestionEvents(){const q=currentQ();$$(".option").forEach(b=>b.onclick=()=>{const l=b.dataset.label;if(q.type==="multiple"){selected.has(l)?selected.delete(l):selected.add(l)}else selected=new Set([l]);revealed=false;$$(".option").forEach(x=>x.classList.toggle("selected",selected.has(x.dataset.label)));$("#feedback").innerHTML=""});$("#submitBtn").onclick=()=>submitAnswer(false);$("#showAnswerBtn").onclick=()=>submitAnswer(true);$("#favBtn").onclick=()=>{state.favorites[q.id]?delete state.favorites[q.id]:state.favorites[q.id]=true;save();render()};$("#rawBtn").onclick=()=>$("#rawText").classList.toggle("show");$("#noteInput").oninput=e=>{state.notes[q.id]=e.target.value;save()}}
function submitAnswer(showOnly){const q=currentQ();if(!showOnly&&selected.size===0){alert("请先选择答案。");return}const a=[...selected].sort().join(""),c=!showOnly&&answerIsCorrect(q,a);if(!showOnly){state.answers[q.id]={answer:a,correct:c,ts:Date.now()};save();if(exam)exam.answers[q.id]={answer:a,correct:c}}revealed=true;$$(".option").forEach(b=>{const l=b.dataset.label;b.classList.toggle("selected",selected.has(l));b.classList.toggle("correct",q.answer.includes(l));b.classList.toggle("wrong",selected.has(l)&&!q.answer.includes(l))});$("#feedback").innerHTML=showOnly?`<div class="feedback show info"><b>正确答案：${esc(q.answer)}</b><br><span style="font-size:13px">直接查看答案不会计入正确率。</span></div>${explanationHtml(q)}`:feedbackHtml(q,a,c);updateStats();if(exam)updateExamBanner()}
function updateStats(){const a=Object.values(state.answers),n=a.length,c=a.filter(x=>x.correct).length,w=a.filter(x=>!x.correct).length,f=Object.keys(state.favorites).length;$("#answeredStat").textContent=n;$("#accuracyStat").textContent=n?Math.round(c/n*100)+"%":"—";$("#wrongStat").textContent=w;$("#favStat").textContent=f;$("#progressBar").style.width=Math.min(100,n/QUESTIONS.length*100)+"%";$("#progressText").textContent=`总进度 ${n} / ${QUESTIONS.length}（${(n/QUESTIONS.length*100).toFixed(1)}%）`}
function go(d){const i=currentIndex+d;if(i>=0&&i<currentList.length){currentIndex=i;render()}else if(exam&&d>0&&currentIndex===currentList.length-1)finishExam()}
$("#prevBtn").onclick=()=>go(-1);$("#nextBtn").onclick=()=>{if(exam&&currentIndex===currentList.length-1)finishExam();else go(1)};$("#applyFilter").onclick=()=>buildList(true);$("#shuffleBtn").onclick=()=>{currentList=shuffle([...currentList]);currentIndex=0;render()};
$("#jumpBtn").onclick=()=>{if(!currentList.length)return;const n=Number(prompt("输入要跳转的题号："));if(!n)return;const i=currentList.findIndex(x=>x.number===n);if(i>=0){currentIndex=i;render()}else alert("当前列表中没有这个题号。")};
$$(".mode").forEach(b=>b.onclick=()=>{const m=b.dataset.mode;if(m==="exam"){$("#examDialog").showModal();return}exam=null;$("#examBanner").classList.remove("show");state.mode=m;save();buildList(true)});
$("#clearCurrentBtn").onclick=()=>{const q=currentQ();if(!q)return;delete state.answers[q.id];save();render()};$("#resetBtn").onclick=()=>{if(confirm("确定清空全部答题记录、错题、收藏和笔记吗？")){state=defaultState();save();buildList(true)}};
function runAudit(){const issues=[],count={judgment:0,single:0,multiple:0},ids=new Set();for(const q of QUESTIONS){count[q.type]++;if(ids.has(q.id))issues.push("重复ID："+q.id);ids.add(q.id);if(!q.stem)issues.push(q.id+"题干为空");if(!q.answer)issues.push(q.id+"答案为空");if(!q.raw)issues.push(q.id+"原文为空");if(q.type==="judgment"&&q.answer==="×"&&!q.explanation)issues.push(`${q.id}缺少纠错解析`);if(q.type!=="judgment"){const labs=q.options.map(o=>o.label);for(const a of q.answer)if(!labs.includes(a))issues.push(`${q.id}答案${a}不在选项中`)}}const e={judgment:701,single:625,multiple:383};for(const k in e)if(count[k]!==e[k])issues.push(`${TYPE_NAME[k]}数量${count[k]}，应为${e[k]}`);const ok=issues.length===0;$("#auditContent").innerHTML=`<div class="${ok?"pass":"warn"}">${ok?"✓ 结构自检通过":"⚠ 发现结构问题"}</div><p>总题数：${QUESTIONS.length}<br>判断题：${count.judgment} / 701<br>单项选择题：${count.single} / 625<br>多项选择题：${count.multiple} / 383</p><p>检查项：题数、唯一ID、题干、原文、答案、答案是否落在可选项内，以及237道“×”判断题纠错解析是否全覆盖。</p>${ok?"<p>未发现程序抽取造成的缺题、空题、空答案或选项映射错误。</p>":"<pre>"+esc(issues.slice(0,50).join("\n"))+"</pre>"}<p style="color:var(--muted)">说明：这是程序/数据结构自检，不等同于对题库知识点和标准答案的外部事实核验。</p>`}
$("#auditBtn").onclick=()=>{runAudit();$("#auditDialog").showModal()};
$("#exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="实验动物题库_学习进度.json";a.click();URL.revokeObjectURL(a.href)};
$("#importBtn").onclick=()=>$("#importFile").click();$("#importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.state)throw new Error("文件格式不正确");state=Object.assign(defaultState(),o.state);state.answers||={};state.favorites||={};state.notes||={};save();buildList(true);alert("学习进度已导入。")}catch(err){alert("导入失败："+err.message)}e.target.value=""};
$("#startExamBtn").onclick=()=>{let pool=QUESTIONS.filter(q=>$("#examType").value==="all"||q.type===$("#examType").value),count=Math.min(Number($("#examCount").value),pool.length);if($("#examWrongFirst").checked){const wrong=pool.filter(q=>state.answers[q.id]&&!state.answers[q.id].correct),ws=new Set(wrong.map(q=>q.id)),rest=pool.filter(q=>!ws.has(q.id));pool=[...shuffle(wrong),...shuffle(rest)]}else pool=shuffle([...pool]);currentList=pool.slice(0,count);currentIndex=0;exam={answers:{},startedAt:Date.now(),count};$("#examDialog").close();$("#examBanner").classList.add("show");updateExamBanner();render()};
function updateExamBanner(){if(exam)$("#examBanner").textContent=`模拟考试进行中：已作答 ${Object.keys(exam.answers).length} / ${exam.count}。最后一题点击“下一题”即可交卷。`}
function finishExam(){if(!exam)return;const d=Object.keys(exam.answers).length,c=Object.values(exam.answers).filter(x=>x.correct).length,s=exam.count?Math.round(c/exam.count*100):0;alert(`模拟考试完成！\n得分：${s} 分\n答对：${c} 题\n已答：${d} 题\n未答：${exam.count-d} 题`);exam=null;$("#examBanner").classList.remove("show");state.mode="wrong";save();buildList(true)}
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))return;const q=currentQ();if(!q)return;if(e.key==="ArrowLeft")go(-1);if(e.key==="ArrowRight")$("#nextBtn").click();if(/^[1-5]$/.test(e.key)){const o=q.options[Number(e.key)-1];if(o)document.querySelector(`.option[data-label="${o.label}"]`)?.click()}if(e.key==="Enter")$("#submitBtn")?.click()});
runAudit();buildList(true);
</script></body></html>
