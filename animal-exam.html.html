良、血清中IgM、IgG水平低，免疫功能处于原始状态。   （√）"},{"id":"J573","type":"judgment","number":573,"stem":"无菌动物盲肠肥大，比普通动物要大5-6倍，无菌豚鼠的盲肠可达体重的1/3。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"无菌动物盲肠肥大，比普通动物要大5-6倍，无菌豚鼠的盲肠可达体重的1/3。   （√）"},{"id":"J574","type":"judgment","number":574,"stem":"无菌动物抗辐射能力强，普通动物受辐射后往往由于细菌感染引起并发症而造成动物死亡。无菌动物就不存在这种情况。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"无菌动物抗辐射能力强，普通动物受辐射后往往由于细菌感染引起并发症而造成动物死亡。无菌动物就不存在这种情况。   （√）"},{"id":"J575","type":"judgment","number":575,"stem":"无菌动物抗辐射能力差，受辐射后往往由于细菌感染引起并发症而造成动物死亡。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"无菌动物抗辐射能力差，受辐射后往往由于细菌感染引起并发症而造成动物死亡。   （×）","explanation":"无菌动物由于不存在普通动物受辐射后继发细菌感染的问题，抗辐射能力相对较强，不能说“更差且因细菌并发症死亡”。"},{"id":"J576","type":"judgment","number":576,"stem":"无菌动物不一定来源于剖腹产或无菌卵的孵化。所以无菌动物适合于作一些特殊的研究试验，如微生物学寄生虫学研究、免疫学研究、肿瘤学研究、老年学研究、营养学研究、放射医学研究、心血管疾病研究、毒理和药理学研究等。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"无菌动物不一定来源于剖腹产或无菌卵的孵化。所以无菌动物适合于作一些特殊的研究试验，如微生物学寄生虫学研究、免疫学研究、肿瘤学研究、老年学研究、营养学研究、放射医学研究、心血管疾病研究、毒理和药理学研究等。   （×）","explanation":"无菌动物通常通过无菌剖腹产、无菌卵孵化等方式获得，并在无菌环境中饲养维持；不能说其来源“不一定需要无菌获得过程”。"},{"id":"J577","type":"judgment","number":577,"stem":"无菌动物机体内既无抗原，也无抗体，处于一种免疫“原始状态”，很适合于各种免疫功能的研究。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"无菌动物机体内既无抗原，也无抗体，处于一种免疫“原始状态”，很适合于各种免疫功能的研究。   （√）"},{"id":"J578","type":"judgment","number":578,"stem":"悉生动物应用在许多微生物学研究上是一个突出的例子。只有选用悉生动物，才有可能了解到单一微生物和抗体之间的关系。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"悉生动物应用在许多微生物学研究上是一个突出的例子。只有选用悉生动物，才有可能了解到单一微生物和抗体之间的关系。   （√）"},{"id":"J579","type":"judgment","number":579,"stem":"悉生动物可以作为“哨兵”用于屏障系统饲养环境的检测，以保证所繁殖的SPF动物的质量；可以用于营养学的研究，以分析维生素在动物体内的合成利用；用于消化系统研究分析肠道菌群与胆汁代谢的关系等。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"悉生动物可以作为“哨兵”用于屏障系统饲养环境的检测，以保证所繁殖的SPF动物的质量；可以用于营养学的研究，以分析维生素在动物体内的合成利用；用于消化系统研究分析肠道菌群与胆汁代谢的关系等。   （√）"},{"id":"J580","type":"judgment","number":580,"stem":"实验动物微生物和寄生虫的检测频率要求：普通动物、清洁动物、无特定病原体动物，每三个月至少检测动物一次；无菌动物，每年至少检测动物一次。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物微生物和寄生虫的检测频率要求：普通动物、清洁动物、无特定病原体动物，每三个月至少检测动物一次；无菌动物，每年至少检测动物一次。   （√）"},{"id":"J581","type":"judgment","number":581,"stem":"实验动物微生物和寄生虫的检测频率要求：普通动物、清洁动物、无特定病原体动物，每六个月至少检测动物一次；无菌动物，每年至少检测动物一次。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物微生物和寄生虫的检测频率要求：普通动物、清洁动物、无特定病原体动物，每六个月至少检测动物一次；无菌动物，每年至少检测动物一次。   （×）","explanation":"按本题库微生物与寄生虫检测频率口径，普通、清洁和SPF动物至少每3个月检测一次，不是每6个月一次；无菌动物按相应规定检测。"},{"id":"J582","type":"judgment","number":582,"stem":"实验动物的遗传质量控制主要包括两个方面内容，一是科学地进行引种、繁殖和生产，即对生产过程进行控制；二是建立定期地遗传监测制度，对产品的质量进行控制。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物的遗传质量控制主要包括两个方面内容，一是科学地进行引种、繁殖和生产，即对生产过程进行控制；二是建立定期地遗传监测制度，对产品的质量进行控制。   （√）"},{"id":"J583","type":"judgment","number":583,"stem":"因实验动物多被限制在一个极其特定的环境中，它的生活和它对环境的自主选择要受到限制，因而对实验动物环境就要进行控制。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"因实验动物多被限制在一个极其特定的环境中，它的生活和它对环境的自主选择要受到限制，因而对实验动物环境就要进行控制。   （√）"},{"id":"J584","type":"judgment","number":584,"stem":"实验动物环境设施主要包括外环境和内环境，外环境主要是指实验动物饲育和实验场所外的周围环境，内环境主要是指实验动物饲育和实验场所内的环境。内外环境因素对实验动物有直接作用和间接作用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物环境设施主要包括外环境和内环境，外环境主要是指实验动物饲育和实验场所外的周围环境，内环境主要是指实验动物饲育和实验场所内的环境。内外环境因素对实验动物有直接作用和间接作用。   （√）"},{"id":"J585","type":"judgment","number":585,"stem":"实验动物设施的建设，必需满足环境控制的要求，这就要求相关设施必须经过验收，试运转期间未出偏差，交付使用时已具备了环境控制达标的能力。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的建设，必需满足环境控制的要求，这就要求相关设施必须经过验收，试运转期间未出偏差，交付使用时已具备了环境控制达标的能力。   （√）"},{"id":"J586","type":"judgment","number":586,"stem":"动物设施饲养动物后应采取很多配合措施，辅之严格的管理工作，如主要进风口空气洁净度及各进风口风速的定期测定。通过测定探索出各级空气过滤器滤材的更换时间。确保进风量及空气洁净度是维持通风换气，气压梯度的主要关键。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物设施饲养动物后应采取很多配合措施，辅之严格的管理工作，如主要进风口空气洁净度及各进风口风速的定期测定。通过测定探索出各级空气过滤器滤材的更换时间。确保进风量及空气洁净度是维持通风换气，气压梯度的主要关键。   （√）"},{"id":"J587","type":"judgment","number":587,"stem":"动物设施内环境控制及维持只要有好的硬件条件，管理制度和工作人员的素质并不很重要。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物设施内环境控制及维持只要有好的硬件条件，管理制度和工作人员的素质并不很重要。   （×）","explanation":"动物设施质量不仅取决于硬件，还高度依赖管理制度、SOP执行和工作人员素质，三者缺一不可。"},{"id":"J588","type":"judgment","number":588,"stem":"生产型设施指用于实验动物繁育、生产的建筑物、设备以及包括运行管理在内的总和。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"生产型设施指用于实验动物繁育、生产的建筑物、设备以及包括运行管理在内的总和。   （√）"},{"id":"J589","type":"judgment","number":589,"stem":"生产使用型设施指用于实验动物繁育、生产的建筑物、设备以及包括运行管理在内的总和。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"生产使用型设施指用于实验动物繁育、生产的建筑物、设备以及包括运行管理在内的总和。   （×）","explanation":"用于实验动物繁育、生产的设施称为“动物生产型设施”，题干的“生产使用型设施”概念混淆。"},{"id":"J590","type":"judgment","number":590,"stem":"动物使用型设施指以研究、试验、教学、生物制品药品生产等为目的进行动物饲育、试验的建筑物，设备以及包括运行管理在内的总和。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物使用型设施指以研究、试验、教学、生物制品药品生产等为目的进行动物饲育、试验的建筑物，设备以及包括运行管理在内的总和。   （√）"},{"id":"J591","type":"judgment","number":591,"stem":"动物生产型设施指以研究、试验、教学、生物制品药品生产等为目的进行动物饲育、试验的建筑物，设备以及包括运行管理在内的总和。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"动物生产型设施指以研究、试验、教学、生物制品药品生产等为目的进行动物饲育、试验的建筑物，设备以及包括运行管理在内的总和。   （×）","explanation":"以研究、试验、教学和生物制品生产等为目的进行动物饲育和实验的设施属于“动物使用型设施”，不是生产型设施。"},{"id":"J592","type":"judgment","number":592,"stem":"环境因素是直接影响实验动物进化、生态反应和生长的所有外界条件的总和。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"环境因素是直接影响实验动物进化、生态反应和生长的所有外界条件的总和。   （√）"},{"id":"J593","type":"judgment","number":593,"stem":"各种动物对环境的适应能力并不相同。近交系动物的基因纯合程度可达98．6％以上。由于基因纯合，动物失去了杂合基因型能较广泛的适应环境的能力。因此，它在繁殖与生长中需要更为严格的环境条件。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"各种动物对环境的适应能力并不相同。近交系动物的基因纯合程度可达98．6％以上。由于基因纯合，动物失去了杂合基因型能较广泛的适应环境的能力。因此，它在繁殖与生长中需要更为严格的环境条件。   （√）"},{"id":"J594","type":"judgment","number":594,"stem":"各种动物对环境的适应能力并不相同。近交系动物的基因纯合程度可达98．6％以上。由于基因纯合，动物有了杂合基因型能较广泛的适应环境的能力。因此，它在繁殖与生长中的环境条件可放宽。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"各种动物对环境的适应能力并不相同。近交系动物的基因纯合程度可达98．6％以上。由于基因纯合，动物有了杂合基因型能较广泛的适应环境的能力。因此，它在繁殖与生长中的环境条件可放宽。   （×）","explanation":"近交系高度纯合，遗传多样性低、环境适应范围反而较窄，所以繁殖和生长通常需要更严格、稳定的环境条件。"},{"id":"J595","type":"judgment","number":595,"stem":"实验动物饲养的目的是为了进行动物实验。环境条件不仅影响实验动物的品质，还直接影响动物实验的科学性、动物反应的敏感性、实验结果的可重复性。所以，必须严格控制实验动物的环境条件。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物饲养的目的是为了进行动物实验。环境条件不仅影响实验动物的品质，还直接影响动物实验的科学性、动物反应的敏感性、实验结果的可重复性。所以，必须严格控制实验动物的环境条件。   （√）"},{"id":"J596","type":"judgment","number":596,"stem":"温度对实验动物的影响主要表现在生殖、泌乳、机体抵抗力、生长、形态、新陈代谢和实验反应性等方面。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"温度对实验动物的影响主要表现在生殖、泌乳、机体抵抗力、生长、形态、新陈代谢和实验反应性等方面。   （√）"},{"id":"J597","type":"judgment","number":597,"stem":"空气湿度的大小对实验动物的散热率不一定有显著影响，但高温、高湿的环境，尤其不利于动物的散热。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"空气湿度的大小对实验动物的散热率不一定有显著影响，但高温、高湿的环境，尤其不利于动物的散热。   （×）","explanation":"空气湿度会影响蒸发散热和体温调节，尤其在高温环境下影响明显，不能说“不一定有显著影响”来弱化其作用。"},{"id":"J598","type":"judgment","number":598,"stem":"噪声对实验动物生殖生理不一定会造成严重不良影响。但有时可使大、小鼠生育力减退，妊娠障碍和流产，甚至出现食仔现象。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"噪声对实验动物生殖生理不一定会造成严重不良影响。但有时可使大、小鼠生育力减退，妊娠障碍和流产，甚至出现食仔现象。   （×）","explanation":"噪声可造成应激，并可能使生育力下降、妊娠障碍、流产和食仔等，因此对生殖生理可能产生严重不良影响。"},{"id":"J599","type":"judgment","number":599,"stem":"噪声对实验结果也有很大影响。声音刺激会引起心跳、呼吸次数及血压增加，血糖值出现明显不同。噪声能使小鼠发生白细胞数的变动，免疫机能变化，大鼠出现高血压，心脏肥大，电解质变化，肾上腺皮质酮分泌增加。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"噪声对实验结果也有很大影响。声音刺激会引起心跳、呼吸次数及血压增加，血糖值出现明显不同。噪声能使小鼠发生白细胞数的变动，免疫机能变化，大鼠出现高血压，心脏肥大，电解质变化，肾上腺皮质酮分泌增加。   （√）"},{"id":"J600","type":"judgment","number":600,"stem":"光照对实验动物影响主要表现在生殖、生理行为上。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"光照对实验动物影响主要表现在生殖、生理行为上。   （√）"},{"id":"J601","type":"judgment","number":601,"stem":"气流及风速对实验动物影响主要表现在疾病传播，损害动物与工作人员健康。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"气流及风速对实验动物影响主要表现在疾病传播，损害动物与工作人员健康。   （√）"},{"id":"J602","type":"judgment","number":602,"stem":"生物洁净技术：指以有生命微粒控制为对象的洁净技术。它强调将工程学和卫生学措施结合起来，采用多种手段，形成了一种有效控制微生物的综合措施，其技术意义是除掉细菌要比控制细菌繁殖更重要，这是生物洁净技术的一个很重要原则。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"生物洁净技术：指以有生命微粒控制为对象的洁净技术。它强调将工程学和卫生学措施结合起来，采用多种手段，形成了一种有效控制微生物的综合措施，其技术意义是除掉细菌要比控制细菌繁殖更重要，这是生物洁净技术的一个很重要原则。   （×）","explanation":"生物洁净技术既要减少环境中的微生物，又要防止其繁殖和扩散；不能把“除掉细菌比控制繁殖更重要”作为绝对原则。"},{"id":"J603","type":"judgment","number":603,"stem":"一般生物洁净技术设施，主要控制有生命微粒对工作对象的污染，同时其内部材料要能经受各种灭菌制剂侵蚀，内部一般保持负压。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"一般生物洁净技术设施，主要控制有生命微粒对工作对象的污染，同时其内部材料要能经受各种灭菌制剂侵蚀，内部一般保持负压。   （×）","explanation":"一般生物洁净设施主要保护工作对象、防止外界微粒污染，通常采用正压控制，而不是负压。"},{"id":"J604","type":"judgment","number":604,"stem":"生物学安全洁净技术设施，主要控制工作对象有生命微粒对外界和人的污染，内部保持正压。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"生物学安全洁净技术设施，主要控制工作对象有生命微粒对外界和人的污染，内部保持正压。   （×）","explanation":"生物安全洁净设施重点防止工作对象中的有害生物因子向外扩散，通常采用负压控制，而不是正压。"},{"id":"J605","type":"judgment","number":605,"stem":"洁净工作服的屏蔽效率不仅与它的材质有关，而且与它的密封性有关，由于考虑到使用方便和人体舒适性的要求，事实上很难做到完全屏蔽（包括全身吸气服在内），所以，人体散发的尘粒和细菌，仅仅依靠洁净工作服是不可能做到完全控制的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"洁净工作服的屏蔽效率不仅与它的材质有关，而且与它的密封性有关，由于考虑到使用方便和人体舒适性的要求，事实上很难做到完全屏蔽（包括全身吸气服在内），所以，人体散发的尘粒和细菌，仅仅依靠洁净工作服是不可能做到完全控制的。   （√）"},{"id":"J606","type":"judgment","number":606,"stem":"通风就是以通风换气的方法改善室内的空气环境，主要是控制室内有害物含量不超过卫生标准，把局部地点或整个房间内污染空气排至室外，把新鲜空气或符合卫生标准的空气送入室内。前者称为排风，后者称为送风，为此而设置的设备及管道称为通风系统。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"通风就是以通风换气的方法改善室内的空气环境，主要是控制室内有害物含量不超过卫生标准，把局部地点或整个房间内污染空气排至室外，把新鲜空气或符合卫生标准的空气送入室内。前者称为排风，后者称为送风，为此而设置的设备及管道称为通风系统。   （√）"},{"id":"J607","type":"judgment","number":607,"stem":"生物洁净技术设施通风系统目的，是要将经过净化的洁净空气不断地送入室内，从而达到稀释（或挤排）室内尖埃、微生物。并不断将室内污染空气排至室外，使室内浓度不超过规定的上限浓度，从而维持平衡。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"生物洁净技术设施通风系统目的，是要将经过净化的洁净空气不断地送入室内，从而达到稀释（或挤排）室内尖埃、微生物。并不断将室内污染空气排至室外，使室内浓度不超过规定的上限浓度，从而维持平衡。   （√）"},{"id":"J608","type":"judgment","number":608,"stem":"集中式空调系统：集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"集中式空调系统：集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。   （√）"},{"id":"J609","type":"judgment","number":609,"stem":"混合式空调系统：集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"混合式空调系统：集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。   （×）","explanation":"题干描述的是“集中式空调系统”的典型形式，不是混合式空调系统。"},{"id":"J610","type":"judgment","number":610,"stem":"局部式空调系统：它不需要集中空调机房，而是将局部空调机组分散设置在需要进行空气调节的实验动物屏障设施内或紧靠近的房间、天花板、地下技术夹层内。局部空调机组由冷冻机、通风机、空气加热器、表冷器和过滤器等组成。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"局部式空调系统：它不需要集中空调机房，而是将局部空调机组分散设置在需要进行空气调节的实验动物屏障设施内或紧靠近的房间、天花板、地下技术夹层内。局部空调机组由冷冻机、通风机、空气加热器、表冷器和过滤器等组成。   （√）"},{"id":"J611","type":"judgment","number":611,"stem":"混合式空调系统所处理的空气部分取自室外，部分取自室内再循环空气，循环空气的多少，由洁净工作区需要和可能来确定。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"混合式空调系统所处理的空气部分取自室外，部分取自室内再循环空气，循环空气的多少，由洁净工作区需要和可能来确定。   （√）"},{"id":"J612","type":"judgment","number":612,"stem":"正确选择空气调节系统，要依据实验动物生产规模或开展动物实验的多少、建筑性质、空气调节负荷变化情况及温度。湿度。风速、压力、洁净级别等控制参数的精度等因素，技术管理水平，经济效益等来确定。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"正确选择空气调节系统，要依据实验动物生产规模或开展动物实验的多少、建筑性质、空气调节负荷变化情况及温度。湿度。风速、压力、洁净级别等控制参数的精度等因素，技术管理水平，经济效益等来确定。   （√）"},{"id":"J613","type":"judgment","number":613,"stem":"合理的空气调节方案要与实验动物设施的工艺流程相符合。以设施外最不利的环境参数为依据，结合实际情况，在满足环境控制要求的前提下，避免片面追求高精度、大面积、全自动的不合理选择。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"合理的空气调节方案要与实验动物设施的工艺流程相符合。以设施外最不利的环境参数为依据，结合实际情况，在满足环境控制要求的前提下，避免片面追求高精度、大面积、全自动的不合理选择。   （√）"},{"id":"J614","type":"judgment","number":614,"stem":"空气乱流，又称为空气单向流。乱流方式的洁净设施构造简单，施工方便，投资和运行费用较小，因而实验动物设施等大多数洁净室都采用此方式。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"空气乱流，又称为空气单向流。乱流方式的洁净设施构造简单，施工方便，投资和运行费用较小，因而实验动物设施等大多数洁净室都采用此方式。   （×）","explanation":"空气乱流属于非单向流；单向流对应层流，二者名称不能互换。"},{"id":"J615","type":"judgment","number":615,"stem":"乱流方式主要是利用稀释作用，使室内尘源产生的灰尘均匀扩散而被“冲淡”。它的原则是满足工艺和人的卫生要求，避免涡流把工作区外的灰尘卷入工作区，以减少产品的污染机会。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"乱流方式主要是利用稀释作用，使室内尘源产生的灰尘均匀扩散而被“冲淡”。它的原则是满足工艺和人的卫生要求，避免涡流把工作区外的灰尘卷入工作区，以减少产品的污染机会。   （√）"},{"id":"J616","type":"judgment","number":616,"stem":"空气层流，又称为空气非单向流。层流方式的洁净设施构造简单，施工方便，投资和运行费用较小，因而实验动物设施等大多数洁净室都采用此方式。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"空气层流，又称为空气非单向流。层流方式的洁净设施构造简单，施工方便，投资和运行费用较小，因而实验动物设施等大多数洁净室都采用此方式。   （×）","explanation":"空气层流属于单向流，净化效果高但系统和运行要求也较高；不能称为非单向流，也不能把乱流系统的低成本特点套给层流。"},{"id":"J617","type":"judgment","number":617,"stem":"层流方式是指流线平行、流向单一、具有一定的和均匀的断面速度的气流组织方式，送入房间的气流充满整个洁净室断面，它像“活塞作用”那样把室内随时产主的灰尘压至下风侧，再把灰尘排至室外。由于这种方式是以要求室内断面上有一定风速为前提的，所以洁净室的净化空调系统开动后能立即（1min以内）达到稳定状态。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"层流方式是指流线平行、流向单一、具有一定的和均匀的断面速度的气流组织方式，送入房间的气流充满整个洁净室断面，它像“活塞作用”那样把室内随时产主的灰尘压至下风侧，再把灰尘排至室外。由于这种方式是以要求室内断面上有一定风速为前提的，所以洁净室的净化空调系统开动后能立即（1min以内）达到稳定状态。   （√）"},{"id":"J618","type":"judgment","number":618,"stem":"空气过滤器中粗效空气过滤器宜设置在新风口。一般采用易于清洗和更换的粗、中孔泡沫塑料或其它滤料用于新凤过滤，过滤对象是大于10μm的尘粒，严禁使用油浸过滤器。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"空气过滤器中粗效空气过滤器宜设置在新风口。一般采用易于清洗和更换的粗、中孔泡沫塑料或其它滤料用于新凤过滤，过滤对象是大于10μm的尘粒，严禁使用油浸过滤器。   （√）"},{"id":"J619","type":"judgment","number":619,"stem":"空气过滤器中中效空气过滤器设置在设施系统的正压处。一般采用中，细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"空气过滤器中中效空气过滤器设置在设施系统的正压处。一般采用中，细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。   （√）"},{"id":"J620","type":"judgment","number":620,"stem":"空气过滤器中高效空气过滤器设置在设施系统的正压处。一般采用中，细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"空气过滤器中高效空气过滤器设置在设施系统的正压处。一般采用中，细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。   （×）","explanation":"题干实际描述的是中效过滤器的设置、材料和1～10μm过滤范围，不是高效过滤器。"},{"id":"J621","type":"judgment","number":621,"stem":"空气过滤器中中效空气过滤器设置在设施系统的末端。一般采用玻璃纤维滤纸，石棉纤维滤纸和合成纤维滤纸等三类滤料的滤器，主要用于过滤小于1μm的尘粒。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"空气过滤器中中效空气过滤器设置在设施系统的末端。一般采用玻璃纤维滤纸，石棉纤维滤纸和合成纤维滤纸等三类滤料的滤器，主要用于过滤小于1μm的尘粒。   （×）","explanation":"高效过滤器通常设置在系统末端，采用高效滤材过滤更细微粒；题干把高效和中效过滤器的特点对调了。"},{"id":"J622","type":"judgment","number":622,"stem":"生物洁净技术设施内洁净度要求为10万级以下的空气净化处理，应采用初效、中效、高效空气过滤器三级过滤。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"生物洁净技术设施内洁净度要求为10万级以下的空气净化处理，应采用初效、中效、高效空气过滤器三级过滤。   （√）"},{"id":"J623","type":"judgment","number":623,"stem":"生物洁净技术设施内洁净度要求为10万级以下的空气净化处理，应采用初效、中效空气过滤器二级过滤即可。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"生物洁净技术设施内洁净度要求为10万级以下的空气净化处理，应采用初效、中效空气过滤器二级过滤即可。   （×）","explanation":"洁净度10万级以下的空气净化通常应采用初效、中效和高效三级过滤，二级过滤不足。"},{"id":"J624","type":"judgment","number":624,"stem":"感染性动物实验设施通常的防护主要靠物理学隔离原理，采用负压通风达到防止有害气溶胶扩散的目的。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"感染性动物实验设施通常的防护主要靠物理学隔离原理，采用负压通风达到防止有害气溶胶扩散的目的。   （√）"},{"id":"J625","type":"judgment","number":625,"stem":"隔离装置内的空气、饲料、水、垫料和设备均为无菌，动物和物料的动态传递须经特殊的传递系统，该系统既能保证与环境的绝对隔离，又能满足转运动物时保持内环境一致。该环境设施适用于饲育无特定病原体、悉生及无菌实验动物。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"隔离装置内的空气、饲料、水、垫料和设备均为无菌，动物和物料的动态传递须经特殊的传递系统，该系统既能保证与环境的绝对隔离，又能满足转运动物时保持内环境一致。该环境设施适用于饲育无特定病原体、悉生及无菌实验动物。   （√）"},{"id":"J626","type":"judgment","number":626,"stem":"实验动物设施应选建在远离疫区和公害污染的地区，有便利和充足的后勤供应（水、电、给排水系统和交通运输等）。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施应选建在远离疫区和公害污染的地区，有便利和充足的后勤供应（水、电、给排水系统和交通运输等）。   （√）"},{"id":"J627","type":"judgment","number":627,"stem":"实验动物设施建设应坚固、耐用、经济、有防虫、鸟和鼠等野生动物的能力，施工和建筑材料要严格符合设计要求，最好预留可扩大的余地。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施建设应坚固、耐用、经济、有防虫、鸟和鼠等野生动物的能力，施工和建筑材料要严格符合设计要求，最好预留可扩大的余地。   （√）"},{"id":"J628","type":"judgment","number":628,"stem":"实验动物设施最好为独立结构，具有各种完整的相应职能区域，做到区域隔离以便满足对各种不同动物品种、品系饲养和保证动物质量的需要。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施最好为独立结构，具有各种完整的相应职能区域，做到区域隔离以便满足对各种不同动物品种、品系饲养和保证动物质量的需要。   （√）"},{"id":"J629","type":"judgment","number":629,"stem":"实验动物设施应该有必要的保证满足设施功能、环境和微生物控制的设备和措施。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施应该有必要的保证满足设施功能、环境和微生物控制的设备和措施。   （√）"},{"id":"J630","type":"judgment","number":630,"stem":"实验动物设施应能保证动物健康，人员安全，并不对周围环境造成污染。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施应能保证动物健康，人员安全，并不对周围环境造成污染。   （√）"},{"id":"J631","type":"judgment","number":631,"stem":"实验动物设施应该有适当地防灾和安全（应急发电、防火、防生物污染、防灾等突发事故）应对措施，保证设施正常运转。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施应该有适当地防灾和安全（应急发电、防火、防生物污染、防灾等突发事故）应对措施，保证设施正常运转。   （√）"},{"id":"J632","type":"judgment","number":632,"stem":"实验动物设施的总体设计应严格遵守国家和地方对建设的相关法律、法规和规定。在城市规划、消防安全、环境保护、卫生防疫、建筑要求等方面按着现有法规进行切合实际的设计。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的总体设计应严格遵守国家和地方对建设的相关法律、法规和规定。在城市规划、消防安全、环境保护、卫生防疫、建筑要求等方面按着现有法规进行切合实际的设计。   （√）"},{"id":"J633","type":"judgment","number":633,"stem":"实验动物设施的设计应全面布局，预计发展趋势，明确建设的可行性。设施的应用目的是指导设计的最基本指南，重要的是饲养品种，微生物控制等级，动物实验的种类和范围。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的设计应全面布局，预计发展趋势，明确建设的可行性。设施的应用目的是指导设计的最基本指南，重要的是饲养品种，微生物控制等级，动物实验的种类和范围。   （√）"},{"id":"J634","type":"judgment","number":634,"stem":"实验动物设施的设计应以国家实验动物的相关标准为设计依据，确定微生物控制级别，相应设施类型即可确定。要按国家标准中相应规定，根据环境控制要求、建筑要求、区划要求、按建筑规范进行设计。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的设计应以国家实验动物的相关标准为设计依据，确定微生物控制级别，相应设施类型即可确定。要按国家标准中相应规定，根据环境控制要求、建筑要求、区划要求、按建筑规范进行设计。   （√）"},{"id":"J635","type":"judgment","number":635,"stem":"实验动物设施尤其是屏障环境是一个高耗能建筑，其电能及其他运转消耗会占将来总运转成本的60％以上，可见节能设计是将来设施运转能否进行的主要问题，在保障达到使用目的的前提下，尽可能采取节能设计。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施尤其是屏障环境是一个高耗能建筑，其电能及其他运转消耗会占将来总运转成本的60％以上，可见节能设计是将来设施运转能否进行的主要问题，在保障达到使用目的的前提下，尽可能采取节能设计。   （√）"},{"id":"J636","type":"judgment","number":636,"stem":"屏障环境实验动物设施区域应划分明确，布局紧凑，方便运行，注意对特殊功能单元的物理隔离和有机联系，主要功能区动物饲育和实验单元在总面积中所占比例尽可能大。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"屏障环境实验动物设施区域应划分明确，布局紧凑，方便运行，注意对特殊功能单元的物理隔离和有机联系，主要功能区动物饲育和实验单元在总面积中所占比例尽可能大。   （√）"},{"id":"J637","type":"judgment","number":637,"stem":"屏障环境实验动物设施区域人员、物品、动物的进出路线单向流动，尽可能避免往返交叉。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"屏障环境实验动物设施区域人员、物品、动物的进出路线单向流动，尽可能避免往返交叉。   （√）"},{"id":"J638","type":"judgment","number":638,"stem":"屏障环境实验动物设施区域气流方向应从高洁净区向低洁净区。气压梯度遵守洁净走廊>洁净准备室>动物生产区（实验区）>污物走廊>非洁净区。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"屏障环境实验动物设施区域气流方向应从高洁净区向低洁净区。气压梯度遵守洁净走廊>洁净准备室>动物生产区（实验区）>污物走廊>非洁净区。   （√）"},{"id":"J639","type":"judgment","number":639,"stem":"屏障环境实验动物设施区域气流方向应从高洁净区向低洁净区。气压梯度遵守洁净走廊>动物生产区（实验区）>洁净准备室>污物走廊>非洁净区。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"屏障环境实验动物设施区域气流方向应从高洁净区向低洁净区。气压梯度遵守洁净走廊>动物生产区（实验区）>洁净准备室>污物走廊>非洁净区。   （×）","explanation":"按本题库口径，屏障设施压差梯度应为洁净走廊＞洁净准备室＞动物生产区/实验区＞污物走廊＞非洁净区；题干把洁净准备室和动物区顺序写反。"},{"id":"J640","type":"judgment","number":640,"stem":"实验动物设施的走廊应考虑到必要设备的运输，一般宽在2m左右，地面与墙壁的接合处应为弧形，以便于清洁。为防止墙体损坏，最好加护栏或缓冲装置。各种水、电、管、线应尽量安排在走廊或走廊上部夹层中，并且不暴露在明处。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的走廊应考虑到必要设备的运输，一般宽在2m左右，地面与墙壁的接合处应为弧形，以便于清洁。为防止墙体损坏，最好加护栏或缓冲装置。各种水、电、管、线应尽量安排在走廊或走廊上部夹层中，并且不暴露在明处。   （√）"},{"id":"J641","type":"judgment","number":641,"stem":"实验动物设施的门：除负压室之外原则上应向外开，应向压力大的方向开启。门宽和所需设备及饲育用具的大小相称。门要求气密性好，室内装锁，能自行关闭。把手、门锁不外露。门上设观察孔。最好用耐水、耐药性的金属密封门。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物设施的门：除负压室之外原则上应向外开，应向压力大的方向开启。门宽和所需设备及饲育用具的大小相称。门要求气密性好，室内装锁，能自行关闭。把手、门锁不外露。门上设观察孔。最好用耐水、耐药性的金属密封门。   （×）","explanation":"实验动物设施的门不能一概规定“除负压室外均向外开”；开启方向需服从压差控制、安全疏散和设施设计，同时保证气密、自闭等要求。"},{"id":"J642","type":"judgment","number":642,"stem":"实验动物设施的窗：屏障环境多不设外窗或尽可能少设窗。一般动物除需要自然采光与通风的场所外，不宜设置外窗。设有外窗的动物室，如猴类动物房，应在墙上加设栏栅和铁丝网以防止动物逃跑。寒冷地区窗上有防结霜措施。在非清洁区设置的外窗，尽量做到气密性完好。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的窗：屏障环境多不设外窗或尽可能少设窗。一般动物除需要自然采光与通风的场所外，不宜设置外窗。设有外窗的动物室，如猴类动物房，应在墙上加设栏栅和铁丝网以防止动物逃跑。寒冷地区窗上有防结霜措施。在非清洁区设置的外窗，尽量做到气密性完好。   （√）"},{"id":"J643","type":"judgment","number":643,"stem":"实验动物设施的地面要用耐水、耐磨、耐腐蚀性材料制成。一般常用环氧树脂，硬面混凝土、水磨石、氯丁二烯橡胶、硬橡胶等常用保护性涂层。地面要光滑防水。地面接墙处圆弧面","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物设施的地面要用耐水、耐磨、耐腐蚀性材料制成。一般常用环氧树脂，硬面混凝土、水磨石、氯丁二烯橡胶、硬橡胶等常用保护性涂层。地面要光滑防水。地面接墙处圆弧面   （×）","explanation":"动物设施地面除耐水、耐磨、耐腐蚀外，还应便于清洗消毒并具有适当防滑性；不能简单要求成“光滑”而忽略防滑和无缝等要求。"},{"id":"J644","type":"judgment","number":644,"stem":"实验动物设施的墙壁：内壁粉刷用难以开裂、耐水、耐腐蚀、耐磨、耐冲击材料制成。墙面无断裂，光滑平整，各接角处接合严密，最好做成圆弧形。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的墙壁：内壁粉刷用难以开裂、耐水、耐腐蚀、耐磨、耐冲击材料制成。墙面无断裂，光滑平整，各接角处接合严密，最好做成圆弧形。   （√）"},{"id":"J645","type":"judgment","number":645,"stem":"实验动物设施的天花板要用耐水、耐腐蚀材料制成。室顶平整光滑。通常紫外线消毒灯、照明灯、超高效空气过滤器及进风口会安于天花板上。灯具及进气口周围必须密封。进气口可以自由拆卸清洗、消毒。要加防水层防止漏水。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物设施的天花板要用耐水、耐腐蚀材料制成。室顶平整光滑。通常紫外线消毒灯、照明灯、超高效空气过滤器及进风口会安于天花板上。灯具及进气口周围必须密封。进气口可以自由拆卸清洗、消毒。要加防水层防止漏水。   （√）"},{"id":"J646","type":"judgment","number":646,"stem":"屏障环境设施内动物饮水的灭菌小规模通常在普通自来水中加入次氯酸钠；另一种水的处理方法是在水中加入盐酸；第三种方法是用多孔的5μm、1μm陶器过滤器做两次过滤；第四种方法是用紫外线照射，为了达到良好的灭菌效果，许多动物室常将两种方法结合起来使用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"屏障环境设施内动物饮水的灭菌小规模通常在普通自来水中加入次氯酸钠；另一种水的处理方法是在水中加入盐酸；第三种方法是用多孔的5μm、1μm陶器过滤器做两次过滤；第四种方法是用紫外线照射，为了达到良好的灭菌效果，许多动物室常将两种方法结合起来使用。   （√）"},{"id":"J647","type":"judgment","number":647,"stem":"屏障环境设施内动物饮水应灭菌处理。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"屏障环境设施内动物饮水应灭菌处理。   （√）"},{"id":"J648","type":"judgment","number":648,"stem":"物料的灭菌如垫料、笼架、鼠盒和其他供应品等均采用高压灭菌，屏障动物室多采用通道式双门高压灭菌器，不能采用高压灭菌的物料可采用药液浸泡法消毒，屏障动物室通常通过药液渡槽将不能高压灭菌的物料传入屏障内。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"物料的灭菌如垫料、笼架、鼠盒和其他供应品等均采用高压灭菌，屏障动物室多采用通道式双门高压灭菌器，不能采用高压灭菌的物料可采用药液浸泡法消毒，屏障动物室通常通过药液渡槽将不能高压灭菌的物料传入屏障内。   （√）"},{"id":"J649","type":"judgment","number":649,"stem":"污染物会影响实验动物设施内消毒灭菌，粪便、脏垢、油污常使消毒药液不能直接作用于微生物，从而降低消毒的效果，彻底消毒前必须先洗净脏垢、油污，特别要注意清洗死角。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"污染物会影响实验动物设施内消毒灭菌，粪便、脏垢、油污常使消毒药液不能直接作用于微生物，从而降低消毒的效果，彻底消毒前必须先洗净脏垢、油污，特别要注意清洗死角。   （√）"},{"id":"J650","type":"judgment","number":650,"stem":"酸度（pH）会影响实验动物设施内消毒灭菌，环境酸度的微小变化对消毒药的活性影响很大，如氯胺T的最佳活性是pH6～7，二氯异氰尿钠在pH6～10，季胺化合物在pH9～10的碱性环境下最有效。因此，要根据环境酸碱度选用恰当的消毒剂。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"酸度（pH）会影响实验动物设施内消毒灭菌，环境酸度的微小变化对消毒药的活性影响很大，如氯胺T的最佳活性是pH6～7，二氯异氰尿钠在pH6～10，季胺化合物在pH9～10的碱性环境下最有效。因此，要根据环境酸碱度选用恰当的消毒剂。   （√）"},{"id":"J651","type":"judgment","number":651,"stem":"中和物质会影响实验动物设施内消毒灭菌，如阴离子清洁剂能降低氨化合物的活性，四醛化合物消毒之前最好用阳离子清洁剂，氨能中和福尔马林等。其他如硬水、肥皂、多种去污剂等也会使消毒剂失效。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"中和物质会影响实验动物设施内消毒灭菌，如阴离子清洁剂能降低氨化合物的活性，四醛化合物消毒之前最好用阳离子清洁剂，氨能中和福尔马林等。其他如硬水、肥皂、多种去污剂等也会使消毒剂失效。   （√）"},{"id":"J652","type":"judgment","number":652,"stem":"用过的垫料是实验动物室固体废弃物中（包括垫料、动物排泄物、动物尸体、纸张及其他物品）数量最大的废弃物，废弃物的量涉及废弃物处理费用的高低，减少废弃物的量是解决废弃物污染问题的最佳途径，可依据最大动物饲养空间估算废弃垫料的生产量，以安排贮存空间、运送工具和人力。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"用过的垫料是实验动物室固体废弃物中（包括垫料、动物排泄物、动物尸体、纸张及其他物品）数量最大的废弃物，废弃物的量涉及废弃物处理费用的高低，减少废弃物的量是解决废弃物污染问题的最佳途径，可依据最大动物饲养空间估算废弃垫料的生产量，以安排贮存空间、运送工具和人力。   （√）"},{"id":"J653","type":"judgment","number":653,"stem":"废弃物应定期清理，不做长期储存，动物房舍亦应设有足够的贮存空间，贮存暂时无法立刻处理的废弃物。废弃物储存区与其他区室分隔，尽量远离动物饲养区、人员休息区或场内主要运输线上。废弃物贮存室必须密闭，避免臭气外泄和防止苍蝇、蟑螂、啮齿类动物侵入。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"废弃物应定期清理，不做长期储存，动物房舍亦应设有足够的贮存空间，贮存暂时无法立刻处理的废弃物。废弃物储存区与其他区室分隔，尽量远离动物饲养区、人员休息区或场内主要运输线上。废弃物贮存室必须密闭，避免臭气外泄和防止苍蝇、蟑螂、啮齿类动物侵入。   （√）"},{"id":"J654","type":"judgment","number":654,"stem":"动物尸体是实验动物设施产生的主要废弃物之一。动物房舍中必须设置容量充足的冷藏设备以暂时贮存尸体。感染病原微生物或放射性物质的动物尸体，可以直接做掩埋处理或焚烧，感染性的动物尸体应该用装载生物危害物质的塑胶袋妥善包装，经蒸汽高温高压灭菌后，再以一般处理无害性动物尸体方法如置人冷冻库冷冻保存，尸体由冷冻库取出后需先解冻再予焚烧以避免燃烧不完全及浪费燃料。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物尸体是实验动物设施产生的主要废弃物之一。动物房舍中必须设置容量充足的冷藏设备以暂时贮存尸体。感染病原微生物或放射性物质的动物尸体，可以直接做掩埋处理或焚烧，感染性的动物尸体应该用装载生物危害物质的塑胶袋妥善包装，经蒸汽高温高压灭菌后，再以一般处理无害性动物尸体方法如置人冷冻库冷冻保存，尸体由冷冻库取出后需先解冻再予焚烧以避免燃烧不完全及浪费燃料。   （√）"},{"id":"J655","type":"judgment","number":655,"stem":"根据我国国家技术监督局发布的实验动物环境设施监测标准，环境监测的其他指标除氨气是动态的，其余都是具有静态和动态两重含义的指标。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"根据我国国家技术监督局发布的实验动物环境设施监测标准，环境监测的其他指标除氨气是动态的，其余都是具有静态和动态两重含义的指标。   （√）"},{"id":"J656","type":"judgment","number":656,"stem":"根据我国国家技术监督局发布的实验动物环境设施监测标准，环境监测的指标都具有静态和动态两重含义的指标。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"根据我国国家技术监督局发布的实验动物环境设施监测标准，环境监测的指标都具有静态和动态两重含义的指标。   （×）","explanation":"按本题库口径，除氨浓度主要按动态状态评价外，其余多项环境指标可有静态和动态含义，因此不能说所有指标都同时具有两重含义。"},{"id":"J657","type":"judgment","number":657,"stem":"我国对实验动物设施采取许可证管理办法，申请获得许可证时，必定通过国家指定环境监测中心的监测，并出示环境监测达标证明。此外，在不定期的抽检中，也会对有动物状况下某一时刻的环境状况进行环境监测。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"我国对实验动物设施采取许可证管理办法，申请获得许可证时，必定通过国家指定环境监测中心的监测，并出示环境监测达标证明。此外，在不定期的抽检中，也会对有动物状况下某一时刻的环境状况进行环境监测。   （√）"},{"id":"J658","type":"judgment","number":658,"stem":"我国对实验动物设施采取许可证管理办法，申请获得许可证时，只须通过自检监测，出示环境监测达标证明即可。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"我国对实验动物设施采取许可证管理办法，申请获得许可证时，只须通过自检监测，出示环境监测达标证明即可。   （×）","explanation":"申请实验动物设施许可证不能只凭单位自检；需按管理要求接受相应主管/检测机构的检查或监测并提供合格证明。"},{"id":"J659","type":"judgment","number":659,"stem":"实验动物环境监测有两个目的：一是了解设施内环境特性，从而可评价其功能，证实环境控制的程度；二是了解设施内环境是否持续合格，通过及时调控，从而保障设施的正常运行。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物环境监测有两个目的：一是了解设施内环境特性，从而可评价其功能，证实环境控制的程度；二是了解设施内环境是否持续合格，通过及时调控，从而保障设施的正常运行。   （√）"},{"id":"J660","type":"judgment","number":660,"stem":"实验动物环境设施检测仪器、仪器的量程、精度与分辩率应符合设施检测指标要求，可不必按计量部门的要求管理和使用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物环境设施检测仪器、仪器的量程、精度与分辩率应符合设施检测指标要求，可不必按计量部门的要求管理和使用。   （×）","explanation":"环境设施检测仪器不仅量程、精度和分辨率要满足要求，还必须按计量管理要求进行检定、校准和规范使用。"},{"id":"J661","type":"judgment","number":661,"stem":"实验动物环境设施内环境技术指标检测一般要求为静态检测。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物环境设施内环境技术指标检测一般要求为静态检测。   （√）"},{"id":"J662","type":"judgment","number":662,"stem":"实验动物环境设施内环境技术指标检测一般要求为动态检测,悬浮粒子，落下菌不在检测范围内。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"实验动物环境设施内环境技术指标检测一般要求为动态检测,悬浮粒子，落下菌不在检测范围内。   （×）","explanation":"实验动物环境设施技术指标通常按规定进行静态或规定状态检测，悬浮粒子和沉降/落下菌属于重要检测内容，并非不检测。"},{"id":"J663","type":"judgment","number":663,"stem":"SOP是标准化操作规程的简称，通常是指常规实验室操作要求如何进行，可不必以书面文件制订的规程，对于书面文件制定的规程要讲究可操作性、实用性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"SOP是标准化操作规程的简称，通常是指常规实验室操作要求如何进行，可不必以书面文件制订的规程，对于书面文件制定的规程要讲究可操作性、实用性。   （×）","explanation":"SOP即标准操作规程，应形成正式书面文件，内容要明确、可操作、可追溯，不能只靠口头“常规要求”。"},{"id":"J664","type":"judgment","number":664,"stem":"SOP(标准化操作规程）中记录每天应有1人记录、1人复核；原始记录中如有错误的地方可以随意涂改，记录如有相同地方，不能用“——”等方式表示。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"SOP(标准化操作规程）中记录每天应有1人记录、1人复核；原始记录中如有错误的地方可以随意涂改，记录如有相同地方，不能用“——”等方式表示。   （×）","explanation":"SOP记录原始数据如有错误不得随意涂改，应按规范更正并保留原记录痕迹；题干“可以随意涂改”错误。"},{"id":"J665","type":"judgment","number":665,"stem":"SOP(标准化操作规程）中记录每天只有1人记录；原始记录中如有错误的地方不得随意涂改，记录如有相同地方，不能用“——”等方式表示。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"SOP(标准化操作规程）中记录每天只有1人记录；原始记录中如有错误的地方不得随意涂改，记录如有相同地方，不能用“——”等方式表示。   （×）","explanation":"重要SOP记录通常应有记录和复核机制，不能概括为每天只有1人记录而无复核。"},{"id":"J666","type":"judgment","number":666,"stem":"实验动物笼器具制作须保证动物的健康、舒适，制作笼具的原材料要无毒。笼具要有可收容一定动物量的容积，符合动物要求的最小空间值。内外边角圆滑无毛剌。保证不损伤动物，尤其是足部。笼具要有利于通风、散热，给动物以舒适的内环境。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物笼器具制作须保证动物的健康、舒适，制作笼具的原材料要无毒。笼具要有可收容一定动物量的容积，符合动物要求的最小空间值。内外边角圆滑无毛剌。保证不损伤动物，尤其是足部。笼具要有利于通风、散热，给动物以舒适的内环境。   （√）"},{"id":"J667","type":"judgment","number":667,"stem":"不同级别的实验动物，其饮水的卫生标准是不一样的。对普通级动物来说，符合卫生标准的城市居民饮用水即可供其直接饮用。对于清洁级及其以上级别的实验动物来说，其饮用水必须经过灭菌处理。清洁级动物亦可应用酸化水（pH2.5～3.0）。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"不同级别的实验动物，其饮水的卫生标准是不一样的。对普通级动物来说，符合卫生标准的城市居民饮用水即可供其直接饮用。对于清洁级及其以上级别的实验动物来说，其饮用水必须经过灭菌处理。清洁级动物亦可应用酸化水（pH2.5～3.0）。   （√）"},{"id":"J668","type":"judgment","number":668,"stem":"给水设备必须按各级别实验动物的管理要求定期清洗消毒。饮水不必每天更换，也可以将饮水瓶由一个鼠盒随意移到另一个鼠盒上。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"给水设备必须按各级别实验动物的管理要求定期清洗消毒。饮水不必每天更换，也可以将饮水瓶由一个鼠盒随意移到另一个鼠盒上。   （×）","explanation":"饮水和饮水器具应按动物等级和SOP及时更换、清洗消毒；饮水瓶不得在不同鼠盒间随意互换，以免交叉污染。"},{"id":"J669","type":"judgment","number":669,"stem":"隔离器随功能不同可分为饲养隔离器，动物实验隔离器和手术隔离器等。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"隔离器随功能不同可分为饲养隔离器，动物实验隔离器和手术隔离器等。   （√）"},{"id":"J670","type":"judgment","number":670,"stem":"隔离器是保种及进行各种动物实验的最安全的设备。其维护要求简单，空间占有小，可用高品质动物进行试验的特点，使其具有广泛的应用价值。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"隔离器是保种及进行各种动物实验的最安全的设备。其维护要求简单，空间占有小，可用高品质动物进行试验的特点，使其具有广泛的应用价值。   （√）"},{"id":"J671","type":"judgment","number":671,"stem":"层流和普通气流不同，是具有线性流向的气流。层流架有前过滤器和高效过滤器，通过送风系统或吸引系统形成正压或负压两种层流空气。前者从架内吹出无菌无尘的层流空气，后者是室内空气由室内先进入饲育架，由吸引装置吸出污染空气经过过滤净化后排出动物室外。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"层流和普通气流不同，是具有线性流向的气流。层流架有前过滤器和高效过滤器，通过送风系统或吸引系统形成正压或负压两种层流空气。前者从架内吹出无菌无尘的层流空气，后者是室内空气由室内先进入饲育架，由吸引装置吸出污染空气经过过滤净化后排出动物室外。   （√）"},{"id":"J672","type":"judgment","number":672,"stem":"生物安全柜又称之为生物安全罩，是一种前开式正压通风柜。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"生物安全柜又称之为生物安全罩，是一种前开式正压通风柜。   （×）","explanation":"生物安全柜通过向内气流和过滤形成防护，工作区一般维持相对负压/定向气流，不是“前开式正压通风柜”。"},{"id":"J673","type":"judgment","number":673,"stem":"当有毒化学物质或放射性核物质被用作微生物研究或制药的添加物时，应使用专为此设计制造的II级生物安全柜。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"当有毒化学物质或放射性核物质被用作微生物研究或制药的添加物时，应使用专为此设计制造的II级生物安全柜。   （√）"},{"id":"J674","type":"judgment","number":674,"stem":"单体通风净化笼盒(IVC)是在动物笼盒中装置净化通风换气的饲养设备，适用于普通级以上动物实验、饲养。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"单体通风净化笼盒(IVC)是在动物笼盒中装置净化通风换气的饲养设备，适用于普通级以上动物实验、饲养。   （×）","explanation":"IVC用于需要独立通风和微环境控制的动物饲养，其适用等级要结合设施和系统设计，不能简单概括成“普通级以上均适用”。"},{"id":"J675","type":"judgment","number":675,"stem":"普通笼器具，是指不带有强制性空气净化装置的笼器具，它包括笼箱、笼架和饮水瓶以及带空气过滤帽的塑料笼等。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"普通笼器具，是指不带有强制性空气净化装置的笼器具，它包括笼箱、笼架和饮水瓶以及带空气过滤帽的塑料笼等。   （×）","explanation":"普通笼器具是不带强制空气净化装置的开放式笼具；带空气过滤帽的封闭塑料笼属于有过滤防护特征的笼具，不能简单归入普通笼器具。"},{"id":"J676","type":"judgment","number":676,"stem":"实验动物垫料要求容易获得，易于运输，便于储存，价格便宜。无灰尘，无污染，无芳香烃类气味，对人和动物无害。干燥，有良好的吸湿性，舒适，便于做窝，具有良好的保温性。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物垫料要求容易获得，易于运输，便于储存，价格便宜。无灰尘，无污染，无芳香烃类气味，对人和动物无害。干燥，有良好的吸湿性，舒适，便于做窝，具有良好的保温性。   （√）"},{"id":"J677","type":"judgment","number":677,"stem":"污秽的垫料应勤予清除并换以新垫料，以保持动物的清洁，干爽。更换的频度视动物的大小、密度、粪尿排出量和垫料的脏污程度，一般每周更换2次，如发现垫料被水浸湿，鼠盒内有死鼠，必须及时更换垫料。在有些情况下，垫料更换不应过度频繁，如怀孕后期及哺乳初期等阶段。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"污秽的垫料应勤予清除并换以新垫料，以保持动物的清洁，干爽。更换的频度视动物的大小、密度、粪尿排出量和垫料的脏污程度，一般每周更换2次，如发现垫料被水浸湿，鼠盒内有死鼠，必须及时更换垫料。在有些情况下，垫料更换不应过度频繁，如怀孕后期及哺乳初期等阶段。   （√）"},{"id":"J678","type":"judgment","number":678,"stem":"动物个体需得到均衡的营养成分，以维持正常的生理机能，其营养需求会因动物个体的生理状况如维持。生长及繁殖阶段，动物种类、年龄、性别而有所差异。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物个体需得到均衡的营养成分，以维持正常的生理机能，其营养需求会因动物个体的生理状况如维持。生长及繁殖阶段，动物种类、年龄、性别而有所差异。   （√）"},{"id":"J679","type":"judgment","number":679,"stem":"动物的营养素包括水、蛋自质及氨基酸、碳水化合物与脂肪、矿物质和维生素。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"动物的营养素包括水、蛋自质及氨基酸、碳水化合物与脂肪、矿物质和维生素。   （√）"},{"id":"J680","type":"judgment","number":680,"stem":"同种但不同品系的动物，因遗传基因的表达程度不同而影响营养的需求，如近交系小鼠与封闭群动物对蛋白质饲料需求，近交系小鼠要高些。灵长类动物或豚鼠，因缺乏L－谷氨酸氧化酶，必须人工添加维生素C。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"同种但不同品系的动物，因遗传基因的表达程度不同而影响营养的需求，如近交系小鼠与封闭群动物对蛋白质饲料需求，近交系小鼠要高些。灵长类动物或豚鼠，因缺乏L－谷氨酸氧化酶，必须人工添加维生素C。   （√）"},{"id":"J681","type":"judgment","number":681,"stem":"实验动物饮水量主要受动物的生理阶段、饲料性质及环境温度的影响。幼年动物、哺乳动物饮水量较多。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"实验动物饮水量主要受动物的生理阶段、饲料性质及环境温度的影响。幼年动物、哺乳动物饮水量较多。   （√）"},{"id":"J682","type":"judgment","number":682,"stem":"不同种类的实验动物和不同的实验目的，对饲料的加工要求也各不相同。如常用实验动物大鼠、小鼠、豚鼠、兔的饲料，应制成具有一定硬度、不同直径规格的颗粒饲料较为适合其摄食习性。狗、猫则以膨化饲料为好。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"不同种类的实验动物和不同的实验目的，对饲料的加工要求也各不相同。如常用实验动物大鼠、小鼠、豚鼠、兔的饲料，应制成具有一定硬度、不同直径规格的颗粒饲料较为适合其摄食习性。狗、猫则以膨化饲料为好。   （√）"},{"id":"J683","type":"judgment","number":683,"stem":"不同种类的实验动物和不同的实验目的，对饲料的加工要求也各不相同。如常用实验动物大鼠、小鼠、豚鼠、狗的饲料，应制成具有一定硬度、不同直径规格的颗粒饲料较为适合其摄食习性。兔、猫则以膨化饲料为好。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"不同种类的实验动物和不同的实验目的，对饲料的加工要求也各不相同。如常用实验动物大鼠、小鼠、豚鼠、狗的饲料，应制成具有一定硬度、不同直径规格的颗粒饲料较为适合其摄食习性。兔、猫则以膨化饲料为好。   （×）","explanation":"按题库对应正确表述，大鼠、小鼠、豚鼠、兔适合颗粒饲料，犬、猫更适合膨化饲料；题干把兔和犬的位置对调了。"},{"id":"J684","type":"judgment","number":684,"stem":"成品实验动物饲料贮存要分类存放，标志清楚，注明生产日期，不得与原料混贮。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"成品实验动物饲料贮存要分类存放，标志清楚，注明生产日期，不得与原料混贮。   （√）"},{"id":"J685","type":"judgment","number":685,"stem":"成品实验动物饲料贮存要分类存放，标志清楚，注明生产日期，也可与原料混贮。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"成品实验动物饲料贮存要分类存放，标志清楚，注明生产日期，也可与原料混贮。   （×）","explanation":"成品饲料应分类、标识并与原料分开贮存，不能与原料混贮，以防混淆和污染。"},{"id":"J686","type":"judgment","number":686,"stem":"一般饲料存放量不要过多，贮存时间不宜过长。原粮贮存3～6个月，粉状饲料1～2个月，动物性饲料1～3个月，成品颗粒料以不超过1个月为宜。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"一般饲料存放量不要过多，贮存时间不宜过长。原粮贮存3～6个月，粉状饲料1～2个月，动物性饲料1～3个月，成品颗粒料以不超过1个月为宜。   （√）"},{"id":"J687","type":"judgment","number":687,"stem":"饲料中多种成分经光照射后会起化学变化而破坏分解。常见者如核黄素、叶酸及维生素B12，因此制作、贮存、运送时，应将饲料放在阴暗处以减少营养成分的破坏。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"饲料中多种成分经光照射后会起化学变化而破坏分解。常见者如核黄素、叶酸及维生素B12，因此制作、贮存、运送时，应将饲料放在阴暗处以减少营养成分的破坏。   （√）"},{"id":"J688","type":"judgment","number":688,"stem":"饲料制作过程中如搅拌过度，会增加营养成分如维生素Ａ的氧化，添加抗氧化剂有助于减缓氧化的过程。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"饲料制作过程中如搅拌过度，会增加营养成分如维生素Ａ的氧化，添加抗氧化剂有助于减缓氧化的过程。   （√）"},{"id":"J689","type":"judgment","number":689,"stem":"饲料经干热和蒸汽处理会导致营养成分的变化，甚至产生有毒的物质和抗养分吸收的物质。加热处理对饲料的物理性状也会有影响，另外加热处理不当，会导致饲料发霉脂肪酸氧化，适口性下降。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"饲料经干热和蒸汽处理会导致营养成分的变化，甚至产生有毒的物质和抗养分吸收的物质。加热处理对饲料的物理性状也会有影响，另外加热处理不当，会导致饲料发霉脂肪酸氧化，适口性下降。   （√）"},{"id":"J690","type":"judgment","number":690,"stem":"采购的实验动物饲料除必需的维生素、微量元素、氨基酸添加剂外，通常不加任何饲料添加剂，但为了防止动物发生疾病，应加少量的抗生素。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"采购的实验动物饲料除必需的维生素、微量元素、氨基酸添加剂外，通常不加任何饲料添加剂，但为了防止动物发生疾病，应加少量的抗生素。   （×）","explanation":"实验动物饲料一般不应为“预防疾病”而常规加入抗生素，因为抗生素可能改变微生物群和实验指标；除非实验方案有明确需要。"},{"id":"J691","type":"judgment","number":691,"stem":"饲料的质量与稳定性会随储藏温度及湿度的变化而变化。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"饲料的质量与稳定性会随储藏温度及湿度的变化而变化。   （√）"},{"id":"J692","type":"judgment","number":692,"stem":"贮存的颗粒饲料含水率应低于11％，高于11％的饲料易霉变。贮藏在空调环境的由天然原料制造的饲料，应在6个月内使用完毕。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"贮存的颗粒饲料含水率应低于11％，高于11％的饲料易霉变。贮藏在空调环境的由天然原料制造的饲料，应在6个月内使用完毕。   （√）"},{"id":"J693","type":"judgment","number":693,"stem":"在制造及储存含高脂肪的特殊饲料时，应注意不饱和脂肪酸极易被氧化，造成必需脂肪 酸的不足。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"在制造及储存含高脂肪的特殊饲料时，应注意不饱和脂肪酸极易被氧化，造成必需脂肪 酸的不足。   （√）"},{"id":"J694","type":"judgment","number":694,"stem":"在制造及储存含高脂肪的特殊饲料时，应注意不饱和脂肪酸极易被氧化，造成必需脂肪酸的不足。脂肪氧化酸败后并无多大碍，仍可食用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"在制造及储存含高脂肪的特殊饲料时，应注意不饱和脂肪酸极易被氧化，造成必需脂肪酸的不足。脂肪氧化酸败后并无多大碍，仍可食用。   （×）","explanation":"含高脂肪饲料氧化酸败后会产生有害氧化产物并降低营养价值，不能继续作为合格饲料使用。"},{"id":"J695","type":"judgment","number":695,"stem":"在喂给高脂肪酸饲科，宜额外添加维生素，以减少体内过氧化反应。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"在喂给高脂肪酸饲科，宜额外添加维生素，以减少体内过氧化反应。   （√）"},{"id":"J696","type":"judgment","number":696,"stem":"氨基酸又分为必需氨基酸和非必需氨基酸两大类。前者是动物体内不能合成或合成速度及数量不能满足正常生长需要，必须由饲料中供给的氨基酸；后者是体内能合成，不需要由饲料中供给的氨基酸。不同动物对必需氨基酸需求的种类存在差异。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"氨基酸又分为必需氨基酸和非必需氨基酸两大类。前者是动物体内不能合成或合成速度及数量不能满足正常生长需要，必须由饲料中供给的氨基酸；后者是体内能合成，不需要由饲料中供给的氨基酸。不同动物对必需氨基酸需求的种类存在差异。   （√）"},{"id":"J697","type":"judgment","number":697,"stem":"脂肪能供给幼龄动物必需脂肪酸，如缺乏，则大鼠皮肤鳞片化，尾部坏死，生长停止，繁殖性能降低，严重可引起水肿及皮下出血。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"脂肪能供给幼龄动物必需脂肪酸，如缺乏，则大鼠皮肤鳞片化，尾部坏死，生长停止，繁殖性能降低，严重可引起水肿及皮下出血。   （√）"},{"id":"J698","type":"judgment","number":698,"stem":"氯是制造胃内盐酸的原料，实验动物体内及乳汁均含有一定数量的氯，饲料中加入一走量食盐以补充氯，起到调味、刺激唾液分泌、促进淀粉酶活性的作用。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"√","raw":"氯是制造胃内盐酸的原料，实验动物体内及乳汁均含有一定数量的氯，饲料中加入一走量食盐以补充氯，起到调味、刺激唾液分泌、促进淀粉酶活性的作用。   （√）"},{"id":"J699","type":"judgment","number":699,"stem":"商品化饲料的标签要求可根据用户需要再是否附有标签。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"商品化饲料的标签要求可根据用户需要再是否附有标签。   （×）","explanation":"商品化实验动物饲料应按要求有完整标签和质量信息，不是根据用户需要决定“可有可无”。"},{"id":"J700","type":"judgment","number":700,"stem":"能溶于脂肪的称水溶性维生素，如维生素K、E；能溶于水的称脂溶性维生素，如维生素B族和维生素C。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"能溶于脂肪的称水溶性维生素，如维生素K、E；能溶于水的称脂溶性维生素，如维生素B族和维生素C。   （×）","explanation":"脂溶性维生素包括A、D、E、K等；水溶性维生素包括B族和C。题干把脂溶性和水溶性名称完全颠倒了。"},{"id":"J701","type":"judgment","number":701,"stem":"能溶于脂肪的称脂溶性维生素，如维生素B族和维生素C；能溶于水的称水溶性维生素，如维生素K、E。","options":[{"label":"√","text":"正确"},{"label":"×","text":"错误"}],"answer":"×","raw":"能溶于脂肪的称脂溶性维生素，如维生素B族和维生素C；能溶于水的称水溶性维生素，如维生素K、E。   （×）","explanation":"脂溶性维生素应举A、D、E、K等；B族和C属于水溶性维生素。题干虽然名称次序正确，但举例正好互换。"},{"id":"S001","type":"single","number":1,"stem":"实验动物科学自 __________诞生以来，至今已成为一门具有自己理论体系的独立性学科。","options":[{"label":"A","text":"19世纪5 老的关系。      （ B ）\nA．转基因动物                   B．无菌动物和悉生动物\nC．免疫缺陷动物                 D．近交系动物"},{"id":"S007","type":"single","number":7,"stem":"__________ 的出现，使人体的肿瘤能异种移植到裸鼠，为抗癌药的筛选和研究肿瘤做出了贡献。","options":[{"label":"A","text":"转基因动物"},{"label":"B","text":"无菌动物和悉生动物"},{"label":"C","text":"免疫缺陷动物"},{"label":"D","text":"近交系动物"}],"answer":"C","raw":"__________ 的出现，使人体的肿瘤能异种移植到裸鼠，为抗癌药的筛选和研究肿瘤做出了贡献。 （ C ）\nA．转基因动物                   B．无菌动物和悉生动物\nC．免疫缺陷动物                 D．近交系动物"},{"id":"S008","type":"single","number":8,"stem":"实验动物资源       是必然趋势。","options":[{"label":"A","text":"专一化"},{"label":"B","text":"单纯化"},{"label":"C","text":"多样化"},{"label":"D","text":"有序化"}],"answer":"C","raw":"实验动物资源       是必然趋势。（ C ）\nA．专一化        B．单纯化         C．多样化         D．有序化"},{"id":"S009","type":"single","number":9,"stem":"人类第一个基因组草图于__________完成，宣告了人类基因组计划的完成。","options":[{"label":"A","text":"2000年6月"},{"label":"B","text":"2001年6月"},{"label":"C","text":"2002年6月"},{"label":"D","text":"2003年6月"}],"answer":"A","raw":"人类第一个基因组草图于__________完成，宣告了人类基因组计划的完成。       （ A ）\nA．2000年6月     B．2001年6月     C．2002年6月     D．2003年6月"},{"id":"S010","type":"single","number":10,"stem":"__________是继人之后第二个开始并完成基因组测序工程的哺乳类动物。","options":[{"label":"A","text":"大鼠"},{"label":"B","text":"小鼠"},{"label":"C","text":"猴"},{"label":"D","text":"犬"}],"answer":"B","raw":"__________是继人之后第二个开始并完成基因组测序工程的哺乳类动物。    （ B ）\nA．大鼠           B．小鼠          C．猴            D．犬"},{"id":"S011","type":"single","number":11,"stem":"与人类的功能基因的同源性高达90%以上。","options":[{"label":"A","text":"大鼠"},{"label":"B","text":"小鼠"},{"label":"C","text":"猴"},{"label":"D","text":"犬"}],"answer":"B","raw":"与人类的功能基因的同源性高达90%以上。   （ B ）\nA．大鼠           B．小鼠          C．猴            D．犬"},{"id":"S012","type":"single","number":12,"stem":"__________因其与人类的基因组序列、发育、生化代谢及生理特点相似性而成为研究人类基因功能的最为理想的模式动物。","options":[{"label":"A","text":"大鼠"},{"label":"B","text":"小鼠"},{"label":"C","text":"猴"},{"label":"D","text":"犬"}],"answer":"B","raw":"__________因其与人类的基因组序列、发育、生化代谢及生理特点相似性而成为研究人类 ．冬末至初春"},{"id":"S324","type":"single","number":324,"stem":"泰泽氏病所致疾病有肠型和肝型两种。肠型患病动物临床表现，剧烈腹泻，粪便呈褐色糊状乃至水样，肛门周围、尾巴及后肢污秽，又称________。","options":[{"label":"A","text":"“湿尾病”"},{"label":"B","text":"“环尾病”"},{"label":"C","text":"“脱尾病”"},{"label":"D","text":"“无尾病”"}],"answer":"A","raw":"泰泽氏病所致疾病有肠型和肝型两种。肠型患病动物临床表现，剧烈腹泻，粪便呈褐色糊状乃至水样，肛门周围、尾巴及后肢污秽，又称________。   （ A ）\nA．“湿尾病”      B．“环尾病”      C．“脱尾病”     D．“无尾病”"},{"id":"S325","type":"single","number":325,"stem":"泰泽氏病诊断根据流行病学、临床症状可做出初步诊断。肝脏的冰冻切片，坏死灶内找到 _______可确诊。","options":[{"label":"A","text":"螺旋菌"},{"label":"B","text":"毛样芽胞菌"},{"label":"C","text":"球杆菌或短杆菌"},{"label":"D","text":"毛样小孢子菌"}],"answer":"B","raw":"泰泽氏病诊断根据流行病学、临床症状可做出初步诊断。肝脏的冰冻切片，坏死灶内找到 _______可确诊。   （ B ）\nA．螺旋菌     B．毛样芽胞菌     C．球杆菌或短杆菌    D．毛样小孢子菌"},{"id":"S326","type":"single","number":326,"stem":"布氏杆菌病对生殖实验研究会带来影响，由于________，而导致实验的中断。","options":[{"label":"A","text":"动物死亡"},{"label":"B","text":"动物胚胎畸形"},{"label":"C","text":"动物难产"},{"label":"D","text":"动物的流产"}],"answer":"D","raw":"布氏杆菌病对生殖实验研究会带来影响，由于________，而导致实验的中断。   （ D ）\nA．动物死亡      B．动物胚胎畸形       C．动物难产    D．动物的流产"},{"id":"S327","type":"single","number":327,"stem":"预防布氏杆菌病，对狗群应在雌犬动情前数周用________进行普查，发现可疑病例，再用其他诊断方法进行确诊。","options":[{"label":"A","text":"生化反应"},{"label":"B","text":"ELISA"},{"label":"C","text":"玻片凝集试验"},{"label":"D","text":"免疫荧光反应"}],"answer":"C","raw":"预防布氏杆菌病，对狗群应在雌犬动情前数周用________进行普查，发现可疑病例，再用其他诊断方法进行确诊。   （ C ）\nA．生化反应       B．ELISA      C．玻片凝集试验       D．免疫荧光反应"},{"id":"S328","type":"single","number":328,"stem":"多杀性巴氏杆菌可使动物发生出________，造成动物大批死亡。","options":[{"label":"A","text":"鼻炎"},{"label":"B","text":"血性败血症"},{"label":"C","text":"中耳炎"},{"label":"D","text":"生殖道疾病"}],"answer":"B","raw":"多杀性巴氏杆菌可使动物发生出________，造成动物大批死亡。   （ B ）\nA．鼻炎       B．血性败血症       C．中耳炎       D．生殖道疾病"},{"id":"S329","type":"single","number":329,"stem":"________的大、小鼠最容易感染支原体。","options":[{"label":"A","text":"中年"},{"label":"B","text":"幼龄鼠"},{"label":"C","text":"青年"},{"label":"D","text":"老年"}],"answer":"B","raw":"______ ______。   （ D ）\nA．《防止虐待动物法》           B．《动物保护法》\nC．《研究用动物法》             D．《实验动物管理与使用法》"},{"id":"S358","type":"single","number":358,"stem":"我国《实验动物质量管理法》是国家科技部和国家技术监督局于  ______ 联合制发的。","options":[{"label":"A","text":"1993年12月"},{"label":"B","text":"1997年12月"},{"label":"C","text":"2000年12月"},{"label":"D","text":"2004年12月"}],"answer":"B","raw":"我国《实验动物质量管理法》是国家科技部和国家技术监督局于  ______ 联合制发的。 （ B ）\nA．1993年12月    B．1997年12月    C．2000年12月   D．2004年12月"},{"id":"S359","type":"single","number":359,"stem":"国家实验动物质量检测中心（环境、病理）挂靠在 ______。","options":[{"label":"A","text":"中国药品制品检定所"},{"label":"B","text":"上海生物制品研究所"},{"label":"C","text":"中国医学科学院实验动物研究所"},{"label":"D","text":"中国农业科学院上海寄生虫研究所"}],"answer":"C","raw":"国家实验动物质量检测中心（环境、病理）挂靠在 ______。   （ C ）\nA．中国药品制品检定所                B．上海生物制品研究所\nC．中国医学科学院实验动物研究所     D．中国农业科学院上海寄生虫研究所"},{"id":"S360","type":"single","number":360,"stem":"我国已建立了哪一类实验动物的种子中心 ______。","options":[{"label":"A","text":"啮齿类实验动物中心"},{"label":"B","text":"实验兔种子中心"},{"label":"C","text":"Beagle犬种子中心"},{"label":"D","text":"小型猪种子中心"}],"answer":"A","raw":"我国已建立了哪一类实验动物的种子中心 ______。   （ A ）\nA．啮齿类实验动物中心         B．实验兔种子中心\nC．Beagle犬种子中心           D．小型猪种子中心"},{"id":"S361","type":"single","number":361,"stem":"关于实验动物种子的管理，下列哪一项是错误的  ______ 。","options":[{"label":"A","text":"国家实验动物种子中心是一个网络体系，由各具体品种或品系的实验动物中心共同  组"},{"label":"B","text":"国家实验动物种子中心统一负责实验动物的国外引种和为用户提供实验动物种子"},{"label":"C","text":"其他单位如有必要，可直接向国外引进国内没有的实验动物品种、品系作为实验动物种子向用户提供"},{"label":"D","text":"国家实验动物种子中心，可以是依托于高校科研院所的相对独立实体，也可以是独    立法人"}],"answer":"C","raw":"关于实验动物种子的管理，下列哪一项是错误的  ______ 。   （ C ）\nA．国家实验动物种子中心是一个网络体系，由各具体品种或品系的实验动物中心共同  组\nB．国家实验动物种子中心统一负责实验动物的国外引种和为用户提供实验动物种子\nC．其他单位如有必要，可直接向国外引进国内没有的实验动物品种、品系作为实验动物种子向用户提供\nD．国家实验动物种子中心，可以是依托于高校科研院所的相对独立实体，也可以是独    立法人"},{"id":"S362","type":"single","number":362,"stem":"下列叙述中，违背《实验动物管理条例》精神的是  ______。","options":[{"label":"A","text":"实验动物繁育室和动物实验室应设在同一区域，按同样的要求进行管理"},{"label":"B","text":"对不同等级的实验动物，应当按照相应的微生物控制标准进行管理"},{"label":"C","text":"实验动物的保种、饲育应采用国内 495","type":"single","number":495,"stem":"实验动物在繁殖过程中，产生与自己相似的个体，以保证物种世代延续。这种子代在形态、生理、生化等方面的特征与亲代的一致性，称为______。","options":[{"label":"A","text":"遗传"},{"label":"B","text":"变异"},{"label":"C","text":"延续"},{"label":"D","text":"繁殖"}],"answer":"A","raw":"实验动物在繁殖过程中，产生与自己相似的个体，以保证物种世代延续。这种子代在形态、生理、生化等方面的特征与亲代的一致性，称为______。   （ A ）\nA．遗传          B．变异             C．延续          D．繁殖"},{"id":"S496","type":"single","number":496,"stem":"控制性状的一对基因不论在纯合或杂交状态时，每个基因都保持各自的独立性，在形成性细胞时，基因分离各自分配到各个性细胞中，这是孟德尔遗传的哪种基本定律        。","options":[{"label":"A","text":"分离定律"},{"label":"B","text":"自由组合定律"},{"label":"C","text":"自由组合定律"},{"label":"D","text":"随机定律"}],"answer":"A","raw":"控制性状的一对基因不论在纯合或杂交状态时，每个基因都保持各自的独立性，在形成性细胞时，基因分离各自分配到各个性细胞中，这是孟德尔遗传的哪种基本定律        。   （ A ）\n A．分离定律     B．自由组合定律     C．自由组合定律     D．随机定律"},{"id":"S497","type":"single","number":497,"stem":"两对（或多对）相对性状遗传，形成性细胞时，每对性状基因的分离与其他性状的基因分离无关，不同性状的基因组合在一个性细胞中完全是随机的，两性细胞结合成合子，基因型的组合也是随机的，这是孟德尔遗传的______。","options":[{"label":"A","text":"分离定律"},{"label":"B","text":"自由组合定律"},{"label":"C","text":"独立定律"},{"label":"D","text":"随机定律"}],"answer":"B","raw":"两对（或多对）相对性状遗传，形成性细胞时，每对性状基因的分离与其他性状的基因分离无关，不同性状的基因组合在一个性细胞中完全是随机的，两性细胞结合成合子，基因型的组合也是随机的，这是孟德尔遗传的______。   （ B ）\n A．分离定律      B．自由组合定律       C．独立定律       D．随机定律"},{"id":"S498","type":"single","number":498,"stem":"一种生物的基因数目远远多于染色体的数目，因而一条染色体上存在多个基因，很多基因存在于同一条染色体上，称为______。","options":[{"label":"A","text":"基因连锁"},{"label":"B","text":"基因同体"},{"label":"C","text":"基因同株"},{"label":"D","text":"染色体同体"}],"answer":"A","raw":"一种生物的基因数目远远多于染色体的数目，因而一条染色体上存在多个基因，很多基因存在于同一条染色体上，称为______。   （ A ）\nA．基因连锁      B．基因同体       C．基因同株       D．染色体同体"},{"id":"S499","type":"single","number":499,"stem":"用圆头表示着丝点、黑线表示按细胞学长度比例染色体的相对遗传长度，说明小鼠各染色体上基因之间位置关系及其距离的图谱称为______。","options":[{"label":"A","text":"小鼠基因连锁图"},{"label":"B","text":"小鼠基因同体图"},{"label":"C","text":"小鼠基因同株图"},{"label":"D","text":"小鼠染色体同体图"}],"answer":"A","raw":"用圆头表示着丝点、黑线表示按细胞学长度比例染色体的相对遗传长度，说明小鼠各染色体上基因之间位置关系及其距离的图谱称为______。   （ A ）\nA．小鼠基因连锁图 验动物微生物和寄生虫的检测取样数量：每个小鼠、大鼠、地鼠、豚鼠和兔生产繁殖单元以及每个犬、猴生产繁殖群体，根据动物多少，取样数量也不同，群体大小>500时，取样数量为 ______。","options":[{"label":"A","text":">5只"},{"label":"B","text":">10只"},{"label":"C","text":">20只"},{"label":"D","text":">50只"}],"answer":"C","raw":"实验动物微生物和寄生虫的检测取样数量：每个小鼠、大鼠、地鼠、豚鼠和兔生产繁殖单元以及每个犬、猴生产繁殖群体，根据动物多少，取样数量也不同，群体大小>500时，取样数量为 ______。（ C ）\n A．>5只        B．>10只           C．>20只           D．>50只"},{"id":"S538","type":"single","number":538,"stem":"实验动物微生物和寄生虫的检测取样数量：每个隔离器检测取样______。","options":[{"label":"A","text":"1只"},{"label":"B","text":"2只"},{"label":"C","text":"5只"},{"label":"D","text":"10只"}],"answer":"B","raw":"实验动物微生物和寄生虫的检测取样数量：每个隔离器检测取样______。   （ B ）\nA．1只          B．2只            C．5只            D．10只"},{"id":"S539","type":"single","number":539,"stem":"鼠癣螨的宿主是______。","options":[{"label":"A","text":"大鼠"},{"label":"B","text":"小鼠"},{"label":"C","text":"豚鼠"},{"label":"D","text":"地鼠"}],"answer":"B","raw":"鼠癣螨的宿主是______。   （ B ）\nA．大鼠          B．小鼠           C．豚鼠            D．地鼠"},{"id":"S540","type":"single","number":540,"stem":"鼠肉螨的宿主是______。","options":[{"label":"A","text":"大鼠"},{"label":"B","text":"小鼠"},{"label":"C","text":"豚鼠"},{"label":"D","text":"地鼠"}],"answer":"B","raw":"鼠肉螨的宿主是______。   （ B ）\nA．大鼠          B．小鼠           C．豚鼠            D．地鼠"},{"id":"S541","type":"single","number":541,"stem":"动物实验是对演出型施加一定的处理，为求得动物对处理结果的可重复性，就要求演出型的稳定。动物对实验处理的反应可用以下公式表示：R＝（A＋B＋C）×D＋E，其中D代表______。","options":[{"label":"A","text":"动物种的共同反应"},{"label":"B","text":"品种及品系特有的反应"},{"label":"C","text":"个体反应（个体差异）"},{"label":"D","text":"环境影响"}],"answer":"D","raw":"动物实验是对演出型施加一定的处理，为求得动物对处理结果的可重复性，就要求演出型的稳定。动物对实验处理的反应可用以下公式表示：R＝（A＋B＋C）×D＋E，其中D代表______。   （ D ）\n A．动物种的共同反应                 B．品种及品系特有的反应\n C．个体反应（个体差异）             D．环境影响"},{"id":"S542","type":"single","number":542,"stem":"对动物的生殖系统是一个强烈的刺激因素，起定时器作用的环境因素是______。","options":[{"label":"A","text":"温度"},{"label":"B","text":"光照"},{"label":"C","text":"换气次数"},{"label":"D","text":"湿度"}],"answer":"B","raw":"对动物的生殖系统是一个强烈的刺激因素，起定时器作用的环境因素是______。   （ B ）\nA．温度         B．光照         C．换气次数          D．湿度"},{"id":"S543","type":"single","number":543,"stem":"实验动物设施中的空调系统集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。这是______。","options":[{"label":"A","text":"集中式空调系统"},{"label":"B","text":"半集中式空调系统"},{"label":"C","text":"局部式空调系统"},{"label":"D","text":"半局部式空调系统"}],"answer":"A","raw":"实验动物设施中的空调系统集中冷源（冷机、水泵）系统，并将全部空气处理设备（风机、空气表冷器、加湿器、过滤器、加热器等）都集中在同一机房内，将处理过的空气通过风道（管）、风口送至实验动物屏障设施区域内。这是______。   （ A ）\n A．集中式空调系统                   B．半集中式空调系统\n C．局部式空调系统                   D．半局部式空调系统"},{"id":"S544","type":"single","number":544,"stem":"______是利用稀释作用，使室内尘源产生的灰尘均匀扩散而被“冲淡”，满足工艺和人的卫生要求，避免涡流把工作区外的灰尘卷入工作区，以减少产品的污染机会。一般采用上送下回的形式，使气流自上而下，与尘粒重力沉降方向一致。","options":[{"label":"A","text":"空气乱流"},{"label":"B","text":"空气层流"},{"label":"C","text":"空气矢流"},{"label":"D","text":"空气逆流"}],"answer":"A","raw":"______是利用稀释作用，使室内尘源产生的灰尘均匀扩散而被“冲淡”，满足工艺和人的卫生要求，避免涡流把工作区外的灰尘卷入工作区，以减少产品的污染机会。一般采用上送下回的形式，使气流自上而下，与尘粒重力沉降方向一致。   （ A ）\nA．空气乱流       B．空气层流        C．空气矢流        D．空气逆流"},{"id":"S545","type":"single","number":545,"stem":"流线平行、流向单一、具有一定的、均匀的断面速度的气流组织方式，送入房间的气流充满整个洁净室断面，它像“活塞作用”那样把室内随时产的灰尘压至下风侧，再把灰尘排至室外。这称为______。","options":[{"label":"A","text":"空气乱流"},{"label":"B","text":"空气层流"},{"label":"C","text":"空气矢流"},{"label":"D","text":"空气逆流"}],"answer":"D","raw":"流线平行、流向单一、具有一定的、均匀的断面速度的气流组织方式，送入房间的气流充满整个洁净室断面，它像“活塞作用”那样把室内随时产的灰尘压至下风侧，再把灰尘排至室外。这称为______。   （ D ）\nA．空气乱流         B．空气层流       C．空气矢流        D．空气逆流"},{"id":"S546","type":"single","number":546,"stem":"采用弧形送风口送风，于侧上角送风，对侧下角回风。它是一种新型的气流组织方式，其净化功能是靠流线不交叉的气流的推动作用，将室内污染物排出室外。这称为______。","options":[{"label":"A","text":"空气乱流"},{"label":"B","text":"空气层流"},{"label":"C","text":"空气矢流"},{"label":"D","text":"空气逆流"}],"answer":"C","raw":"采用弧形送风口送风，于侧上角送风，对侧下角回风。它是一种新型的气流组织方式，其净化功能是靠流线不交叉的气流的推动作用，将室内污染物排出室外。这称为______。   （ C ）\nA．空气乱流        B．空气层流         C．空气矢流      D．空气逆流"},{"id":"S547","type":"single","number":547,"stem":"______设置在新风口。一般采用易于清洗和更换的粗、中孔泡沫塑料或其它滤料用于新风过滤，过滤对象是大于10μm的尘粒。","options":[{"label":"A","text":"粗效空气过滤器"},{"label":"B","text":"中效空气过滤器"},{"label":"C","text":"高效空气过滤器"},{"label":"D","text":"超效空气过滤器"}],"answer":"A","raw":"______设置在新风口。一般采用易于清洗和更换的粗、中孔泡沫塑料或其它滤料用于新风过滤，过滤对象是大于10μm的尘粒。   （ A ）\nA．粗效空气过滤器                        B．中效空气过滤器\nC．高效空气过滤器                        D．超效空气过滤器"},{"id":"S548","type":"single","number":548,"stem":"______设置在设施系统的正压处。一般采用中、细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。","options":[{"label":"A","text":"粗效空气过滤器"},{"label":"B","text":"中效空气过滤器"},{"label":"C","text":"高效空气过滤器"},{"label":"D","text":"超效空气过滤器"}],"answer":"B","raw":"______设置在设施系统的正压处。一般采用中、细孔泡沫塑料或其它纤维，滤料的过滤器，用于过滤新风及回风，延长高效空气过滤器使用年限，过滤对象是1-10μm的尘粒。   （ B ）\nA．粗效空气过滤器                         B．中效空气过滤器\nC．高效空气过滤器                         D．超效空气过滤器"},{"id":"S549","type":"single","number":549,"stem":"______设置在设施系统的末端。一般采用玻璃纤维滤纸，石棉纤维滤纸和合成纤维滤纸等三类滤料的滤器，主要用于过滤小于1μm的尘粒。","options":[{"label":"A","text":"粗效空气过滤器"},{"label":"B","text":"中效空气过滤器"},{"label":"C","text":"高效空气过滤器"},{"label":"D","text":"超效空气过滤器"}],"answer":"C","raw":"______设置在设施系统的末端。一般采用玻璃纤维滤纸，石棉纤维滤纸和合成纤维滤纸等三类滤料的滤器，主要用于过滤小于1μm的尘粒。   （ C ）\nA．粗效空气过滤器                         B．中效空气过滤器\nC．高效空气过滤器                         D．超效空气过滤器"},{"id":"S550","type":"single","number":550,"stem":"______是一种活病原微生物的动物实验设施，该设施重点要求具备防止危险有害因素向设施外传播和扩散的结构和功能。通常的防护主要靠物理学隔离原理，采用负压通风达到防止有害气溶胶扩散的目的。","options":[{"label":"A","text":"生物安全柜"},{"label":"B","text":"生物安全度"},{"label":"C","text":"病原危害"},{"label":"D","text":"病原危害度"}],"answer":"A","raw":"______是一种活病原微生物的动物实验设施，该设施重点要求具备防止危险有害因素向设施外传播和扩散的结构和功能。通常的防护主要靠物理学隔离原理，采用负压通风达到防止有害气溶胶扩散的目的。   （ A ）\nA．生物安全柜       B．生物安全度      C．病原危害      D．病原危害度"},{"id":"S551","type":"single","number":551,"stem":"在生物医学研究中，为防止传染病源或其一部分通过直接传染或环境的间接传播对健康人体、动物或植物存在确实或潜在的危害，必须在______中进行。","options":[{"label":"A","text":"感染性动物实验设施"},{"label":"B","text":"病原性动物实验设施"},{"label":"C","text":"负压动物实验设施"},{"label":"D","text":"控制性动物实验设施"}],"answer":"A","raw":"在生物医学研究中，为防    （ B ）\nA．粗饲料         B．青绿饲料        C．青贮饲料        D．能量饲料"},{"id":"S580","type":"single","number":580,"stem":"______是指利用青贮技术，使青饲料处于厌氧条件下，利用乳酸菌发酵产生乳酸，使青饲料处于pH 3.8～4.2的环境中，从而较好地保存原有营养价值的青饲料。","options":[{"label":"A","text":"粗饲料"},{"label":"B","text":"青绿饲料"},{"label":"C","text":"青贮饲料"},{"label":"D","text":"能量饲料"}],"answer":"C","raw":"______是指利用青贮技术，使青饲料处于厌氧条件下，利用乳酸菌发酵产生乳酸，使青饲料处于pH 3.8～4.2的环境中，从而较好地保存原有营养价值的青饲料。   （ C ）\nA．粗饲料        B．青绿饲料         C．青贮饲料        D．能量饲料"},{"id":"S581","type":"single","number":581,"stem":"______是指粗纤维含量不足18％，或每千克饲料干物质中含消化能10467kJ以上的饲料。主要有谷类籽实、块根、块茎类饲料及其加工副产品。","options":[{"label":"A","text":"粗饲料"},{"label":"B","text":"青绿饲料"},{"label":"C","text":"青贮饲料"},{"label":"D","text":"能量饲料"}],"answer":"D","raw":"______是指粗纤维含量不足18％，或每千克饲料干物质中含消化能10467kJ以上的饲料。主要有谷类籽实、块根、块茎类饲料及其加工副产品。   （ D ）\nA．粗饲料        B．青绿饲料        C．青贮饲料        D．能量饲料"},{"id":"S582","type":"single","number":582,"stem":"______是指根据饲养动物的营养需要，将多种饲料原料按饲料配方经工业化生产的均匀混合物。","options":[{"label":"A","text":"配合饲料"},{"label":"B","text":"浓缩饲料"},{"label":"C","text":"添加剂预混料"},{"label":"D","text":"代乳饲料"}],"answer":"A","raw":"______是指根据饲养动物的营养需要，将多种饲料原料按饲料配方经工业化生产的均匀混合物。   （ A ）\nA．配合饲料       B．浓缩饲料       C．添加剂预混料     D．代乳饲料"},{"id":"S583","type":"single","number":583,"stem":"______是以蛋白质饲料为主，混以矿物质和添加剂预混料配比而成。不能直接饲喂动物，须按说明与能量饲料或粗饲料混合后才可使用。","options":[{"label":"A","text":"配合饲料"},{"label":"B","text":"浓缩饲料"},{"label":"C","text":"添加剂预混料"},{"label":"D","text":"代乳饲料"}],"answer":"B","raw":"______是以蛋白质饲料为主，混以矿物质和添加剂预混料配比而成。不能直接饲喂动物，须按说明与能量饲料或粗饲料混合后才可使用。   （ B ）\nA．配合饲料       B．浓缩饲料       C．添加剂预混料     D．代乳饲料"},{"id":"S584","type":"single","number":584,"stem":"由营养物质添加剂（如各种氨基酸和维生素等）和非营养物质添加剂（如促生长剂、黏合剂和防霉剂等），按各种饲料配方需要加上必要的载体配制成各种添加剂预混料，分别包装，在配料时按比例加入。这是______。","options":[{"label":"A","text":"配合饲料"},{"label":"B","text":"浓缩饲料"},{"label":"C","text":"添加剂预混料"},{"label":"D","text":"代乳饲料"}],"answer":"C","raw":"由营养物质添加剂（如各种氨基酸和维生素等）和非营养物质添加剂（如促生长剂、黏合剂和防霉剂等），按各种饲料配方需要加上必要的载体配制成各种添加剂预混料，分别包装，在配料时按比例加入。这是______。   （ C ） 需氨基酸"},{"label":"C","text":"植物性氨基酸"},{"label":"D","text":"动物性氨基酸"}],"answer":"B","raw":"实验动物饲料中蛋白质由氨基酸组成，饲料中的蛋白质必须分解成氨基酸，才能被吸收。体内能合成，不需要由饲料中供给的氨基酸，它是______。   （ B ）\nA．必需氨基酸    B．非必需氨基酸   C．植物性氨基酸    D．动物性氨基酸"},{"id":"S591","type":"single","number":591,"stem":"______作为能量的主要来源在植物性饲料中含量丰富，约占全部营养物质的70％，是构成机体组织及生命物质的重要成分，也可变为脂肪贮存在体内。","options":[{"label":"A","text":"碳水化合物"},{"label":"B","text":"蛋白质"},{"label":"C","text":"氨基酸"},{"label":"D","text":"脂肪"}],"answer":"A","raw":"______作为能量的主要来源在植物性饲料中含量丰富，约占全部营养物质的70％，是构成机体组织及生命物质的重要成分，也可变为脂肪贮存在体内。   （ A ）\nA．碳水化合物       B．蛋白质       C．氨基酸        D．脂肪"},{"id":"S592","type":"single","number":592,"stem":"碳水化合物可分为两类，一种对实验动物肠粘膜有刺激作用，可促进胃肠蠕动和粪便的排泄，在反刍动物的瘤胃和兔的盲肠内，经微生物的发酵作用，一部分变为脂肪酸为动物利用。它是______。","options":[{"label":"A","text":"粗纤维"},{"label":"B","text":"细纤维"},{"label":"C","text":"无氮浸出物"},{"label":"D","text":"含氮浸出物"}],"answer":"A","raw":"碳水化合物可分为两类，一种对实验动物肠粘膜有刺激作用，可促进胃肠蠕动和粪便的排泄，在反刍动物的瘤胃和兔的盲肠内，经微生物的发酵作用，一部分变为脂肪酸为动物利用。它是______。   （ A ）\nA．粗纤维        B．细纤维        C．无氮浸出物       D．含氮浸出物"},{"id":"S593","type":"single","number":593,"stem":"碳水化合物可分为两类，一类是提供热能及转化成脂肪的重要物质。它是______。","options":[{"label":"A","text":"粗纤维"},{"label":"B","text":"细纤维"},{"label":"C","text":"无氮浸出物"},{"label":"D","text":"含氮浸出物"}],"answer":"C","raw":"碳水化合物可分为两类，一类是提供热能及转化成脂肪的重要物质。它是______。   （ C ）\nA．粗纤维       B．细纤维         C．无氮浸出物       D．含氮浸出物"},{"id":"S594","type":"single","number":594,"stem":"实验动物饲料中的脂肪可分成两大类。其中由脂肪酸与甘油结合而成的是______。","options":[{"label":"A","text":"真脂肪"},{"label":"B","text":"类脂肪"},{"label":"C","text":"次脂肪"},{"label":"D","text":"混脂肪"}],"answer":"A","raw":"实验动物饲料中的脂肪可分成两大类。其中由脂肪酸与甘油结合而成的是______。   （ A ）\nA．真脂肪       B．类脂肪         C．次脂肪         D．混脂肪"},{"id":"S595","type":"single","number":595,"stem":"实验动物饲料中的脂肪可分成两大类。其中由脂肪酸、甘油及其他含氮物质如磷脂、糖脂等结合而成的是______。","options":[{"label":"A","text":"真脂肪"},{"label":"B","text":"类脂肪"},{"label":"C","text":"次脂肪"},{"label":"D","text":"混脂肪"}],"answer":"B","raw":"实验动物饲料中的脂肪可分成两大类。其中由脂肪酸、甘油及其他含氮物质如磷脂、糖脂等结合而成的是______。   （ B [{"label":"A","text":"实验动物"},{"label":"B","text":"野生动物"},{"label":"C","text":"经济动物"},{"label":"D","text":"观赏动物"}],"answer":"ABCD","raw":"实验用动物包括 _________ 。（ ABCD ）\nA．实验动物      B．野生动物          C．经济动物        D．观赏动物"},{"id":"M006","type":"multiple","number":6,"stem":"新的实验动物种系或新的模型动物为生命科学的各个领域提供了 ______。","options":[{"label":"A","text":"可靠的手段"},{"label":"B","text":"有用的技术平台"},{"label":"C","text":"先进的工具"},{"label":"D","text":"新型的材料"}],"answer":"ABCD","raw":"新的实验动物种系或新的模型动物为生命科学的各个领域提供了 ______。   （ ABCD ）\nA．可靠的手段    B．有用的技术平台    C．先进的工具      D．新型的材料"},{"id":"M007","type":"multiple","number":7,"stem":"______实验动物保种单位保存品系在2000种以上，已基本被国际实验动物界所公认。","options":[{"label":"A","text":"Jackson 实验室"},{"label":"B","text":"英国BK公司"},{"label":"C","text":"美国查士利华公司"},{"label":"D","text":"美国国立卫生研究院（NIH）"}],"answer":"AD","raw":"______实验动物保种单位保存品系在2000种以上，已基本被国际实验动物界所公认。   （ AD ）\nA．Jackson 实验室                      B．英国BK公司\nC．美国查士利华公司                    D．美国国立卫生研究院（NIH）"},{"id":"M008","type":"multiple","number":8,"stem":"21世纪实验动物生产更趋向于的发展道路。","options":[{"label":"A","text":"专业化"},{"label":"B","text":"商品化"},{"label":"C","text":"规模化"},{"label":"D","text":"集约化"}],"answer":"ABCD","raw":"21世纪实验动物生产更趋向于的发展道路。   （ ABCD ）\nA．专业化       B．商品化      C．规模化           D．集约化"},{"id":"M009","type":"multiple","number":9,"stem":"21世纪动物实验将形成的服务网络。","options":[{"label":"A","text":"专建专用"},{"label":"B","text":"开放性"},{"label":"C","text":"政府统一控制"},{"label":"D","text":"区域性"}],"answer":"BD","raw":"21世纪动物实验将形成的服务网络。   （ BD ）\nA．专建专用     B．开放性      C．政府统一控制     D．区域性"},{"id":"M010","type":"multiple","number":10,"stem":"功能基因组学将会解决储存在基因组中的遗传语言， ______。","options":[{"label":"A","text":"揭示基因之间相互作用和关系"},{"label":"B","text":"大规模、系统的研究基因功能及其在生理和病理过程中的作用"},{"label":"C","text":"揭示单基因和多基因协同表达和功能相互作用的奥秘"},{"label":"D","text":"认识、分离、鉴定、克隆所有基因"}],"answer":"ABCD","raw":"功能基因组学将会解决储存在基因组中的遗传语言， ______。   （ ABCD ）\nA．揭示基因之间相互作用和关系\nB．大规模、系统的研究基因功能及其在生理和病理过程中的作用\nC．揭示单基因和多基因协同表达和功能相互作用的奥秘\nD．认识、分离、鉴定、克隆所有基因"},{"id":"M011","type":"multiple","number":11,"stem":"当前国外实验动物的“3R”运动指的是动物实验的 ______ 。","options":[{"label":"A","text":"减少"},{"label":"B","text":"替代"},{"label":"C","text":"废止"},{"label":"D","text":"优化"}],"answer":"ABD","raw":"当前国外实验动物的“3R”运动指的是动物实验的 ______ 。         （ ABD ）\nA．减少          B．替代        C．废止        D．优化"},{"id":"M012","type":"multiple","number":12,"stem":"反对或不允许用动物作实验是愚昧的，这是因为 ______。","options":[{"label":"A","text":"在对人的各种生理现象和病理机制及疾病的防治研究中，实验动物是人的替代者"},{"label":"B","text":"实验动物是“活的精密仪器”"},{"label":"C","text":"实验动物是医药工业上生产疫苗、诊断用血清、某些诊断用抗原、免疫血清等的重要材料"},{"label":"D","text":"实验动物是检验生物医药质量的天平，制药和化工产品如不用实验动物进行安全评价，应用于人类将会造成十分严重的恶果"}],"answer":"ABCD","raw":"反对或不允许用动物作实验是愚昧的，这是因为 ______。   （ ABCD ）\nA．在对人的各种生理现象和病理机制及疾病的防治研究中，实验动物是人的替代者\nB．实验动物是“活的精密仪器”\nC．实验动物是医药工业上生产疫苗、诊断用血清、某些诊断用抗原、免疫血清等的重要材料\nD．实验动物是检验生物医药质量的天平，制药和化工产品如不用实验动物进行安全评价，应用于人类将会造成十分严重的恶果"},{"id":"M013","type":"multiple","number":13,"stem":"下列哪些行为符合“3R ” ______","options":[{"label":"A","text":"重视动物的生活与实验环境"},{"label":"B","text":"分批购买实验动物用于同一动物实验"},{"label":"C","text":"采用麻醉镇静、镇痛、安乐死等手段"},{"label":"D","text":"给予手术动物良好的术后护理"}],"answer":"ACD","raw":"下列哪些行为符合“3R ” ______   （ ACD ）\nA．重视动物的生活与实验环境              B．分批购买实验动物用于同一动物实验\nC．采用麻醉镇静、镇痛、安乐死等手段      D．给予手术动物良好的术后护理"},{"id":"M014","type":"multiple","number":14,"stem":"实验动物质量的不标准，会导致 ______","options":[{"label":"A","text":"科研论文的科学性及可行性降低，科研成果得不到公认"},{"label":"B","text":"动物实验的敏感性、重复性差，致使动物浪费严重"},{"label":"C","text":"实验动物的大批死亡"},{"label":"D","text":"生物制剂、药品的安全性、有效性评价试验得不到承认，影响出口"}],"answer":"ABD","raw":"实验动物质量的不标准，会导致 ______    （ ABD ）\nA．科研论文的科学性及可行性降低，科研成果得不到公认\nB．动物实验的敏感性、重复性差，致使动物浪费严重\nC．实验动物的大批死亡\nD．生物制剂、药品的安全性、有效性评价试验得不到承认，影响出口"},{"id":"M015","type":"multiple","number":15,"stem":"下列说法属于实验动物特定含义的是 ______     。","options":[{"label":"A","text":"经人工培育，遗传背景明确，来源清楚"},{"label":"B","text":"人工饲养的动物"},{"label":"C","text":"对其携带的微生物、寄生虫实行人工控制"},{"label":"D","text":"用于科学实验，药品、生物制品的生产和检定及其他科学研究"}],"answer":"ACD","raw":"下列说法属于实验动物特定含义的是 ______     。          （ ACD ）\nA．经人工培育，遗传背景明确，来源清楚 群带毒，带毒群体很难净化，会反复爆发疾病\nD．干扰实验结果"},{"id":"M132","type":"multiple","number":132,"stem":"实验动物传染病流行的基本环节是______。","options":[{"label":"A","text":"传染锁链"},{"label":"B","text":"传染源"},{"label":"C","text":"传播途径"},{"label":"D","text":"传染病易感的动物"}],"answer":"BCD","raw":"实验动物传染病流行的基本环节是______。   （ BCD ）\nA．传染锁链      B．传染源     C．传播途径     D．传染病易感的动物"},{"id":"M133","type":"multiple","number":133,"stem":"以下哪些属于传染源______。","options":[{"label":"A","text":"患病动物"},{"label":"B","text":"污染的垫料、饲料"},{"label":"C","text":"外表健康的带菌动"},{"label":"D","text":"空气"}],"answer":"AC","raw":"以下哪些属于传染源______。   （ AC ）\nA．患病动物     B．污染的垫料、饲料     C．外表健康的带菌动   D．空气"},{"id":"M134","type":"multiple","number":134,"stem":"实验动物传染病的流行强度除大流行外，还有______等流行形式。","options":[{"label":"A","text":"散发性"},{"label":"B","text":"地方流行性"},{"label":"C","text":"流行性"},{"label":"D","text":"爆发"}],"answer":"ABCD","raw":"实验动物传染病的流行强度除大流行外，还有______等流行形式。   （ ABCD ）\nA．散发性         B．地方流行性      C．流行性      D．爆发"},{"id":"M135","type":"multiple","number":135,"stem":"垂直传播方式有______。","options":[{"label":"A","text":"交配、舔咬等"},{"label":"B","text":"经胎盘传播"},{"label":"C","text":"经卵传播"},{"label":"D","text":"经产道传播"}],"answer":"BCD","raw":"垂直传播方式有______。   （ BCD ）\nA．交配、舔咬等    B．经胎盘传播     C．经卵传播    D．经产道传播"},{"id":"M136","type":"multiple","number":136,"stem":"实验动物不采用疫苗接种和药物防治疾病原因______。","options":[{"label":"A","text":"干扰实验结果，而使实验无效"},{"label":"B","text":"成为潜在的传染源"},{"label":"C","text":"经济上也不合算"},{"label":"D","text":"药物无效"}],"answer":"ABC","raw":"实验动物不采用疫苗接种和药物防治疾病原因______。   （ ABC ）\nA．干扰实验结果，而使实验无效           B．成为潜在的传染源\nC．经济上也不合算                       D．药物无效"},{"id":"M137","type":"multiple","number":137,"stem":"主要的灭菌方法有______。","options":[{"label":"A","text":"热灭菌法"},{"label":"B","text":"冷灭菌法"},{"label":"C","text":"消毒灵"},{"label":"D","text":"Co60辐照灭菌法"}],"answer":"ABD","raw":"主要的灭菌方法有______。   （ ABD ）\nA．热灭菌法       B．冷灭菌法      C．消毒灵      D．Co60辐照灭菌法"},{"id":"M138","type":"multiple","number":138,"stem":"主要的消毒方法有______。","options":[{"label":"A","text":"化学 究具有影响\nD．对代谢研究有影响"},{"id":"M144","type":"multiple","number":144,"stem":"鼠肝炎的主要临床症状有哪些______。","options":[{"label":"A","text":"嗜神经型肝炎病毒常引起中枢神经系统坏死"},{"label":"B","text":"嗜肠型肝炎病毒常引起肠内壁损伤"},{"label":"C","text":"嗜肝型肝炎病毒可引起肝坏死"},{"label":"D","text":"嗜肺型肝炎病毒可引起肺坏死"}],"answer":"ABC","raw":"鼠肝炎的主要临床症状有哪些______。   （ ABC ）\nA．嗜神经型肝炎病毒常引起中枢神经系统坏死\nB．嗜肠型肝炎病毒常引起肠内壁损伤\nC．嗜肝型肝炎病毒可引起肝坏死\nD．嗜肺型肝炎病毒可引起肺坏死"},{"id":"M145","type":"multiple","number":145,"stem":"流行性出血热的流行病学的特点______。","options":[{"label":"A","text":"自然宿主主要是小型啮齿类动物"},{"label":"B","text":"大、小鼠多表现为隐性感染，并长期向外排毒"},{"label":"C","text":"污染尘埃飞沫物形成气溶胶吸入感染被认为是最主要的传播途径"},{"label":"D","text":"也可以通过胎盘垂直传播"}],"answer":"ABCD","raw":"流行性出血热的流行病学的特点______。   （ ABCD ）\nA．自然宿主主要是小型啮齿类动物\nB．大、小鼠多表现为隐性感染，并长期向外排毒\nC．污染尘埃飞沫物形成气溶胶吸入感染被认为是最主要的传播途径\nD．也可以通过胎盘垂直传播"},{"id":"M146","type":"multiple","number":146,"stem":"兔病毒性出血热主要临床症状有哪些______。","options":[{"label":"A","text":"超急性型无任何前兆或稍有呆滞而突然死亡"},{"label":"B","text":"急性型精神很差体温高达41℃以上，死前突然兴奋挣扎"},{"label":"C","text":"慢性型多见于3月龄小兔，多数病兔可耐受而逐渐康复"},{"label":"D","text":"病兔突然死亡，临死前兴奋、挣扎、抽搐、惨叫"}],"answer":"ABCD","raw":"兔病毒性出血热主要临床症状有哪些______。   （ ABCD ）\nA．超急性型无任何前兆或稍有呆滞而突然死亡\nB．急性型精神很差体温高达41℃以上，死前突然兴奋挣扎\nC．慢性型多见于3月龄小兔，多数病兔可耐受而逐渐康复\nD．病兔突然死亡，临死前兴奋、挣扎、抽搐、惨叫"},{"id":"M147","type":"multiple","number":147,"stem":"犬瘟热常用的血清学诊断方法有______。","options":[{"label":"A","text":"中和试验"},{"label":"B","text":"补体结合试验"},{"label":"C","text":"荧光抗体法"},{"label":"D","text":"ELISA试验"}],"answer":"ABCD","raw":"犬瘟热常用的血清学诊断方法有______。   （ ABCD ）\nA．中和试验     B．补体结合试验     C．荧光抗体法     D．ELISA试验"},{"id":"M148","type":"multiple","number":148,"stem":"犬瘟热常采用免疫接种的部位______。","options":[{"label":"A","text":"脑内注射"},{"label":"B","text":"皮下注射"},{"label":"C","text":"肌肉注射"},{"label":"D","text":"静脉注射"}],"answer":"BC","raw":"犬瘟热常采用免疫接种的部位______。   （ BC ）\nA．脑内注射     B．皮下注射      C．肌肉注射      D．静脉注射"},{"id":"M149","type":"multiple","number":149,"stem":"犬细小病毒主要临床症状有______。","options":[{"label":"A","text":"3～4周龄仔犬多呈急性心肌炎症状，病死率达80%～100%"},{"label":"B","text":"5～6 s":[{"label":"A","text":"精神不振，食欲稍差"},{"label":"B","text":"体温升高至40~41℃"},{"label":"C","text":"右腹部有压痛，扁桃体发炎"},{"label":"D","text":"白细胞总数显著减少，血液凝固时间延长"}],"answer":"ABCD","raw":"犬病毒性肝炎主要临床症状有______。   （ ABCD ）\nA．精神不振，食欲稍差           B．体温升高至40~41℃\nC．右腹部有压痛，扁桃体发炎     D．白细胞总数显著减少，血液凝固时间延长"},{"id":"M156","type":"multiple","number":156,"stem":"检测血清中犬病毒性肝炎病毒的抗体的方法有_____。","options":[{"label":"A","text":"补体结合反应"},{"label":"B","text":"ELISA"},{"label":"C","text":"间接血凝反应"},{"label":"D","text":"荧光"}],"answer":"ABC","raw":"检测血清中犬病毒性肝炎病毒的抗体的方法有_____。   （ ABC ）\nA．补体结合反应                 B．ELISA\nC．间接血凝反应                 D．荧光"},{"id":"M157","type":"multiple","number":157,"stem":"犬病毒性肝炎给实验研究带来影响有______。","options":[{"label":"A","text":"犬发病和死亡，造成实验中断"},{"label":"B","text":"改变机体的酶系统和免疫反应性，影响实验研究的正常进行"},{"label":"C","text":"对实验人员造成危害"},{"label":"D","text":"对所有温血动物染病"}],"answer":"AB","raw":"犬病毒性肝炎给实验研究带来影响有______。   （ AB ）\nA．犬发病和死亡，造成实验中断\nB．改变机体的酶系统和免疫反应性，影响实验研究的正常进行\nC．对实验人员造成危害\nD．对所有温血动物染病"},{"id":"M158","type":"multiple","number":158,"stem":"猫泛白细胞减少症临床表现为______。","options":[{"label":"A","text":"以高热、呕吐、精神萎顿"},{"label":"B","text":"高死亡率"},{"label":"C","text":"腹泻、高度脱水"},{"label":"D","text":"明显的白细胞减少"}],"answer":"ABCD","raw":"猫泛白细胞减少症临床表现为______。   （ ABCD ）\nA．以高热、呕吐、精神萎顿       B．高死亡率\nC．腹泻、高度脱水               D．明显的白细胞减少"},{"id":"M159","type":"multiple","number":159,"stem":"猫泛白细胞减少症传染途径有______。","options":[{"label":"A","text":"直接接触"},{"label":"B","text":"经消化道"},{"label":"C","text":"呼吸道"},{"label":"D","text":"胎盘垂直"}],"answer":"ABCD","raw":"猫泛白细胞减少症传染途径有______。   （ ABCD ）\nA．直接接触       B．经消化道      C．呼吸道      D．胎盘垂直"},{"id":"M160","type":"multiple","number":160,"stem":"猴B病毒病流行病学的特点是______。","options":[{"label":"A","text":"野生猴B病毒抗体阳性率远高于自繁猴"},{"label":"B","text":"不同年龄、性别的猴均可感染B病毒"},{"label":"C","text":"不同性别的猴可感染B病毒有差异"},{"label":"D","text":"随年龄增长，B病毒抗体阳性率呈上升趋势"}],"answer":"ABD","raw":"猴B病毒病流行病学的特点是______。   （ ABD ）\nA．野生猴B病毒抗体阳性率远高于自繁猴\nB．不同年龄、性别的猴均可感染B病毒\nC．不同性别的猴可感染B病毒有差异\nD．随年龄增长，B病毒抗体阳性率呈上升趋势"},{"id":"M161","type":"multiple","number":161,"stem":"猴B病毒病主要临床症状有______。","options":[{"label":"A","text":"口腔病变，表现为水泡性溃疡或局部淋巴结肿大"},{"label":"B","text":"皮肤也易出现水泡和溃疡"},{"label":"C","text":"大多数猴临床症状明显"},{"label":"D","text":"病猴鼻内有少量粘液或脓性分泌物，常并发结膜炎和腹泻"}],"answer":"ABD","raw":"猴B病毒病主要临床症状有______。   （ ABD ）\nA．口腔病变，表现为水泡性溃疡或局部淋巴结肿大\nB．皮肤也易出现水泡和溃疡\nC．大多数猴临床症状明显\nD．病猴鼻内有少量粘液或脓性分泌物，常并发结膜炎和腹泻"},{"id":"M162","type":"multiple","number":162,"stem":"猴B病毒病预防控制的措施有______。","options":[{"label":"A","text":"单笼饲养"},{"label":"B","text":"定期检疫，淘汰阳性猴，逐步建立无B病毒感染猴群"},{"label":"C","text":"以自繁猴进行实验为主"},{"label":"D","text":"对野外捕获的野生猴，严格进行隔离检疫"}],"answer":"ABCD","raw":"猴B病毒病预防控制的措施有______。   （ ABCD ）\nA．单笼饲养\nB．定期检疫，淘汰阳性猴，逐步建立无B病毒感染猴群\nC．以自繁猴进行实验为主\nD．对野外捕获的野生猴，严格进行隔离检疫"},{"id":"M163","type":"multiple","number":163,"stem":"沙门氏菌病流行病学的特点是______。","options":[{"label":"A","text":"各种年龄的实验动物均可感染，但幼年实验动物更易感"},{"label":"B","text":"患病实验动物和带菌者是本病的主要传染源"},{"label":"C","text":"粪便、尿、乳汁以及流产的胎儿等均可排出病菌"},{"label":"D","text":"本病一年四季均可发生"}],"answer":"ABCD","raw":"沙门氏菌病流行病学的特点是______。   （ ABCD ）\nA．各种年龄的实验动物均可感染，但幼年实验动物更易感\nB．患病实验动物和带菌者是本病的主要传染源\nC．粪便、尿、乳汁以及流产的胎儿等均可排出病菌\nD．本病一年四季均可发生"},{"id":"M164","type":"multiple","number":164,"stem":"沙门氏菌病主要临床症状有______。","options":[{"label":"A","text":"急性型多呈爆发性流行，发病急，死亡快"},{"label":"B","text":"亚急性型动物被毛蓬松，食欲不振、腹泻、呆滞，呈肠炎症状"},{"label":"C","text":"慢性型症状较轻，消瘦或下痢样稀便"},{"label":"D","text":"部分呈隐性感染"}],"answer":"ABCD","raw":"沙门氏菌病主要临床症状有______。   （ ABCD ）\nA．急性型多呈爆发性流行，发病急，死亡快\nB．亚急性型动物被毛蓬松，食欲不振、腹泻、呆滞，呈肠炎症状\nC．慢性型症状较轻，消瘦或下痢样稀便\nD．部分呈隐性感染"},{"id":"M165","type":"multiple","number":165,"stem":"泰泽氏病的流行病学的特点是______。","options":[{"label":"A","text":"与气候、饲料等因素及饲养管理和卫生条件无关"},{"label":"B","text":"幼龄实验动物特别是初断乳的实验动物感染较严重，而且死亡率很高"},{"label":"C","text":"患病动物和带菌动物均可成为传染源"},{"label":"D","text":"由消化道、呼吸道等途径传播"}],"answer":"BCD","raw":"泰泽氏病的流行病学的特点是______。   （ BCD ）\nA．与气候、饲料等因素及饲养管理和卫生条件无关\nB．幼龄实验动物特别是初断乳的实验动物感染较严重，而且死亡率很高\nC．患病动物和带菌动物均可成为传染源\nD．由消化道、呼吸道等途径传播"},{"id":"M166","type":"multiple","number":166,"stem":"布氏杆菌病的流行病学的特点是______。","options":[{"label":"A","text":"传染源是发病动物"},{"label":"B","text":"主要传播途径是消化道"},{"label":"C","text":"发病动物的精液中有大量的病原菌存在"},{"label":"D","text":"可以通过破损的皮肤、粘膜侵入机体"}],"answer":"ABCD","raw":"布氏杆菌病的流行病学的特点是______。   （ ABCD ）\nA．传染源是发病动物\nB．主要传播途径是消化道\nC．发病动物的精液中有大量的病原菌存在\nD．可以通过破损的皮肤、粘膜侵入机体"},{"id":"M167","type":"multiple","number":167,"stem":"巴氏杆菌病主要临床症状有______。","options":[{"label":"A","text":"严重的鼻腔炎、副鼻腔炎"},{"label":"B","text":"动物肺炎"},{"label":"C","text":"嗜肺巴氏杆菌可引起小鼠和大鼠肺炎、中耳炎、结膜炎、皮下溃疡"},{"label":"D","text":"神经性疾病"}],"answer":"ABC","raw":"巴氏杆菌病主要临床症状有______。   （ ABC ）\nA．严重的鼻腔炎、副鼻腔炎\nB．动物肺炎\nC．嗜肺巴氏杆菌可引起小鼠和大鼠肺炎、中耳炎、结膜炎、皮下溃疡\nD．神经性疾病"},{"id":"M168","type":"multiple","number":168,"stem":"支原体病原体特征有______。","options":[{"label":"A","text":"能够独立生活的较小的微生物"},{"label":"B","text":"可以通过细胞滤器"},{"label":"C","text":"没有细胞壁，呈高度多形性"},{"label":"D","text":"营养要求不高，生长速度快"}],"answer":"ABC","raw":"支原体病原体特征有______。   （ ABC ）\nA．能够独立生活的较小的微生物       B．可以通过细胞滤器\nC．没有细胞壁，呈高度多形性         D．营养要求不高，生长速度快"},{"id":"M169","type":"multiple","number":169,"stem":"支原体病原体流行病学的特点是______。","options":[{"label":"A","text":"各种年龄的大、小鼠均易感，幼龄鼠更易感"},{"label":"B","text":"患病动物和带菌动物是主要传染源"},{"label":"C","text":"可经垂直传播途径传染，也可经接触、空气等途径传"},{"label":"D","text":"各种应激可促进本病的发生和流行"}],"answer":"ABCD","raw":"支原体病原体流行病学的特点是______。   （ ABCD ）\nA．各种年龄的大、小鼠均易感，幼龄鼠更易感\nB．患病动物和带菌动物是主要传染源\nC．可经垂直传播途径传染，也可经接触、空气等途径传\nD．各种应激可促进本病的发生和流行"},{"id":"M170","type":"multiple","number":170,"stem":"支原体感染动物给实验研究带来影响主要有______。","options":[{"label":"A","text":"动物大量死亡，实验中断"},{"label":"B","text":"影响生殖产科学方面的研究"},{"label":"C","text":"干扰肿瘤学、生殖生物学、基因剔除小鼠等生命科学研究"},{"label":"D","text":"关节炎支原体主要侵袭大鼠，引起多发性关节炎"}],"answer":"BCD","raw":"支原体感染动物给实验研究带来影响主要有______。   （ BCD ）\nA．动物大量死亡，实验中断\nB．影响生殖产科学方面的研究\nC．干扰肿瘤学、生殖生物学、基因剔除小鼠等生命科学研究\nD．关节炎支原体主要侵袭大鼠，引起多发性关节炎"},{"id":"M171","type":"multiple","number":171,"stem":"肺炎克雷伯杆菌病的流行病学的特点是______。","options":[{"label":"A","text":"人不可感染"},{"label":"B","text":"本病多呈散发或地方性流行，春秋季节发病"},{"label":"C","text":"克雷伯杆菌存在于土壤、水及农产品中"},{"label":"D","text":"动物主要是经呼吸道感染，也有经肠道感"}],"answer":"BCD","raw":"肺炎克雷伯杆菌病的流行病学的特点是______。   （ BCD ）\nA．人不可感染\nB．本病多呈散发或地方性流行，春秋季节发病\nC．克雷伯杆菌存在于土壤、水及农产品中\nD．动物主要是经呼吸道感染，也有经肠道感"},{"id":"M172","type":"multiple","number":172,"stem":"肺炎克雷氏杆菌病主要临床症状有______","options":[{"label":"A","text":"慢性经过性"},{"label":"B","text":"呼吸道感染为常见"},{"label":"C","text":"颈部淋巴结肿大、肺炎"},{"label":"D","text":"可引起肾和肝脓肿"}],"answer":"ABCD","raw":"肺炎克雷氏杆菌病主要临床症状有______   （ ABCD ）\nA．慢性经过性                    B．呼吸道感染为常见\nC．颈部淋巴结肿大、肺炎          D．可引起肾和肝脓肿"},{"id":"M173","type":"multiple","number":173,"stem":"志贺氏菌病的流行病学的特点是______。","options":[{"label":"A","text":"对人有致病性"},{"label":"B","text":"是经消化道感染"},{"label":"C","text":"发病猕猴和病原菌携带者是主要的传染病源"},{"label":"D","text":"呈散发或地方性流行"}],"answer":"ABC","raw":"志贺氏菌病的流行病学的特点是______。   （ ABC ）\nA．对人有致病性                                B．是经消化道感染\nC．发病猕猴和病原菌携带者是主要的传染病源      D．呈散发或地方性流行"},{"id":"M174","type":"multiple","number":174,"stem":"预防控制结核病的措施有______。","options":[{"label":"A","text":"加强检疫、隔离，防止疾病传入"},{"label":"B","text":"每年进行2～4次预防性消毒"},{"label":"C","text":"定期用结核菌素进行全群检疫"},{"label":"D","text":"饲喂犬、猫的肉制品应充分煮沸、消毒，牛乳必须巴氏消毒"}],"answer":"ABCD","raw":"预防控制结核病的措施有______。   （ ABCD ）\nA．加强检疫、隔离，防止疾病传入\nB．每年进行2～4次预防性消毒\nC．定期用结核菌素进行全群检疫\nD．饲喂犬、猫的肉制品应充分煮沸、消毒，牛乳必须巴氏消毒"},{"id":"M175","type":"multiple","number":175,"stem":"支气管败血波氏杆菌病的致病病原菌包括______。","options":[{"label":"A","text":"支气管波氏杆菌病"},{"label":"B","text":"百日咳波氏杆菌"},{"label":"C","text":"副百日咳波氏杆菌"},{"label":"D","text":"支气管败血波氏杆病"}],"answer":"BCD","raw":"支气管败血波氏杆菌病的致病病原菌包括______。   （ BCD ）\nA．支气管波氏杆菌病               B．百日咳波氏杆菌\nC．副百日咳波氏杆菌               D．支气管败血波氏杆病"},{"id":"M176","type":"multiple","number":176,"stem":"支气管败血波氏杆菌病主要临床症状有______。","options":[{"label":"A","text":"豚鼠拒食，伴有进行性体重下降和呼吸团难，导致虚脱和死亡，肺炎"},{"label":"B","text":"非人灵长类患病动物从鼻腔排出粘液性或粘液脓性鼻漏"},{"label":"C","text":"患病家兔分别为鼻炎型和支气管肺炎型"},{"label":"D","text":"鼻炎长期不愈，鼻腔流出粘液脓性分泌物"}],"answer":"ABCD","raw":"支气管败血波氏杆菌病主要临床症状有______。   （ ABCD ）\nA．豚鼠拒食，伴有进行性体重下降和呼吸团难，导致虚脱和死亡，肺炎\nB．非人灵长类患病动物从鼻腔排出粘液性或粘液脓性鼻漏\nC．患病家兔分别为鼻炎型和支气管肺炎型\nD．鼻炎长期不愈，鼻腔流出粘液脓性分泌物"},{"id":"M177","type":"multiple","number":177,"stem":"支气管败血波氏杆菌病预防控制措施有______。","options":[{"label":"A","text":"良好的饲养管理"},{"label":"B","text":"定期进行健康检查"},{"label":"C","text":"豚鼠不可与其他动物饲养在同一个房间内"},{"label":"D","text":"可用灭活的菌苗"}],"answer":"ABCD","raw":"支气管败血波氏杆菌病预防控制措施有______。   （ ABCD ）\nA．良好的饲养管理                            B．定期进行健康检查\nC．豚鼠不可与其他动物饲养在同一个房间内      D．可用灭活的菌苗"},{"id":"M178","type":"multiple","number":178,"stem":"棒状杆菌病的流行病学的特点是______。","options":[{"label":"A","text":"呈隐性感染"},{"label":"B","text":"机体免疫功能降低时，会呈急性爆发"},{"label":"C","text":"专性感染大、小鼠，不分年龄、性别和品系"},{"label":"D","text":"各品种间无的差异"}],"answer":"ABC","raw":"棒状杆菌病的流行病学的特点是______。   （ ABC ）\nA．呈隐性感染\nB．机体免疫功能降低时，会呈急性爆发\nC．专性感染大、小鼠，不分年龄、性别和品系\nD．各品种间无的差异"},{"id":"M179","type":"multiple","number":179,"stem":"棒状杆菌病主要临床症状有______。","options":[{"label":"A","text":"厌食、衰弱、消瘦、体重减轻"},{"label":"B","text":"眼和鼻腔流出分泌物、呼吸困难"},{"label":"C","text":"皮肤破溃"},{"label":"D","text":"关节肿胀"}],"answer":"ABCD","raw":"棒状杆菌病主要临床症状有______。   （ ABCD ）\nA．厌食、衰弱、消瘦、体重减轻       B．眼和鼻腔流出分泌物、呼吸困难\nC．皮肤破溃                         D．关节肿胀"},{"id":"M180","type":"multiple","number":180,"stem":"如何预防控制棒状杆菌病______。","options":[{"label":"A","text":"对动物进行定期预防治疗"},{"label":"B","text":"控制动物饲养和实验的环境"},{"label":"C","text":"动物饲养在屏障系统内"},{"label":"D","text":"使用清洁级以上级别的动物"}],"answer":"BCD","raw":"如何预防控制棒状杆菌病______。   （ BCD ）\nA．对动物进行定期预防治疗           B．控制动物饲养和实验的环境\nC．动物饲养在屏障系统内             D．使用清洁级以上级别的动物"},{"id":"M181","type":"multiple","number":181,"stem":"根据真菌的形态学特点，可将真菌分为两大类，分别是______。","options":[{"label":"A","text":"酵母样真菌"},{"label":"B","text":"丝状真菌（霉菌）"},{"label":"C","text":"浅部真菌"},{"label":"D","text":"深部真菌"}],"answer":"AB","raw":"根据真菌的形态学特点，可将真菌分为两大类，分别是______。   （ AB ）\nA．酵母样真菌    B．丝状真菌（霉菌）    C．浅部真菌    D．深部真菌"},{"id":"M182","type":"multiple","number":182,"stem":"实验动物中常见的病原真菌除了条件致病性真菌外，______也是最常见的两类致病性真菌。","options":[{"label":"A","text":"浅部真菌"},{"label":"B","t 瘤动物模型，诱发因素和条件可人为控制"},{"label":"D","text":"以上说法都不正确"}],"answer":"ABC","raw":"下列叙述正确的是 ______。   （ ABC ）\nA．自发性肿瘤更接近人发病情况\nB．大部分自发性肿瘤动物模型通过人为定向培养而成\nC．诱发性肿瘤动物模型，诱发因素和条件可人为控制\nD．以上说法都不正确"},{"id":"M293","type":"multiple","number":293,"stem":"被公认为的模式动物有 ______。","options":[{"label":"A","text":"兔"},{"label":"B","text":"果蝇"},{"label":"C","text":"线虫"},{"label":"D","text":"小鼠"}],"answer":"BCD","raw":"被公认为的模式动物有 ______。   （ BCD ）\nA．兔        B．果蝇       C．线虫       D．小鼠"},{"id":"M294","type":"multiple","number":294,"stem":"获得遗传工程动物模型的基本技术手段 ______。","options":[{"label":"A","text":"显微注射转基因技术"},{"label":"B","text":"基因定位突变技术"},{"label":"C","text":"基因化学诱变技术"},{"label":"D","text":"放射性诱变技术"}],"answer":"ABC","raw":"获得遗传工程动物模型的基本技术手段 ______。   （ ABC ）\nA．显微注射转基因技术           B．基因定位突变技术\nC．基因化学诱变技术             D．放射性诱变技术"},{"id":"M295","type":"multiple","number":295,"stem":"转基因动物在医学研究中主要有哪些方面的应用 ______。","options":[{"label":"A","text":"在免疫学研究中的应用"},{"label":"B","text":"在病毒性疾病研究中的应用"},{"label":"C","text":"在遗传病研究中的应用"},{"label":"D","text":"在肿瘤学及心血管疾病研究中的应用"}],"answer":"ABCD","raw":"转基因动物在医学研究中主要有哪些方面的应用 ______。   （ ABCD ）\nA．在免疫学研究中的应用        B．在病毒性疾病研究中的应用\nC．在遗传病研究中的应用        D．在肿瘤学及心血管疾病研究中的应用"},{"id":"M296","type":"multiple","number":296,"stem":"实验动物科学的重要性可概括 为_。","options":[{"label":"A","text":"是现代科学技术的重要组成部分"},{"label":"B","text":"是生命科学的基础和条件"},{"label":"C","text":"是衡量一个国家或一个科研单位科学研究水平的重要标志"},{"label":"D","text":"新的科学技术革命更需要实验动物科学"}],"answer":"ABCD","raw":"296.实验动物科学的重要性可概括 为_。 （ABCD)\nA.是现代科学技术的重要组成部分\nB.是生命科学的基础和条件\nC.是衡量一个国家或一个科研单位科学研究水平的重要标志\nD.新的科学技术革命更需要实验动物科学"},{"id":"M297","type":"multiple","number":297,"stem":"已经完成基因组测序工程的哺乳动物有_。","options":[{"label":"A","text":"小鼠"},{"label":"B","text":"大鼠"},{"label":"C","text":"人"},{"label":"D","text":"斑马鱼"}],"answer":"AC","raw":"297.已经完成基因组测序工程的哺乳动物有_。 （AC)\nA.小鼠 B.大鼠 C•人 D.斑马鱼"},{"id":"M298","type":"multiple","number":298,"stem":"下列哪些是由国家科技部颁布的有关实验动物管理的政策法 规_。","options":[{"label":"A","text":"《实验动物管理条例》"},{"label":"B","text":"《实验动物质量管理办法》
